<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luxury Obsidian Honeycomb Lattice Brushed Gold Architectural Background</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050506}
svg#stage{display:block;width:100%;height:100%}
@keyframes sheenSweep{
  0%{transform:translateX(-950px)}
  100%{transform:translateX(2850px)}
}
@keyframes ambientPulse{
  0%,100%{opacity:0.42;transform:scale(1)}
  50%{opacity:0.72;transform:scale(1.06)}
}
@keyframes tileElevate{
  0%,100%{transform:translate(0px,0px) scale(1);opacity:0.86}
  50%{transform:translate(0px,-5px) scale(1.018);opacity:1}
}
@keyframes tileShadowElevate{
  0%,100%{transform:translate(0px,2px) scale(0.99);opacity:0.25}
  50%{transform:translate(4px,14px) scale(1.025);opacity:0.92}
}
@keyframes tileBreathe{
  0%,100%{opacity:0.74}
  50%{opacity:0.98}
}
@keyframes glintPulse{
  0%,100%{opacity:0.12;transform:scale(0.65)}
  50%{opacity:0.92;transform:scale(1.18)}
}
.sheen-primary{animation:sheenSweep 10s linear infinite}
.sheen-secondary{animation:sheenSweep 10s linear infinite;animation-delay:-5s}
.ambient-glow{transform-origin:960px 540px;animation:ambientPulse 10s ease-in-out infinite}
.tile-elev{animation:tileElevate 10s ease-in-out infinite}
.tile-elev-fast{animation:tileElevate 5s ease-in-out infinite}
.shadow-elev{animation:tileShadowElevate 10s ease-in-out infinite}
.shadow-elev-fast{animation:tileShadowElevate 5s ease-in-out infinite}
.tile-breathe{animation:tileBreathe 10s ease-in-out infinite}
.glint{animation:glintPulse 5s ease-in-out infinite}
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="obsidianBg" cx="50%" cy="48%" r="72%" fx="50%" fy="44%">
      <stop offset="0%" stop-color="#1E2024"/>
      <stop offset="48%" stop-color="#111215"/>
      <stop offset="82%" stop-color="#08080A"/>
      <stop offset="100%" stop-color="#050506"/>
    </radialGradient>

    <radialGradient id="warmAmbient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.11"/>
      <stop offset="45%" stop-color="#8A6D1C" stop-opacity="0.045"/>
      <stop offset="100%" stop-color="#050506" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="cellObsidianA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D1F24"/>
      <stop offset="52%" stop-color="#121317"/>
      <stop offset="100%" stop-color="#08090B"/>
    </linearGradient>

    <linearGradient id="cellObsidianB" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#16181C"/>
      <stop offset="60%" stop-color="#0D0E11"/>
      <stop offset="100%" stop-color="#060608"/>
    </linearGradient>

    <linearGradient id="cellBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.22"/>
      <stop offset="38%" stop-color="#D4AF37" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
    </linearGradient>

    <linearGradient id="goldMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A6D1C"/>
      <stop offset="22%" stop-color="#D4AF37"/>
      <stop offset="42%" stop-color="#FDE68A"/>
      <stop offset="58%" stop-color="#C8A02E"/>
      <stop offset="80%" stop-color="#8A6D1C"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>

    <linearGradient id="goldMuted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A6D1C" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.68"/>
      <stop offset="100%" stop-color="#8A6D1C" stop-opacity="0.38"/>
    </linearGradient>

    <linearGradient id="sheenBeamPrimary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0"/>
      <stop offset="22%" stop-color="#D4AF37" stop-opacity="0.42"/>
      <stop offset="46%" stop-color="#FDE68A" stop-opacity="0.96"/>
      <stop offset="50%" stop-color="#FFFBEA" stop-opacity="1"/>
      <stop offset="54%" stop-color="#FDE68A" stop-opacity="0.96"/>
      <stop offset="78%" stop-color="#D4AF37" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="sheenBeamSecondary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0"/>
      <stop offset="30%" stop-color="#D4AF37" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#FDE68A" stop-opacity="0.72"/>
      <stop offset="70%" stop-color="#D4AF37" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="surfaceSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0"/>
      <stop offset="45%" stop-color="#D4AF37" stop-opacity="0.045"/>
      <stop offset="50%" stop-color="#FDE68A" stop-opacity="0.08"/>
      <stop offset="55%" stop-color="#D4AF37" stop-opacity="0.045"/>
      <stop offset="100%" stop-color="#FDE68A" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="58%" stop-color="#050506" stop-opacity="0"/>
      <stop offset="100%" stop-color="#020203" stop-opacity="0.78"/>
    </radialGradient>

    <radialGradient id="glintGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF2" stop-opacity="1"/>
      <stop offset="35%" stop-color="#FDE68A" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>

    <pattern id="pinstripeHatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#D4AF37" stroke-width="0.9" stroke-opacity="0.16"/>
      <line x1="5" y1="0" x2="5" y2="10" stroke="#030304" stroke-width="1.1" stroke-opacity="0.55"/>
    </pattern>

    <filter id="shadowBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <filter id="sheenGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <mask id="goldWireMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080">
      <rect x="0" y="0" width="1920" height="1080" fill="#000000"/>
      <g id="maskStrokes"></g>
    </mask>
  </defs>

  <rect width="1920" height="1080" fill="url(#obsidianBg)"/>
  <ellipse class="ambient-glow" cx="960" cy="540" rx="820" ry="520" fill="url(#warmAmbient)"/>

  <g id="tilesLayer"></g>

  <g opacity="0.95">
    <g class="sheen-primary">
      <rect x="-260" y="-420" width="520" height="2100" transform="rotate(28 0 540)" fill="url(#surfaceSheen)"/>
    </g>
    <g class="sheen-secondary">
      <rect x="-180" y="-420" width="360" height="2100" transform="rotate(28 0 540)" fill="url(#surfaceSheen)"/>
    </g>
  </g>

  <g id="wireframeSeam"></g>
  <g id="wireframeGold"></g>

  <g mask="url(#goldWireMask)" filter="url(#sheenGlow)">
    <g class="sheen-primary">
      <rect x="-340" y="-420" width="680" height="2100" transform="rotate(28 0 540)" fill="url(#sheenBeamPrimary)"/>
    </g>
    <g class="sheen-secondary">
      <rect x="-230" y="-420" width="460" height="2100" transform="rotate(28 0 540)" fill="url(#sheenBeamSecondary)"/>
    </g>
  </g>

  <g id="glintsLayer"></g>

  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>

<script>
(function(){
  const ns="http://www.w3.org/2000/svg";
  function el(tag,attrs){
    const n=document.createElementNS(ns,tag);
    for(const k in attrs)n.setAttribute(k,attrs[k]);
    return n;
  }
  function hexPts(r){
    const p=[];
    for(let i=0;i<6;i++){
      const a=(Math.PI/3)*i;
      p.push((r*Math.cos(a)).toFixed(2)+","+(r*Math.sin(a)).toFixed(2));
    }
    return p.join(" ");
  }
  function hexPtsAt(cx,cy,r){
    const p=[];
    for(let i=0;i<6;i++){
      const a=(Math.PI/3)*i;
      p.push((cx+r*Math.cos(a)).toFixed(2)+","+(cy+r*Math.sin(a)).toFixed(2));
    }
    return p.join(" ");
  }

  const tilesLayer=document.getElementById("tilesLayer");
  const wireframeSeam=document.getElementById("wireframeSeam");
  const wireframeGold=document.getElementById("wireframeGold");
  const maskStrokes=document.getElementById("maskStrokes");
  const glintsLayer=document.getElementById("glintsLayer");

  const R=74;
  const dx=1.5*R;
  const dy=Math.sqrt(3)*R;

  const ptsOuter=hexPts(R-2.2);
  const ptsHatch=hexPts(R-3.2);
  const ptsInner=hexPts(R-12.5);
  const ptsShadow=hexPts(R-1.5);

  const cols=20;
  const rows=11;

  for(let c=-1;c<=cols;c++){
    for(let r=-1;r<=rows;r++){
      const cx=c*dx;
      const cy=r*dy+((c&1)?dy*0.5:0);
      const hash=Math.abs(Math.sin(c*12.9898+r*78.233)*43758.5453)%1;
      const isHatched=Math.abs(c+r)%2===0;
      const isElevated=hash>0.64;
      const isFast=hash>0.86;
      const hasInnerFrame=hash>0.72;

      const phase10=-(((cx*0.0029+cy*0.0024+hash*4.2)%10)).toFixed(3);
      const phase5=-(((cx*0.0029+cy*0.0024+hash*2.8)%5)).toFixed(3);

      const cellWrap=el("g",{transform:"translate("+cx.toFixed(2)+","+cy.toFixed(2)+")"});

      if(isElevated){
        const sh=el("polygon",{
          points:ptsShadow,
          fill:"#010102",
          filter:"url(#shadowBlur)",
          class:isFast?"shadow-elev-fast":"shadow-elev",
          style:"animation-delay:"+(isFast?phase5:phase10)+"s"
        });
        cellWrap.appendChild(sh);
      }

      const body=el("g",{
        class:isElevated?(isFast?"tile-elev-fast":"tile-elev"):"tile-breathe",
        style:"animation-delay:"+(isElevated&&isFast?phase5:phase10)+"s"
      });

      body.appendChild(el("polygon",{
        points:ptsOuter,
        fill:isHatched?"url(#cellObsidianA)":"url(#cellObsidianB)",
        stroke:"url(#cellBevel)",
        "stroke-width":"1.1"
      }));

      if(isHatched){
        body.appendChild(el("polygon",{
          points:ptsHatch,
          fill:"url(#pinstripeHatch)"
        }));
      }

      if(hasInnerFrame){
        body.appendChild(el("polygon",{
          points:ptsInner,
          fill:"none",
          stroke:"url(#goldMuted)",
          "stroke-width":"0.85",
          opacity:"0.55"
        }));
      }

      cellWrap.appendChild(body);
      tilesLayer.appendChild(cellWrap);

      const wirePts=hexPtsAt(cx,cy,R);

      wireframeSeam.appendChild(el("polygon",{
        points:wirePts,
        fill:"none",
        stroke:"#040405",
        "stroke-width":"4.4",
        "stroke-linejoin":"miter"
      }));

      wireframeGold.appendChild(el("polygon",{
        points:wirePts,
        fill:"none",
        stroke:"url(#goldMetal)",
        "stroke-width":"1.55",
        "stroke-linejoin":"miter",
        opacity:"0.86"
      }));

      maskStrokes.appendChild(el("polygon",{
        points:wirePts,
        fill:"none",
        stroke:"#FFFFFF",
        "stroke-width":"2.8",
        "stroke-linejoin":"miter"
      }));

      if(hasInnerFrame){
        maskStrokes.appendChild(el("polygon",{
          points:hexPtsAt(cx,cy,R-12.5),
          fill:"none",
          stroke:"#9A9A9A",
          "stroke-width":"1.1"
        }));
      }

      if(hash>0.84&&cx>40&&cx<1880&&cy>40&&cy<1040){
        const vx=cx+R;
        const vy=cy;
        const gWrap=el("g",{transform:"translate("+vx.toFixed(2)+","+vy.toFixed(2)+")"});
        const star=el("g",{
          class:"glint",
          style:"animation-delay:"+phase5+"s"
        });
        star.appendChild(el("circle",{cx:"0",cy:"0",r:"8.5",fill:"url(#glintGrad)"}));
        star.appendChild(el("path",{
          d:"M0,-7.5 L1.3,-1.3 L7.5,0 L1.3,1.3 L0,7.5 L-1.3,1.3 L-7.5,0 L-1.3,-1.3 Z",
          fill:"#FFFDF2",
          opacity:"0.92"
        }));
        gWrap.appendChild(star);
        glintsLayer.appendChild(gWrap);
      }
    }
  }
})();
</script>
</body>
</html>
