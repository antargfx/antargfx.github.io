<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy New Year 2027 Rose Pink and Ice Blue Circular Neon Sign Loop</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a0d14}
svg{display:block;width:100%;height:100%}
.spill-rose{animation:roseBreath 5s ease-in-out infinite}
.spill-ice{animation:iceBreath 5s ease-in-out infinite;animation-delay:-2.5s}
.ring-ice{animation:ringSteady 5s ease-in-out infinite}
.ring-rose{animation:ringFlicker 5s linear infinite}
.star-a{animation:starTwinkle 2s ease-in-out infinite}
.star-b{animation:starTwinkle 2s ease-in-out infinite;animation-delay:-1s}
.title-ice{animation:titlePulse 5s linear infinite}
.c-2a{animation:ringSteady 5s ease-in-out infinite}
.c-0{animation:subFlickerA 2s linear infinite}
.c-2b{animation:ringSteady 5s ease-in-out infinite;animation-delay:-1.7s}
.c-7{animation:subFlickerB 5s linear infinite}
.dust-1{animation:upA 10s linear infinite}
.dust-2{animation:upB 10s linear infinite}
.dust-3{animation:upC 5s linear infinite}
@keyframes roseBreath{
  0%,100%{opacity:.76}
  50%{opacity:1}
}
@keyframes iceBreath{
  0%,100%{opacity:.7}
  50%{opacity:.96}
}
@keyframes ringSteady{
  0%,100%{opacity:.93}
  50%{opacity:1}
}
@keyframes ringFlicker{
  0%,100%{opacity:1}
  46%{opacity:.96}
  47.5%{opacity:.82}
  49%{opacity:1}
}
@keyframes starTwinkle{
  0%,100%{opacity:.45}
  50%{opacity:1}
}
@keyframes titlePulse{
  0%,100%{opacity:1}
  32%{opacity:.96}
  33%{opacity:.78}
  34.5%{opacity:1}
  78%{opacity:.95}
  79.5%{opacity:.8}
  81%{opacity:1}
}
@keyframes subFlickerA{
  0%,100%{opacity:1}
  45%{opacity:1}
  48%{opacity:.84}
  51%{opacity:1}
}
@keyframes subFlickerB{
  0%,100%{opacity:1}
  24%{opacity:1}
  25.5%{opacity:.68}
  27%{opacity:1}
  28.5%{opacity:.8}
  30%{opacity:1}
}
@keyframes upA{
  0%{transform:translate(0px,150px);opacity:0}
  15%{opacity:.85}
  50%{transform:translate(16px,-80px);opacity:.65}
  85%{opacity:.75}
  100%{transform:translate(0px,-310px);opacity:0}
}
@keyframes upB{
  0%{transform:translate(0px,170px);opacity:0}
  18%{opacity:.75}
  50%{transform:translate(-18px,-85px);opacity:.9}
  82%{opacity:.6}
  100%{transform:translate(0px,-340px);opacity:0}
}
@keyframes upC{
  0%{transform:translate(0px,90px);opacity:0}
  20%{opacity:.7}
  50%{transform:translate(10px,-45px);opacity:.85}
  80%{opacity:.55}
  100%{transform:translate(0px,-180px);opacity:0}
}
</style>
</head>
<body>
<svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#141a26"/>
    <stop offset="50%" stop-color="#0d111a"/>
    <stop offset="100%" stop-color="#090c12"/>
  </linearGradient>
  <pattern id="concreteWall" width="320" height="270" patternUnits="userSpaceOnUse">
    <rect width="320" height="270" fill="#05070b"/>
    <rect x="2" y="2" width="316" height="266" fill="url(#panelGrad)"/>
    <rect x="2" y="2" width="316" height="1.5" fill="#253047" opacity="0.45"/>
    <circle cx="18" cy="18" r="3" fill="#06080d" stroke="#1e273a" stroke-width="1"/>
    <circle cx="302" cy="18" r="3" fill="#06080d" stroke="#1e273a" stroke-width="1"/>
    <circle cx="18" cy="252" r="3" fill="#06080d" stroke="#1e273a" stroke-width="1"/>
    <circle cx="302" cy="252" r="3" fill="#06080d" stroke="#1e273a" stroke-width="1"/>
  </pattern>
  <radialGradient id="roseSpill" cx="50%" cy="55%" r="48%">
    <stop offset="0%" stop-color="#FF6B9D" stop-opacity="0.34"/>
    <stop offset="48%" stop-color="#E0407B" stop-opacity="0.13"/>
    <stop offset="100%" stop-color="#FF6B9D" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="iceSpill" cx="50%" cy="35%" r="44%">
    <stop offset="0%" stop-color="#72EFDD" stop-opacity="0.28"/>
    <stop offset="50%" stop-color="#48BFE3" stop-opacity="0.1"/>
    <stop offset="100%" stop-color="#72EFDD" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="vigCon" cx="50%" cy="50%" r="72%">
    <stop offset="32%" stop-color="#0a0d14" stop-opacity="0"/>
    <stop offset="78%" stop-color="#04060a" stop-opacity="0.65"/>
    <stop offset="100%" stop-color="#010204" stop-opacity="0.94"/>
  </radialGradient>
  <filter id="gRose" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="16" result="b1"/>
    <feGaussianBlur stdDeviation="5" result="b2"/>
    <feMerge><feMergeNode in="b1"/><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="gRoseBig" x="-30%" y="-30%" width="160%" height="160%">

    <feGaussianBlur stdDeviation="8" result="b2"/>
    <feMerge><feMergeNode in="b1"/><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="gIce" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="15" result="b1"/>
    <feGaussianBlur stdDeviation="4.5" result="b2"/>
    <feMerge><feMergeNode in="b1"/><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="shdCon" x="-15%" y="-15%" width="130%" height="130%">
    <feGaussianBlur stdDeviation="9"/>
  </filter>
  <filter id="dGlow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="2.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <g id="luxTwo">
    <path d="M 14 110 C 14 42 60 6 124 6 C 192 6 232 46 232 108 C 232 152 208 188 166 230 L 96 306 C 90 312 92 316 100 316 H 224 C 230 316 234 320 234 326 V 364 C 234 370 230 374 224 374 H 16 C 10 374 6 370 6 364 V 316 C 6 292 16 270 42 242 L 136 146 C 160 122 174 108 174 90 C 174 70 154 58 122 58 C 90 58 72 76 70 110 C 70 116 66 120 60 120 H 24 C 18 120 14 116 14 110 Z"/>
  </g>
  <g id="luxZero">
    <rect x="10" y="6" width="220" height="368" rx="110" ry="110"/>
    <rect x="68" y="64" width="104" height="252" rx="52" ry="52"/>
  </g>
  <g id="luxSeven">
    <path d="M 22 6 H 220 C 228 6 232 10 232 18 V 56 C 232 64 230 70 226 80 L 122 364 C 119 371 114 374 106 374 H 60 C 52 374 49 369 52 361 L 158 72 C 160 67 158 64 152 64 H 22 C 14 64 10 60 10 52 V 18 C 10 10 14 6 22 6 Z"/>
  </g>
  <g id="luxHny" transform="translate(4,16)">
    <path d="M493 272 V356 M545 272 V356 M493 314 H545"/>
    <path d="M567 356 L593 272 L619 356 M577 328 H609"/>
    <path d="M641 356 V272 H673 C687 272 693 282 693 295 C693 308 687 318 673 318 H641"/>
    <path d="M715 356 V272 H747 C761 272 767 282 767 295 C767 308 761 318 747 318 H715"/>
    <path d="M789 272 L815 316 L841 272 M815 316 V356"/>
    <path d="M889 356 V272 L941 356 V272"/>
    <path d="M1011 272 H963 V356 H1011 M963 314 H1003"/>
    <path d="M1033 272 L1049 356 L1067 298 L1085 356 L1101 272"/>
    <path d="M1149 272 L1175 316 L1201 272 M1175 316 V356"/>
    <path d="M1271 272 H1223 V356 H1271 M1223 314 H1263"/>
    <path d="M1293 356 L1319 272 L1345 356 M1303 328 H1335"/>
    <path d="M1367 356 V272 H1399 C1413 272 1419 282 1419 295 C1419 308 1413 317 1399 317 H1367 M1395 317 L1419 356"/>
  </g>
  <path id="star4" d="M 0 -24 Q 2 -2 24 0 Q 2 2 0 24 Q -2 2 -24 0 Q -2 -2 0 -24 Z"/>
</defs>

<rect width="1920" height="1080" fill="url(#concreteWall)"/>
<g class="spill-rose">
  <ellipse cx="960" cy="580" rx="820" ry="440" fill="url(#roseSpill)"/>
</g>
<g class="spill-ice">
  <ellipse cx="960" cy="360" rx="760" ry="380" fill="url(#iceSpill)"/>
</g>
<rect width="1920" height="1080" fill="url(#vigCon)"/>

<g opacity="0.58" filter="url(#shdCon)" transform="translate(0,16)">
  <circle cx="960" cy="540" r="466" fill="none" stroke="#000" stroke-width="18"/>
  <circle cx="960" cy="540" r="434" fill="none" stroke="#000" stroke-width="14"/>
  <use href="#luxHny" fill="none" stroke="#000" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="none" stroke="#000" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" transform="translate(960,610) scale(0.86) translate(-960,-610)">
    <use href="#luxTwo" transform="translate(396,434)"/>

</g>

<g fill="#151b26" stroke="#2c384f" stroke-width="1.5">

  <rect x="949" y="960" width="22" height="62" rx="5"/>
  <rect x="478" y="529" width="62" height="22" rx="5"/>
  <rect x="1380" y="529" width="62" height="22" rx="5"/>
</g>

<g class="ring-ice">
  <circle cx="960" cy="540" r="466" fill="none" stroke="#72EFDD" stroke-width="18" opacity="0.24" filter="url(#gIce)"/>
  <circle cx="960" cy="540" r="466" fill="none" stroke="#72EFDD" stroke-width="8" filter="url(#gIce)"/>
  <circle cx="960" cy="540" r="466" fill="none" stroke="#E8FFFC" stroke-width="2.8"/>
</g>

<g class="ring-rose">
  <circle cx="960" cy="540" r="434" fill="none" stroke="#FF6B9D" stroke-width="16" opacity="0.26" filter="url(#gRose)"/>
  <circle cx="960" cy="540" r="434" fill="none" stroke="#FF6B9D" stroke-width="7" filter="url(#gRose)"/>
  <circle cx="960" cy="540" r="434" fill="none" stroke="#FFE5EE" stroke-width="2.5"/>
</g>

<g class="star-a" transform="translate(960,188)" filter="url(#gIce)">
  <use href="#star4" fill="#E8FFFC" stroke="#72EFDD" stroke-width="2"/>
</g>
<g class="star-b" transform="translate(960,892)" filter="url(#gRose)">
  <use href="#star4" fill="#FFE8F0" stroke="#FF6B9D" stroke-width="2"/>
</g>
<g class="star-b" transform="translate(360,290) scale(0.7)" filter="url(#gRose)">
  <use href="#star4" fill="#FFE8F0" stroke="#FF6B9D" stroke-width="2"/>
</g>
<g class="star-a" transform="translate(1560,790) scale(0.7)" filter="url(#gIce)">
  <use href="#star4" fill="#E8FFFC" stroke="#72EFDD" stroke-width="2"/>
</g>

<g class="title-ice" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <use href="#luxHny" stroke="#72EFDD" stroke-width="20" opacity="0.3" filter="url(#gIce)"/>
  <use href="#luxHny" stroke="#72EFDD" stroke-width="9" filter="url(#gIce)"/>
  <use href="#luxHny" stroke="#EEFFFD" stroke-width="3.2"/>
</g>

<g fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(960,610) scale(0.86) translate(-960,-610)">
  <g class="c-2a" transform="translate(396,434)">
    <use href="#luxTwo" stroke="#FF6B9D" stroke-width="28" opacity="0.28" filter="url(#gRoseBig)"/>
    <use href="#luxTwo" stroke="#FF6B9D" stroke-width="12" filter="url(#gRose)"/>
    <use href="#luxTwo" stroke="#FFF0F5" stroke-width="4.4"/>
  </g>
  <g class="c-0" transform="translate(692,434)">
    <use href="#luxZero" stroke="#FF6B9D" stroke-width="28" opacity="0.28" filter="url(#gRoseBig)"/>
    <use href="#luxZero" stroke="#FF6B9D" stroke-width="12" filter="url(#gRose)"/>
    <use href="#luxZero" stroke="#FFF0F5" stroke-width="4.4"/>

  <g class="c-2b" transform="translate(988,434)">

    <use href="#luxTwo" stroke="#FF6B9D" stroke-width="12" filter="url(#gRose)"/>
    <use href="#luxTwo" stroke="#FFF0F5" stroke-width="4.4"/>
  </g>
  <g class="c-7" transform="translate(1284,434)">
    <use href="#luxSeven" stroke="#FF6B9D" stroke-width="28" opacity="0.28" filter="url(#gRoseBig)"/>
    <use href="#luxSeven" stroke="#FF6B9D" stroke-width="12" filter="url(#gRose)"/>
    <use href="#luxSeven" stroke="#FFF0F5" stroke-width="4.4"/>

</g>

  <circle class="dust-1" cx="1680" cy="540" r="2.8" fill="#FF6B9D" style="animation-delay:-4.3s"/>

  <circle class="dust-3" cx="180" cy="490" r="2.0" fill="#FF6B9D" style="animation-delay:-2.7s"/>
</g>
</svg>
</body>
