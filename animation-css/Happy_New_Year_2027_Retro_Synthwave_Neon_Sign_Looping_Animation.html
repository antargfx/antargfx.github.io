<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy New Year 2027 Retro Synthwave Neon Sign Looping Animation</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070212}
#stage{display:block;width:100%;height:100%}
@keyframes signFloat{
  0%,100%{transform:translateY(-6px)}
  50%{transform:translateY(6px)}
}
@keyframes pinkShimmer{
  0%,100%{opacity:1}
  18%{opacity:0.94}
  20%{opacity:0.78}
  22%{opacity:1}
  50%{opacity:0.92}
  74%{opacity:1}
  75%{opacity:0.84}
  77%{opacity:1}
}
@keyframes cyanShimmer{
  0%,100%{opacity:1}
  32%{opacity:0.96}
  33%{opacity:0.82}
  34%{opacity:1}
  65%{opacity:0.93}
  88%{opacity:1}
  89%{opacity:0.86}
  91%{opacity:1}
}
@keyframes haloPulse{
  0%,100%{opacity:0.78}
  50%{opacity:1}
}
@keyframes floorGlowPulse{
  0%,100%{opacity:0.65}
  50%{opacity:0.95}
}
@keyframes twinkleA{
  0%,100%{opacity:0.25}
  50%{opacity:1}
}
@keyframes twinkleB{
  0%,100%{opacity:0.95}
  50%{opacity:0.2}
}
@keyframes twinkleC{
  0%,100%{opacity:0.4}
  50%{opacity:1}
}
.sign-group{animation:signFloat 5s ease-in-out infinite}
.pink-neon{animation:pinkShimmer 5s ease-in-out infinite}
.cyan-neon{animation:cyanShimmer 10s ease-in-out infinite}
.sun-halo{animation:haloPulse 5s ease-in-out infinite}
.floor-reflect{animation:floorGlowPulse 5s ease-in-out infinite}
.st-a{animation:twinkleA 2s ease-in-out infinite}
.st-b{animation:twinkleB 5s ease-in-out infinite}
.st-c{animation:twinkleC 10s ease-in-out infinite}
.d1{animation-delay:-0.4s}
.d2{animation-delay:-1.1s}
.d3{animation-delay:-2.3s}
.d4{animation-delay:-3.7s}
.d5{animation-delay:-6.2s}
.neon-label{
  font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;
  font-weight:700;
  font-size:50px;
  letter-spacing:16px;
  text-anchor:middle;
}
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#070212"/>
    <stop offset="48%" stop-color="#110429"/>
    <stop offset="82%" stop-color="#29074D"/>
    <stop offset="100%" stop-color="#580C6B"/>
  </linearGradient>
  <radialGradient id="sunHaloGrad" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#FF007F" stop-opacity="0.55"/>
    <stop offset="45%" stop-color="#B000FF" stop-opacity="0.22"/>
    <stop offset="100%" stop-color="#070212" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="sunGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FFE600"/>
    <stop offset="30%" stop-color="#FFB800"/>
    <stop offset="58%" stop-color="#FF5544"/>
    <stop offset="82%" stop-color="#FF007F"/>
    <stop offset="100%" stop-color="#D4007A"/>
  </linearGradient>
  <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#2E064E"/>
    <stop offset="18%" stop-color="#18042E"/>
    <stop offset="65%" stop-color="#0C021C"/>
    <stop offset="100%" stop-color="#070212"/>
  </linearGradient>
  <linearGradient id="horizonGlow" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FF00AA" stop-opacity="0"/>
    <stop offset="45%" stop-color="#FF00AA" stop-opacity="0.45"/>
    <stop offset="50%" stop-color="#FF7AE6" stop-opacity="0.9"/>
    <stop offset="55%" stop-color="#C800FF" stop-opacity="0.45"/>
    <stop offset="100%" stop-color="#070212" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="floorCyanReflect" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.28"/>
    <stop offset="45%" stop-color="#FF007F" stop-opacity="0.14"/>
    <stop offset="100%" stop-color="#070212" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="gridVGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FF2AA8" stop-opacity="0.25"/>
    <stop offset="35%" stop-color="#D41BFF" stop-opacity="0.85"/>
    <stop offset="100%" stop-color="#FF00B8" stop-opacity="1"/>
  </linearGradient>
  <linearGradient id="mountainGrad1" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#220540"/>
    <stop offset="100%" stop-color="#0D021E"/>
  </linearGradient>
  <linearGradient id="mountainGrad2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#17032D"/>
    <stop offset="100%" stop-color="#090116"/>
  </linearGradient>
  <filter id="pinkGlow" x="-30%" y="-60%" width="160%" height="220%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b1"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="b2"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="24" result="b3"/>
    <feMerge>
      <feMergeNode in="b3"/>
      <feMergeNode in="b2"/>
      <feMergeNode in="b1"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="cyanGlow" x="-25%" y="-35%" width="150%" height="170%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b1"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="b2"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="32" result="b3"/>
    <feMerge>
      <feMergeNode in="b3"/>
      <feMergeNode in="b2"/>
      <feMergeNode in="b1"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="gridGlow" x="-10%" y="-30%" width="120%" height="160%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="b1"/>
    <feMerge>
      <feMergeNode in="b1"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="darkHalo" x="-20%" y="-40%" width="140%" height="180%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="16"/>
  </filter>
  <clipPath id="horizonClip">
    <rect x="0" y="0" width="1920" height="660"/>
  </clipPath>
  <clipPath id="floorClip">
    <rect x="0" y="660" width="1920" height="420"/>
  </clipPath>
  <mask id="sunStripeMask">
    <rect x="0" y="0" width="1920" height="660" fill="#FFFFFF"/>
    <rect x="650" y="458" width="620" height="6" fill="#000000"/>
    <rect x="650" y="486" width="620" height="9" fill="#000000"/>
    <rect x="650" y="518" width="620" height="13" fill="#000000"/>
    <rect x="650" y="555" width="620" height="17" fill="#000000"/>
    <rect x="650" y="596" width="620" height="22" fill="#000000"/>
    <rect x="650" y="641" width="620" height="24" fill="#000000"/>
  </mask>
  <g id="digits2027">
    <path transform="translate(-383,0)" d="M 8 54 C 8 14 32 0 74 0 L 96 0 C 132 0 146 20 146 54 C 146 84 128 104 96 122 L 26 162 C 10 172 4 186 4 204 L 4 218 L 148 218" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path transform="translate(-177,0)" d="M 56 0 L 92 0 C 130 0 148 22 148 60 L 148 160 C 148 198 130 220 92 220 L 56 220 C 18 220 0 198 0 160 L 0 60 C 0 22 18 0 56 0 Z" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path transform="translate(29,0)" d="M 8 54 C 8 14 32 0 74 0 L 96 0 C 132 0 146 20 146 54 C 146 84 128 104 96 122 L 26 162 C 10 172 4 186 4 204 L 4 218 L 148 218" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path transform="translate(235,0)" d="M 4 0 L 148 0 L 148 18 L 54 218" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <mask id="doubleTubeMask" maskUnits="userSpaceOnUse" x="-500" y="-60" width="1000" height="340">
    <use href="#digits2027" stroke="#FFFFFF" stroke-width="28"/>
    <use href="#digits2027" stroke="#000000" stroke-width="12"/>
  </mask>
  <mask id="doubleCoreMask" maskUnits="userSpaceOnUse" x="-500" y="-60" width="1000" height="340">
    <use href="#digits2027" stroke="#FFFFFF" stroke-width="23"/>
    <use href="#digits2027" stroke="#000000" stroke-width="17"/>
  </mask>
</defs>
<rect x="0" y="0" width="1920" height="660" fill="url(#skyGrad)"/>
<g id="starField"></g>
<g clip-path="url(#horizonClip)">
  <circle class="sun-halo" cx="960" cy="490" r="460" fill="url(#sunHaloGrad)"/>
  <circle cx="960" cy="495" r="255" fill="url(#sunGrad)" mask="url(#sunStripeMask)"/>
  <path d="M 0 660 L 0 580 L 125 535 L 250 592 L 385 520 L 520 585 L 645 552 L 775 660 Z" fill="url(#mountainGrad1)" stroke="#9B1BFF" stroke-opacity="0.45" stroke-width="1.5"/>
  <path d="M 1145 660 L 1280 555 L 1410 590 L 1545 516 L 1690 588 L 1815 540 L 1920 578 L 1920 660 Z" fill="url(#mountainGrad1)" stroke="#9B1BFF" stroke-opacity="0.45" stroke-width="1.5"/>
  <path d="M 0 660 L 0 618 L 190 576 L 340 622 L 505 568 L 690 660 Z" fill="url(#mountainGrad2)" stroke="#FF1E9C" stroke-opacity="0.35" stroke-width="1.2"/>
  <path d="M 1230 660 L 1415 572 L 1585 620 L 1740 578 L 1920 615 L 1920 660 Z" fill="url(#mountainGrad2)" stroke="#FF1E9C" stroke-opacity="0.35" stroke-width="1.2"/>
</g>
<rect x="0" y="660" width="1920" height="420" fill="url(#floorGrad)"/>
<ellipse class="floor-reflect" cx="960" cy="790" rx="560" ry="130" fill="url(#floorCyanReflect)" clip-path="url(#floorClip)"/>
<g id="gridLayer" clip-path="url(#floorClip)" filter="url(#gridGlow)">
  <g id="gridV"></g>
  <g id="gridH"></g>
</g>
<rect x="0" y="625" width="1920" height="70" fill="url(#horizonGlow)"/>
<line x1="0" y1="660" x2="1920" y2="660" stroke="#FF7AE6" stroke-width="2.5" opacity="0.95"/>
<g class="sign-group">
  <g transform="translate(960, 326)">
    <text class="neon-label" x="0" y="0" fill="#0A0219" stroke="#0A0219" stroke-width="24" opacity="0.72" filter="url(#darkHalo)">HAPPY NEW YEAR</text>
    <g class="pink-neon">
      <line x1="-520" y1="-17" x2="-390" y2="-17" stroke="#FF2A85" stroke-width="5" stroke-linecap="round" filter="url(#pinkGlow)"/>
      <line x1="-520" y1="-17" x2="-390" y2="-17" stroke="#FFD6EB" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="390" y1="-17" x2="520" y2="-17" stroke="#FF2A85" stroke-width="5" stroke-linecap="round" filter="url(#pinkGlow)"/>
      <line x1="390" y1="-17" x2="520" y2="-17" stroke="#FFD6EB" stroke-width="1.8" stroke-linecap="round"/>
      <text class="neon-label" x="0" y="0" fill="none" stroke="#FF2A85" stroke-width="9" filter="url(#pinkGlow)">HAPPY NEW YEAR</text>
      <text class="neon-label" x="0" y="0" fill="#FF2A85" stroke="#FF2A85" stroke-width="2">HAPPY NEW YEAR</text>
      <text class="neon-label" x="0" y="0" fill="#FFE0F0" opacity="0.92">HAPPY NEW YEAR</text>
    </g>
  </g>
  <g transform="translate(960, 505) skewX(-11) translate(0, -110)">
    <use href="#digits2027" stroke="#090218" stroke-width="46" opacity="0.7" filter="url(#darkHalo)"/>
    <g class="cyan-neon">
      <g filter="url(#cyanGlow)">
        <use href="#digits2027" stroke="#00F5D4" stroke-width="32" mask="url(#doubleTubeMask)"/>
      </g>
      <use href="#digits2027" stroke="#00F5D4" stroke-width="30" mask="url(#doubleTubeMask)"/>
      <use href="#digits2027" stroke="#E0FFF9" stroke-width="28" mask="url(#doubleCoreMask)"/>
    </g>
  </g>
</g>
</svg>
<script>
(function(){
  const NS='http://www.w3.org/2000/svg';
  const starField=document.getElementById('starField');
  const gridV=document.getElementById('gridV');
  const gridH=document.getElementById('gridH');
  function el(tag,attrs){
    const n=document.createElementNS(NS,tag);
    for(const k in attrs)n.setAttribute(k,attrs[k]);
    return n;
  }
  const starClasses=['st-a d1','st-b d2','st-c d3','st-a d4','st-b d5','st-c d1'];
  for(let i=0;i<78;i++){
    const sx=((i*197.3+43)%1880)+20;
    const sy=((i*131.7+27)%560)+18;
    const dx=sx-960;
    const dy=sy-495;
    if(dx*dx+dy*dy<275*275)continue;
    const cls=starClasses[i%starClasses.length];
    if(i%9===0){
      const s=4+(i%3)*1.8;
      const d=`M ${sx} ${sy-s} L ${sx+s*0.28} ${sy-s*0.28} L ${sx+s} ${sy} L ${sx+s*0.28} ${sy+s*0.28} L ${sx} ${sy+s} L ${sx-s*0.28} ${sy+s*0.28} L ${sx-s} ${sy} L ${sx-s*0.28} ${sy-s*0.28} Z`;
      starField.appendChild(el('path',{d,fill:i%18===0?'#80FFF0':'#FFFFFF',class:cls}));
    }else{
      const r=0.9+(i%4)*0.55;
      starField.appendChild(el('circle',{cx:sx.toFixed(1),cy:sy.toFixed(1),r:r.toFixed(2),fill:i%7===0?'#FFB3E6':'#FFFFFF',class:cls}));
    }
  }
  const vpX=960;
  const vpY=660;
  const floorH=420;
  for(let i=-16;i<=16;i++){
    const bx=vpX+i*155;
    gridV.appendChild(el('line',{
      x1:vpX,
      y1:vpY,
      x2:bx,
      y2:1080,
      stroke:'url(#gridVGrad)',
      'stroke-width':i===0?'2.4':'1.8'
    }));
  }
  const rowCount=16;
  const hLines=[];
  for(let i=0;i<rowCount;i++){
    const l=el('line',{x1:0,x2:1920,y1:vpY,y2:vpY,stroke:'#FF14B8','stroke-width':'2'});
    gridH.appendChild(l);
    hLines.push(l);
  }
  function render(ts){
    const t=((ts%10000)+10000)%10000/10000;
    const frac=(t*10)%1;
    for(let i=0;i<rowCount;i++){
      const u=(i+frac)/rowCount;
      const y=vpY+floorH*Math.pow(u,2.35);
      const op=Math.min(1,u*5.5)*(0.45+0.55*u);
      const sw=1.1+2.2*u;
      const line=hLines[i];
      line.setAttribute('y1',y.toFixed(2));
      line.setAttribute('y2',y.toFixed(2));
      line.setAttribute('stroke-width',sw.toFixed(2));
      line.setAttribute('stroke-opacity',op.toFixed(3));
    }
    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);
})();
</script>
</body>
</html>
