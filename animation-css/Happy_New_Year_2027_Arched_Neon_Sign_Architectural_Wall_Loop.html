<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy New Year 2027 Arched Neon Sign Architectural Wall Loop</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060913}
svg{display:block;width:100%;height:100%}
.ambient-cyan{animation:breathCyan 5s ease-in-out infinite}
.ambient-magenta{animation:breathMagenta 5s ease-in-out infinite;animation-delay:-2.5s}
.wall-shimmer{animation:shimmerSweep 10s linear infinite}
.arch-cyan{animation:cyanSteady 5s ease-in-out infinite}
.arch-magenta{animation:magentaPulse 5s linear infinite}
.title-neon{animation:titleFlicker 5s linear infinite}
.num-2a{animation:tubeGlow 5s ease-in-out infinite}
.num-0{animation:flickerFastA 2s linear infinite}
.num-2b{animation:tubeGlow 5s ease-in-out infinite;animation-delay:-2s}
.num-7{animation:flickerFastB 5s linear infinite}
.floor-reflect{animation:reflectBreath 5s ease-in-out infinite}
.dust-a{animation:driftA 10s linear infinite}
.dust-b{animation:driftB 10s linear infinite}
.dust-c{animation:driftC 5s linear infinite}
@keyframes breathCyan{
  0%,100%{opacity:.76}
  50%{opacity:1}
}
@keyframes breathMagenta{
  0%,100%{opacity:.7}
  50%{opacity:.98}
}
@keyframes shimmerSweep{
  0%{transform:translateX(-1920px);opacity:0}
  15%{opacity:.32}
  50%{transform:translateX(0px);opacity:.45}
  85%{opacity:.32}
  100%{transform:translateX(1920px);opacity:0}
}
@keyframes cyanSteady{
  0%,100%{opacity:.93}
  50%{opacity:1}
}
@keyframes magentaPulse{
  0%,100%{opacity:.94}
  36%{opacity:1}
  37.5%{opacity:.82}
  39%{opacity:1}
  72%{opacity:.96}
  73.5%{opacity:.86}
  75%{opacity:1}
}
@keyframes titleFlicker{
  0%,100%{opacity:1}
  21%{opacity:.98}
  22%{opacity:.72}
  23.2%{opacity:1}
  64%{opacity:.95}
  65%{opacity:.78}
  66%{opacity:.96}
  67%{opacity:.74}
  68.5%{opacity:1}
}
@keyframes tubeGlow{
  0%,100%{opacity:.92}
  50%{opacity:1}
}
@keyframes flickerFastA{
  0%,100%{opacity:1}
  44%{opacity:1}
  46%{opacity:.8}
  48%{opacity:1}
  82%{opacity:.98}
  84%{opacity:.86}
  86%{opacity:1}
}
@keyframes flickerFastB{
  0%,100%{opacity:1}
  16%{opacity:1}
  17.5%{opacity:.68}
  19%{opacity:1}
  20%{opacity:.8}
  21.5%{opacity:1}
  78%{opacity:.96}
  80%{opacity:.85}
  82%{opacity:1}
}
@keyframes reflectBreath{
  0%,100%{opacity:.28}
  50%{opacity:.4}
}
@keyframes driftA{
  0%{transform:translate(0px,130px);opacity:0}
  16%{opacity:.8}
  50%{transform:translate(20px,-75px);opacity:.65}
  84%{opacity:.7}
  100%{transform:translate(0px,-280px);opacity:0}
}
@keyframes driftB{
  0%{transform:translate(0px,150px);opacity:0}
  18%{opacity:.7}
  50%{transform:translate(-18px,-85px);opacity:.88}
  82%{opacity:.6}
  100%{transform:translate(0px,-320px);opacity:0}
}
@keyframes driftC{
  0%{transform:translate(0px,85px);opacity:0}
  20%{opacity:.62}
  50%{transform:translate(10px,-45px);opacity:.82}
  80%{opacity:.52}
  100%{transform:translate(0px,-175px);opacity:0}
}
</style>
</head>
<body>
<svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="fluteGrad" x1="0%" y1="0%" x2="100%" y2="0%">

    <stop offset="20%" stop-color="#080e20"/>
    <stop offset="48%" stop-color="#121c38"/>
    <stop offset="58%" stop-color="#172447"/>
    <stop offset="80%" stop-color="#090f22"/>
    <stop offset="100%" stop-color="#02040a"/>
  </linearGradient>
  <pattern id="flutedWall" width="28" height="880" patternUnits="userSpaceOnUse">
    <rect width="28" height="880" fill="url(#fluteGrad)"/>
    <rect x="0" width="2" height="880" fill="#010206" opacity="0.92"/>
    <rect x="15" width="1.4" height="880" fill="#273c73" opacity="0.24"/>
  </pattern>
  <linearGradient id="shimmerBand" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00F0FF" stop-opacity="0"/>
    <stop offset="42%" stop-color="#00F0FF" stop-opacity="0.16"/>
    <stop offset="50%" stop-color="#FF007F" stop-opacity="0.14"/>
    <stop offset="58%" stop-color="#00F0FF" stop-opacity="0.16"/>
    <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">

  <mask id="floorMask">

  <radialGradient id="cyanSpill" cx="50%" cy="56%" r="48%">

  <radialGradient id="magentaSpill" cx="50%" cy="30%" r="42%">

  <radialGradient id="vignette" cx="50%" cy="46%" r="74%">

  <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">

      <feMergeNode in="b2"/>

  </filter>
  <filter id="glowCyanBig" x="-25%" y="-25%" width="150%" height="150%">

    <feGaussianBlur stdDeviation="7.5" result="b2"/>
    <feMerge>
      <feMergeNode in="b1"/>
      <feMergeNode in="b2"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="glowMagenta" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="14" result="b1"/>
    <feGaussianBlur stdDeviation="4" result="b2"/>
    <feMerge>
      <feMergeNode in="b1"/>
      <feMergeNode in="b2"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="reflectBlur" x="-15%" y="-15%" width="130%" height="130%">

  </filter>
  <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">

  </filter>
  <filter id="dustGlow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="2" result="b"/>
    <feMerge>
      <feMergeNode in="b"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <path id="outerArchPath" d="M 350 832 H 1570 Q 1612 832 1612 790 V 454 C 1612 204 1362 96 960 96 C 558 96 308 204 308 454 V 790 Q 308 832 350 832 Z"/>
  <path id="innerArchPath" d="M 374 802 H 1546 Q 1580 802 1580 768 V 460 C 1580 232 1344 128 960 128 C 576 128 340 232 340 460 V 768 Q 340 802 374 802 Z"/>

<rect width="1920" height="880" fill="url(#flutedWall)"/>
