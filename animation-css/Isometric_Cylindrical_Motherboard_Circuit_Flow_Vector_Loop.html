<!DOCTYPE html>

<title>Isometric Cylindrical Motherboard Circuit Flow Vector Loop</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020614}
svg{display:block;width:100%;height:100%}
@keyframes boardGlide{
  0%{transform:translateX(0px)}
  100%{transform:translateX(360px)}
}
@keyframes impulse2x{
  0%{transform:translateX(0px)}
  100%{transform:translateX(720px)}
}
@keyframes impulse3x{
  0%{transform:translateX(0px)}
  100%{transform:translateX(1080px)}
}
@keyframes viaFlashA{
  0%,14%,32%,100%{opacity:0;transform:scale(0.75)}
  20%{opacity:1;transform:scale(1.35)}
  26%{opacity:0.45;transform:scale(1.05)}
}
@keyframes viaFlashB{
  0%,48%,68%,100%{opacity:0;transform:scale(0.75)}
  55%{opacity:1;transform:scale(1.4)}
  61%{opacity:0.4;transform:scale(1.05)}
}
@keyframes viaFlashC{
  0%,74%,92%,100%{opacity:0;transform:scale(0.75)}
  81%{opacity:1;transform:scale(1.35)}
  87%{opacity:0.45;transform:scale(1.05)}
}
@keyframes crestPulse{
  0%,100%{opacity:0.78}
  50%{opacity:1}
}
.glide-layer{animation:boardGlide 10s linear infinite}
.imp-2x{animation:impulse2x 10s linear infinite}
.imp-3x{animation:impulse3x 10s linear infinite}
.flash-a{transform-box:fill-box;transform-origin:center;animation:viaFlashA 5s ease-in-out infinite}
.flash-b{transform-box:fill-box;transform-origin:center;animation:viaFlashB 5s ease-in-out infinite}
.flash-c{transform-box:fill-box;transform-origin:center;animation:viaFlashC 5s ease-in-out infinite}
.crest-glow{animation:crestPulse 5s ease-in-out infinite}
</style>
