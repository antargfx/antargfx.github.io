<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cascading Shimmering Liquid Gold Glitter Curtain Seamless Loop Motion Background</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0A0501}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const W=1920,H=1080,LOOP=10000,TAU=Math.PI*2;

function resize(){
const dpr=Math.min(window.devicePixelRatio||1,2);
const w=Math.max(1,Math.round(window.innerWidth*dpr));
const h=Math.max(1,Math.round(window.innerHeight*dpr));
if(canvas.width!==w||canvas.height!==h){
canvas.width=w;
canvas.height=h;
}
}
resize();
window.addEventListener('resize',resize);

let seed=20261122;
function rnd(){
seed|=0;seed=seed+0x6D2B79F5|0;
let t=Math.imul(seed^seed>>>15,1|seed);
t=t+Math.imul(t^t>>>7,61|t)^t;
return((t^t>>>14)>>>0)/4294967296;
}

function sampleCurtainX(){
const r=rnd();
if(r<0.44){
return Math.pow(rnd(),1.45)*740;
}else if(r<0.88){
return W-Math.pow(rnd(),1.45)*740;
}else{
return 560+rnd()*800;
}
}

const strands=[];
for(let i=0;i<72;i++){
const side=i<36?0:1;
const u=rnd();
const x=side===0?Math.pow(u,1.25)*720:W-Math.pow(u,1.25)*720;
const centerDist=Math.abs(x-W*0.5)/(W*0.5);
strands.push({
x,
width:1.2+rnd()*3.6*centerDist,
alpha:0.05+rnd()*0.16*(0.4+centerDist*0.8),
swayAmp:6+rnd()*14,
swayFreq:rnd()<0.6?1:2,
swayPhase:rnd(),
pulseFreq:rnd()<0.5?1:2,
pulsePhase:rnd(),
length:H*(0.65+centerDist*0.45)
});
}

const bokehBack=[];
for(let i=0;i<54;i++){
const x=sampleCurtainX();
const centerDist=Math.abs(x-W*0.5)/(W*0.5);
const radius=(26+rnd()*78)*(0.7+centerDist*0.5);
const huePick=rnd();
const col=huePick<0.35?[120,53,15]:huePick<0.8?[245,158,11]:[254,243,199];
bokehBack.push({
x,
y:rnd()*(H+radius*4),
r:radius,
col,
alpha:(0.06+rnd()*0.15)*(0.55+centerDist*0.6),
speed:1,
swayAmp:10+rnd()*24,
swayFreq:1,
swayPhase:rnd(),
pulseFreq:rnd()<0.5?1:2,
pulsePhase:rnd()
});
}

const flakes=[];
const flakeCount=1550;
for(let i=0;i<flakeCount;i++){
const x=sampleCurtainX();
const centerDist=Math.abs(x-W*0.5)/(W*0.5);
const size=(1.6+Math.pow(rnd(),1.7)*5.4)*(0.75+centerDist*0.35);
const shape=rnd()<0.52?0:rnd()<0.84?1:2;
const tier=rnd();
const baseCol=tier<0.22?[120,53,15]:tier<0.55?[180,83,9]:tier<0.88?[245,158,11]:[253,224,71];
flakes.push({
x,
y:rnd()*(H+120),
size,
shape,
col:baseCol,
speed:rnd()<0.72?1:2,
swayAmp:4+rnd()*18,
swayFreq:rnd()<0.7?1:2,
swayPhase:rnd(),
spinFreq:2+Math.floor(rnd()*4),
spinPhase:rnd(),
tilt:(rnd()-0.5)*0.7,
glintBias:rnd(),
alpha:(0.45+rnd()*0.55)*(0.5+centerDist*0.6)
});
}

const foreSparkles=[];
for(let i=0;i<58;i++){
const x=sampleCurtainX();
const centerDist=Math.abs(x-W*0.5)/(W*0.5);
const r=10+rnd()*26;
foreSparkles.push({
x,
y:rnd()*(H+r*6),
r,
speed:rnd()<0.6?2:3,
swayAmp:14+rnd()*30,
swayFreq:rnd()<0.5?1:2,
swayPhase:rnd(),
pulseFreq:2+Math.floor(rnd()*3),
pulsePhase:rnd(),
alpha:(0.12+rnd()*0.26)*(0.5+centerDist*0.65),
warm:rnd()<0.45
});
}

function makeSprite(size,inner,mid,outer){
const s=document.createElement('canvas');
s.width=size;s.height=size;
const g=s.getContext('2d');
const h=size/2;
const gr=g.createRadialGradient(h,h,0,h,h,h);
gr.addColorStop(0,inner);
gr.addColorStop(0.35,mid);
gr.addColorStop(1,outer);
g.fillStyle=gr;
g.fillRect(0,0,size,size);
return s;
}

const spChampagne=makeSprite(128,'rgba(254,243,199,1)','rgba(245,158,11,0.45)','rgba(245,158,11,0)');
const spGold=makeSprite(128,'rgba(245,158,11,0.95)','rgba(180,83,9,0.35)','rgba(120,53,15,0)');
const spBronze=makeSprite(128,'rgba(180,83,9,0.8)','rgba(120,53,15,0.28)','rgba(120,53,15,0)');

function drawStar(x,y,r,alpha){
ctx.save();
ctx.translate(x,y);
ctx.fillStyle=`rgba(254,243,199,${alpha})`;
ctx.beginPath();
const inner=r*0.18;
for(let i=0;i<8;i++){
const rad=i%2===0?r:inner;
const a=i*Math.PI/4;
const px=Math.cos(a)*rad;
const py=Math.sin(a)*rad;
if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
}
ctx.closePath();
ctx.fill();
ctx.restore();
}

function render(ts){
const t=((ts%LOOP)+LOOP)%LOOP/LOOP;
const sx=canvas.width/W;
const sy=canvas.height/H;
ctx.setTransform(sx,0,0,sy,0,0);

ctx.fillStyle='#0A0501';
ctx.fillRect(0,0,W,H);

const pulse=0.5+0.5*Math.sin(TAU*t);
const pulse2=0.5+0.5*Math.sin(TAU*t*2+1.1);

const bgGrad=ctx.createRadialGradient(W*0.5,H*0.44,40,W*0.5,H*0.48,W*0.62);
bgGrad.addColorStop(0,`rgba(245,158,11,${0.16+pulse*0.05})`);
bgGrad.addColorStop(0.28,`rgba(120,53,15,${0.26+pulse2*0.04})`);
bgGrad.addColorStop(0.65,'rgba(42,18,4,0.32)');
bgGrad.addColorStop(1,'rgba(10,5,1,0)');
ctx.fillStyle=bgGrad;
ctx.fillRect(0,0,W,H);

const leftDrape=ctx.createLinearGradient(0,0,W*0.42,0);
leftDrape.addColorStop(0,`rgba(120,53,15,${0.34+pulse*0.05})`);
leftDrape.addColorStop(0.55,`rgba(180,83,9,${0.12+pulse2*0.03})`);
leftDrape.addColorStop(1,'rgba(10,5,1,0)');
ctx.fillStyle=leftDrape;
ctx.fillRect(0,0,W*0.42,H);

const rightDrape=ctx.createLinearGradient(W,0,W*0.58,0);
rightDrape.addColorStop(0,`rgba(120,53,15,${0.34+pulse*0.05})`);
rightDrape.addColorStop(0.55,`rgba(180,83,9,${0.12+pulse2*0.03})`);
rightDrape.addColorStop(1,'rgba(10,5,1,0)');
ctx.fillStyle=rightDrape;
ctx.fillRect(W*0.58,0,W*0.42,H);

const topWash=ctx.createLinearGradient(0,0,0,H*0.55);
topWash.addColorStop(0,`rgba(245,158,11,${0.14+pulse*0.04})`);
topWash.addColorStop(0.45,'rgba(120,53,15,0.06)');
topWash.addColorStop(1,'rgba(10,5,1,0)');
ctx.fillStyle=topWash;
ctx.fillRect(0,0,W,H*0.55);

ctx.save();
ctx.globalCompositeOperation='lighter';

for(let i=0;i<bokehBack.length;i++){
const b=bokehBack[i];
const span=H+b.r*4;
const y=((b.y+t*b.speed*span)%span)-b.r*2;
const x=b.x+Math.sin(TAU*(t*b.swayFreq+b.swayPhase))*b.swayAmp;
const a=b.alpha*(0.75+0.25*Math.sin(TAU*(t*b.pulseFreq+b.pulsePhase)));
const sp=b.col[0]===254?spChampagne:b.col[0]===245?spGold:spBronze;
ctx.globalAlpha=a;
ctx.drawImage(sp,x-b.r,y-b.r,b.r*2,b.r*2);
}

for(let i=0;i<strands.length;i++){
const s=strands[i];
const x=s.x+Math.sin(TAU*(t*s.swayFreq+s.swayPhase))*s.swayAmp;
const wave=0.5+0.5*Math.sin(TAU*(t*s.pulseFreq+s.pulsePhase-s.x/1100));
const a=s.alpha*(0.6+0.6*wave);
const gr=ctx.createLinearGradient(x,0,x,s.length);
gr.addColorStop(0,`rgba(254,243,199,${a*0.85})`);
gr.addColorStop(0.28,`rgba(245,158,11,${a})`);
gr.addColorStop(0.75,`rgba(120,53,15,${a*0.55})`);
gr.addColorStop(1,'rgba(120,53,15,0)');
ctx.globalAlpha=1;
ctx.fillStyle=gr;
ctx.fillRect(x-s.width*0.5,0,s.width,s.length);
}

ctx.restore();

const spanF=H+120;
for(let i=0;i<flakeCount;i++){
const f=flakes[i];
const y=((f.y+t*f.speed*spanF)%spanF)-60;
const x=f.x+Math.sin(TAU*(t*f.swayFreq+f.swayPhase))*f.swayAmp;

const spin=Math.cos(TAU*(t*f.spinFreq+f.spinPhase));
const absSpin=Math.abs(spin);
const wave=0.5+0.5*Math.sin(TAU*(t*2-x/900+y/1400));
const flash=Math.pow(absSpin,3.2)*wave;

const isBright=flash>0.46;
const scaleX=Math.max(0.14,absSpin);
const r=f.size*(isBright?1+flash*0.35:1);

let cr,cg,cb;
if(isBright){
const mix=Math.min(1,(flash-0.46)/0.44);
cr=Math.round(f.col[0]+(254-f.col[0])*mix);
cg=Math.round(f.col[1]+(243-f.col[1])*mix);
cb=Math.round(f.col[2]+(199-f.col[2])*mix);
}else{
const shade=0.58+0.42*absSpin;
cr=Math.round(f.col[0]*shade);
cg=Math.round(f.col[1]*shade);
cb=Math.round(f.col[2]*shade);
}

const edgeFade=y<80?Math.max(0,y/80):y>H-80?Math.max(0,(H-y)/80):1;
const alpha=Math.min(1,f.alpha*(0.45+0.55*absSpin+flash*0.6)*edgeFade);

if(alpha<0.02)continue;

ctx.save();
ctx.translate(x,y);
ctx.rotate(f.tilt);
ctx.scale(scaleX,1);
ctx.fillStyle=`rgba(${cr},${cg},${cb},${alpha})`;

if(f.shape===0){
ctx.beginPath();
ctx.moveTo(0,-r);
ctx.lineTo(r*0.78,0);
ctx.lineTo(0,r);
ctx.lineTo(-r*0.78,0);
ctx.closePath();
ctx.fill();
}else if(f.shape===1){
ctx.beginPath();
for(let k=0;k<6;k++){
const a=k*Math.PI/3;
const px=Math.cos(a)*r;
const py=Math.sin(a)*r;
if(k===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
}
ctx.closePath();
ctx.fill();
}else{
ctx.beginPath();
ctx.arc(0,0,r*0.72,0,TAU);
ctx.fill();
}
ctx.restore();

if(flash>0.68&&f.glintBias>0.42){
const ga=Math.min(1,(flash-0.68)/0.32)*edgeFade;
ctx.save();
ctx.globalCompositeOperation='lighter';
ctx.globalAlpha=ga*0.55;
const haloR=r*4.2;
ctx.drawImage(spChampagne,x-haloR,y-haloR,haloR*2,haloR*2);
ctx.globalAlpha=1;
drawStar(x,y,r*(2.2+ga*2.2),ga*0.92);
ctx.restore();
}
}

ctx.save();
ctx.globalCompositeOperation='lighter';
for(let i=0;i<foreSparkles.length;i++){
const p=foreSparkles[i];
const span=H+p.r*6;
const y=((p.y+t*p.speed*span)%span)-p.r*3;
const x=p.x+Math.sin(TAU*(t*p.swayFreq+p.swayPhase))*p.swayAmp;
const twinkle=0.45+0.55*Math.sin(TAU*(t*p.pulseFreq+p.pulsePhase));
const a=p.alpha*twinkle;
const sp=p.warm?spGold:spChampagne;
ctx.globalAlpha=a;
ctx.drawImage(sp,x-p.r,y-p.r,p.r*2,p.r*2);
if(twinkle>0.82){
drawStar(x,y,p.r*0.65,a*0.85);
}
}
ctx.restore();

const vig=ctx.createRadialGradient(W*0.5,H*0.5,W*0.34,W*0.5,H*0.5,W*0.72);
vig.addColorStop(0,'rgba(10,5,1,0)');
vig.addColorStop(1,'rgba(10,5,1,0.52)');
ctx.fillStyle=vig;
ctx.fillRect(0,0,W,H);

requestAnimationFrame(render);
}
requestAnimationFrame(render);
})();
</script>
</body>
</html>
