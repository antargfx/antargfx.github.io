<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Art Deco Gold Emerald Clockwork Happy New Year Countdown Animation</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#041C18}
svg{display:block;width:100%;height:100%}
.rays-spin{transform-origin:0 0;animation:spin15 10s linear infinite}
.gear-cw{transform-origin:0 0;animation:spin30 10s linear infinite}
.gear-ccw{transform-origin:0 0;animation:spinCCW30 10s linear infinite}
.hand-sweep{transform-origin:0 0;animation:spin360 1s linear infinite}
.arc-sweep{stroke-dasharray:1350.88;stroke-dashoffset:1350.88;animation:sweepArc 1s linear infinite}
.tick-pulse{transform-origin:0 0;animation:pulseDiamond 1s ease-in-out infinite}
.drift-slow{animation:riseUp 10s linear infinite}
.drift-fast{animation:riseUp 5s linear infinite}
.spark-a{transform-origin:0 0;animation:glint 2s ease-in-out infinite}
.spark-b{transform-origin:0 0;animation:glint 5s ease-in-out infinite}
.shimmer{animation:goldGlow 2s ease-in-out infinite}
.fan-breathe{transform-origin:0 0;animation:fanPulse 5s ease-in-out infinite}
.num-item{font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:215px;text-anchor:middle;dominant-baseline:central;transform-origin:0 0;opacity:0;animation:countStep 10s linear infinite}
.n10{animation-delay:0s}
.n9{animation-delay:-9s}
.n8{animation-delay:-8s}
.n7{animation-delay:-7s}
.n6{animation-delay:-6s}
.n5{animation-delay:-5s}
.n4{animation-delay:-4s}
.n3{animation-delay:-3s}
.n2{animation-delay:-2s}
.n1{animation-delay:-1s}
@keyframes spin15{
  0%{transform:rotate(0deg)}
  100%{transform:rotate(15deg)}
}
@keyframes spin30{
  0%{transform:rotate(0deg)}
  100%{transform:rotate(30deg)}
}
@keyframes spinCCW30{
  0%{transform:rotate(0deg)}
  100%{transform:rotate(-30deg)}
}
@keyframes spin360{
  0%{transform:rotate(0deg)}
  100%{transform:rotate(360deg)}
}
@keyframes sweepArc{
  0%{stroke-dashoffset:1350.88}
  100%{stroke-dashoffset:0}
}
@keyframes pulseDiamond{
  0%{transform:scale(0.95);opacity:0.8}
  55%{transform:scale(1.13);opacity:0}
  100%{transform:scale(1.13);opacity:0}
}
@keyframes riseUp{
  0%{transform:translateY(0)}
  100%{transform:translateY(-1080px)}
}
@keyframes glint{
  0%,100%{transform:scale(0.3) rotate(0deg);opacity:0.25}
  50%{transform:scale(1.15) rotate(45deg);opacity:1}
}
@keyframes goldGlow{
  0%,100%{opacity:0.88}
  50%{opacity:1}
}
@keyframes fanPulse{
  0%,100%{opacity:0.35;transform:scale(0.98)}
  50%{opacity:0.65;transform:scale(1.03)}
}
@keyframes countStep{
  0%{opacity:0;transform:scale(0.86)}
  1.2%{opacity:1;transform:scale(1.03)}
  2.2%{opacity:1;transform:scale(1)}
  8.6%{opacity:1;transform:scale(1)}
  9.8%{opacity:0;transform:scale(1.08)}
  100%{opacity:0;transform:scale(1.08)}
}
</style>
</head>
<body>
