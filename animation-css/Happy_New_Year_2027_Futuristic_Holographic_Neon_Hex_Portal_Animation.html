<title>Happy New Year 2027 Futuristic Holographic Neon Hex Portal Animation</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#050714;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:#050714}
#scene{width:100%;height:100%;display:block}
.ray-spin{transform-origin:960px 540px;animation:spinSlow 10s linear infinite}
.ray-spin-rev{transform-origin:960px 540px;animation:spinRev 10s linear infinite}
.portal-float{transform-origin:960px 540px;animation:floatY 5s ease-in-out infinite}
.hex-breathe-a{transform-origin:960px 540px;animation:breatheA 5s ease-in-out infinite}
.hex-breathe-b{transform-origin:960px 540px;animation:breatheB 10s ease-in-out infinite}
.pulse-500{stroke-dasharray:260 1240;animation:dash500 10s linear infinite}
.pulse-440{stroke-dasharray:220 1100;animation:dash440 5s linear infinite}
.pulse-380{stroke-dasharray:190 950;animation:dash380 10s linear infinite}
.pulse-325{stroke-dasharray:160 815;animation:dash325 5s linear infinite}
.neon-flicker{animation:neonGlow 5s ease-in-out infinite}
.cyan-glow{animation:cyanPulse 2s ease-in-out infinite}
.node-pulse{animation:nodeBlink 2s ease-in-out infinite}
.floor-glow{animation:floorPulse 5s ease-in-out infinite}
.sheen-sweep{animation:sheenMove 10s linear infinite}
@keyframes spinSlow{0%{transform:rotate(0deg)}100%{transform:rotate(60deg)}}
@keyframes spinRev{0%{transform:rotate(0deg)}100%{transform:rotate(-60deg)}}
@keyframes floatY{0%,100%{transform:translateY(0px)}50%{transform:translateY(-8px)}}
@keyframes breatheA{0%,100%{transform:scale(1);opacity:.92}50%{transform:scale(1.015);opacity:1}}
@keyframes breatheB{0%,100%{transform:scale(1);opacity:.82}50%{transform:scale(.985);opacity:1}}
@keyframes dash500{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-3000}}
@keyframes dash440{0%{stroke-dashoffset:0}100%{stroke-dashoffset:2640}}
@keyframes dash380{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-2280}}
@keyframes dash325{0%{stroke-dashoffset:0}100%{stroke-dashoffset:1950}}
@keyframes neonGlow{0%,100%{opacity:.94}50%{opacity:1}}
@keyframes cyanPulse{0%,100%{opacity:.88}50%{opacity:1}}
@keyframes nodeBlink{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes floorPulse{0%,100%{opacity:.38}50%{opacity:.62}}
@keyframes sheenMove{0%{transform:translateX(-760px)}100%{transform:translateX(760px)}}
</style>

<script>
(function(){
var ns="http://www.w3.org/2000/svg";
var gridGroup=document.getElementById("dynamic-grid");
var backGroup=document.getElementById("sparks-back");
var frontGroup=document.getElementById("sparks-front");
var gridLines=[];
var gridCount=12;
for(var i=0;i<gridCount;i++){
var lb=document.createElementNS(ns,"line");
lb.setAttribute("x1","0");
lb.setAttribute("x2","1920");
lb.setAttribute("stroke","#3B82F6");
lb.setAttribute("stroke-width","1.4");
gridGroup.appendChild(lb);
var lt=document.createElementNS(ns,"line");
lt.setAttribute("x1","0");
lt.setAttribute("x2","1920");
lt.setAttribute("stroke","#8B5CF6");
lt.setAttribute("stroke-width","1.2");
gridGroup.appendChild(lt);
gridLines.push({bot:lb,top:lt,idx:i});
}
var palette=["#FFF8D6","#00F0FF","#38BDF8","#8B5CF6","#3B82F6"];
var sparks=[];
var totalSparks=64;
function seed(n){
var x=Math.sin(n*127.1+311.7)*43758.5453123;
return x-Math.floor(x);
}
for(var s=0;s<totalSparks;s++){
var r1=seed(s+1);
var r2=seed(s+101);
var r3=seed(s+201);
var r4=seed(s+301);
var r5=seed(s+401);
var isFront=s%3!==0;
var isDash=s%2===0;
var el;
if(isDash){
el=document.createElementNS(ns,"rect");
var w=4+r3*9;
var h=2+r4*2.5;
el.setAttribute("width",w.toFixed(1));
el.setAttribute("height",h.toFixed(1));
el.setAttribute("rx","1.5");
}else{
el=document.createElementNS(ns,"polygon");
var sz=2.5+r3*4.5;
el.setAttribute("points","0,"+(-sz)+" "+sz+",0 0,"+sz+" "+(-sz)+",0");
}
el.setAttribute("fill",palette[s%palette.length]);
if(isFront){
el.setAttribute("filter","url(#glowSoft)");
frontGroup.appendChild(el);
}else{
backGroup.appendChild(el);
}
sparks.push({
el:el,
rx:340+r1*430,
ry:260+r2*260,
angle0:r3*Math.PI*2,
dir:s%2===0?1:-1,
turns:s%5===0?2:1,
wobbleAmp:12+r4*28,
wobbleFreq:1+Math.floor(r5*3),
twinkleFreq:1+Math.floor(r1*4),
phase:r2*Math.PI*2,
spinSpeed:(s%2===0?1:-1)*(1+Math.floor(r4*3))*360,
baseOp:isFront?0.85:0.55
});
}
function render(ts){
var t=(ts%10000)/10000;
var twoPi=Math.PI*2;
for(var i=0;i<gridCount;i++){
var g=gridLines[i];
var p=(g.idx/gridCount+t)%1;
var ease=p*p*p;
var yBot=540+ease*540;
var yTop=540-ease*540;
var op=(0.04+ease*0.42).toFixed(3);
g.bot.setAttribute("y1",yBot.toFixed(2));
g.bot.setAttribute("y2",yBot.toFixed(2));
g.bot.setAttribute("stroke-opacity",op);
g.top.setAttribute("y1",yTop.toFixed(2));
g.top.setAttribute("y2",yTop.toFixed(2));
g.top.setAttribute("stroke-opacity",(op*0.8).toFixed(3));
}
for(var j=0;j<totalSparks;j++){
var sp=sparks[j];
var a=sp.angle0+sp.dir*sp.turns*twoPi*t;
var wob=Math.sin(sp.wobbleFreq*twoPi*t+sp.phase)*sp.wobbleAmp;
var x=960+Math.cos(a)*(sp.rx+wob);
var y=540+Math.sin(a)*(sp.ry+wob*0.7);
var rot=sp.spinSpeed*t+(sp.phase*57.3);
var tw=0.35+0.65*(0.5+0.5*Math.sin(sp.twinkleFreq*twoPi*t+sp.phase));
var sc=0.7+0.45*tw;
sp.el.setAttribute("transform","translate("+x.toFixed(2)+","+y.toFixed(2)+") rotate("+rot.toFixed(1)+") scale("+sc.toFixed(2)+")");
sp.el.setAttribute("opacity",(sp.baseOp*tw).toFixed(3));
}
requestAnimationFrame(render);
}
requestAnimationFrame(render);
})();
</script>
