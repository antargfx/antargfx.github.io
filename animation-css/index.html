
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <title>CSS Animations | Antar's Projects</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Inter, Arial, sans-serif;
      background: #101827;
      color: #f1f5f9;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    .header {
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: clamp(25px, 5vw, 36px);
      margin-bottom: 10px;
    }

    .header p {
      color: #94a3b8;
      font-size: 14px;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    #search {
      flex: 1;
      min-width: 200px;
      padding: 13px 16px;
      border: 1px solid #334155;
      border-radius: 9px;
      background: #1e293b;
      color: white;
      font-size: 14px;
      outline: none;
    }

    #search:focus {
      border-color: #6366f1;
    }

    #refresh {
      padding: 12px 20px;
      border: none;
      border-radius: 9px;
      background: #4f46e5;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }

    #refresh:hover {
      background: #4338ca;
    }

    .info {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 15px;
      color: #94a3b8;
      font-size: 13px;
    }

    .file-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 15px;
    }

    .file-card {
      display: block;
      text-decoration: none;
      color: white;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
      transition: .2s ease;
    }

    .file-card:hover {
      transform: translateY(-3px);
      border-color: #6366f1;
      background: #263449;
    }

    .file-icon {
      font-size: 25px;
      margin-bottom: 13px;
    }

    .file-name {
      font-size: 14px;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .file-type {
      color: #94a3b8;
      font-size: 12px;
      margin-top: 7px;
    }

    .status {
      text-align: center;
      padding: 45px 15px;
      color: #94a3b8;
      grid-column: 1 / -1;
    }

    .footer {
      margin-top: 45px;
      text-align: center;
      font-size: 12px;
      color: #64748b;
    }

    .footer a {
      color: #818cf8;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <main class="container">

    <header class="header">
      <h1>CSS Animations</h1>
      <p>Explore all available animation projects.</p>
    </header>

    <div class="toolbar">
      <input
        type="search"
        id="search"
        placeholder="Search projects..."
        autocomplete="off"
      >
      <button id="refresh" onclick="loadFiles()">↻ Refresh</button>
    </div>

    <div class="info">
      <span id="fileCount">Loading projects...</span>
      <span id="lastUpdated"></span>
    </div>

    <section class="file-grid" id="fileList">
      <div class="status">Loading HTML files...</div>
    </section>

    <footer class="footer">
      Powered by GitHub API ·
      <a href="https://github.com/antargfx/antargfx.github.io"
         target="_blank">View Repository</a>
    </footer>

  </main>

  <script>
    // GitHub repository configuration
    const OWNER = "antargfx";
    const REPO = "antargfx.github.io";
    const FOLDER = "animation-css";
    const BRANCH = "main";

    const API_URL =
      `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FOLDER}?ref=${BRANCH}`;

    let allFiles = [];

    const fileList = document.getElementById("fileList");
    const searchInput = document.getElementById("search");
    const fileCount = document.getElementById("fileCount");
    const lastUpdated = document.getElementById("lastUpdated");

    // Load all HTML files from GitHub
    async function loadFiles() {
      fileList.innerHTML =
        '<div class="status">Loading projects...</div>';

      fileCount.textContent = "Fetching files...";

      try {
        const response = await fetch(API_URL, {
          headers: {
            Accept: "application/vnd.github+json"
          }
        });

        if (!response.ok) {
          throw new Error(
            `GitHub API error: ${response.status}`
          );
        }

        const files = await response.json();

        allFiles = files
          .filter(file =>
            file.type === "file" &&
            file.name.toLowerCase().endsWith(".html") &&
            file.name.toLowerCase() !== "index.html"
          )
          .sort((a, b) =>
            b.name.localeCompare(a.name, undefined, {
              numeric: true,
              sensitivity: "base"
            })
          );

        renderFiles(allFiles);

        lastUpdated.textContent =
          "Updated: " + new Date().toLocaleTimeString();

      } catch (error) {
        console.error(error);

        fileCount.textContent = "Unable to load projects";

        fileList.innerHTML = `
          <div class="status">
            <h3>Something went wrong!</h3>
            <p style="margin-top:10px">
              ${escapeHTML(error.message)}
            </p>
            <p style="margin-top:10px">
              Check the repository name and branch configuration.
            </p>
          </div>
        `;
      }
    }

    // Display files
    function renderFiles(files) {
      fileCount.textContent =
        `${files.length} project${files.length !== 1 ? "s" : ""} found`;

      if (!files.length) {
        fileList.innerHTML =
          '<div class="status">No HTML projects found.</div>';
        return;
      }

      fileList.innerHTML = files.map(file => {
        const fileName = escapeHTML(file.name);
        const fileURL = `${FOLDER}/${encodeURIComponent(file.name)}`;

        return `
          <a class="file-card"
             href="${fileURL}">
            <div class="file-icon">🌐</div>
            <div class="file-name">${fileName}</div>
            <div class="file-type">HTML Project · Open project ↗</div>
          </a>
        `;
      }).join("");
    }

    // Search projects
    searchInput.addEventListener("input", () => {
      const keyword = searchInput.value.toLowerCase().trim();

      const filtered = allFiles.filter(file =>
        file.name.toLowerCase().includes(keyword)
      );

      renderFiles(filtered);
    });

    // Escape HTML to prevent markup injection
    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[char]);
    }

    // Initial loading
    loadFiles();
  </script>

</body>
</html>
