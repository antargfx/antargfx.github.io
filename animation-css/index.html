
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">

  <title>CSS Animations | Antar's Projects</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <style>
    :root {
      --bg: #101827;
      --card: #1e293b;
      --card-hover: #263449;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #334155;
      --success: #22c55e;
      --danger: #f87171;
      --radius: 14px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 45px 20px;
    }

    button, input {
      font: inherit;
    }

    .container {
      max-width: 1150px;
      width: 100%;
      margin: auto;
    }

    /* HEADER */

    .header {
      margin-bottom: 35px;
    }

    .header-top {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 12px;
    }

    .header-icon {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      background: rgba(99,102,241,.15);
      color: #818cf8;
      border-radius: 15px;
      font-size: 23px;
    }

    .header h1 {
      font-size: clamp(25px,5vw,36px);
      font-weight: 800;
      letter-spacing: -1px;
    }

    .header p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    /* TOOLBAR */

    .toolbar {
      display: flex;
      gap: 12px;
      margin-bottom: 22px;
    }

    .search-box {
      position: relative;
      flex: 1;
    }

    .search-box i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    #search {
      width: 100%;
      height: 48px;
      padding: 0 15px 0 43px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      color: white;
      font-size: 14px;
    }

    #search:focus {
      border-color: var(--primary);
    }

    #search::placeholder {
      color: #64748b;
    }

    #refresh {
      height: 48px;
      padding: 0 18px;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: white;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    #refresh:hover {
      background: var(--primary-hover);
    }

    #refresh:disabled {
      opacity: .6;
      cursor: wait;
    }

    /* INFO */

    .info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 17px;
      color: var(--muted);
      font-size: 13px;
    }

    .info-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
    }

    /* GRID */

    .file-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 18px;
    }

    /* PROJECT CARD */

    .file-card {
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
      text-decoration: none;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      transition: .25s ease;
    }

    .file-card:hover {
      transform: translateY(-4px);
      border-color: var(--primary);
      background: var(--card-hover);
      box-shadow: 0 12px 30px rgba(0,0,0,.2);
    }

    /* LIVE PREVIEW */

    .preview-container {
      position: relative;
      width: 100%;
      height: 190px;
      overflow: hidden;
      background: #e2e8f0;
      border-bottom: 1px solid var(--border);
    }

    .preview-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: white;
      pointer-events: none;
    }

    .preview-loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: #1e293b;
      color: #94a3b8;
      font-size: 12px;
      pointer-events: none;
      transition: opacity .3s;
    }

    .preview-loading i {
      font-size: 23px;
      margin-bottom: 8px;
      display: block;
    }

    .preview-loading.hidden {
      opacity: 0;
    }

    .preview-label {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(15,23,42,.85);
      color: #cbd5e1;
      padding: 6px 9px;
      border-radius: 6px;
      font-size: 10px;
      z-index: 2;
      pointer-events: none;
    }

    .preview-label i {
      color: #818cf8;
      margin-right: 4px;
    }

    .preview-failed {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      color: #94a3b8;
      background: #1e293b;
      font-size: 12px;
      text-align: center;
      pointer-events: none;
    }

    .preview-failed i {
      display: block;
      font-size: 25px;
      margin-bottom: 10px;
    }

    /* CARD DETAILS */

    .file-details {
      padding: 16px 18px 18px;
    }

    .file-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 13px;
    }

    .file-icon {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      background: rgba(99,102,241,.15);
      color: #818cf8;
      border-radius: 9px;
      font-size: 17px;
    }

    .open-icon {
      color: #64748b;
      font-size: 13px;
      transition: .2s;
    }

    .file-card:hover .open-icon {
      color: #a5b4fc;
      transform: translate(2px,-2px);
    }

    .file-name {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .file-type {
      margin-top: 6px;
      color: var(--muted);
      font-size: 11px;
    }

    /* STATUS */

    .status {
      grid-column: 1 / -1;
      text-align: center;
      padding: 65px 15px;
      color: var(--muted);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .status > i {
      font-size: 30px;
      margin-bottom: 18px;
      display: block;
      color: #818cf8;
    }

    .status h3 {
      color: var(--text);
      font-size: 16px;
      margin-bottom: 8px;
    }

    .status p {
      font-size: 13px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .error-text {
      color: var(--danger);
    }

    .retry-btn {
      margin-top: 18px;
      padding: 10px 17px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    /* FOOTER */

    .footer {
      margin-top: 45px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      color: #64748b;
      font-size: 12px;
    }

    .footer a {
      color: #818cf8;
      text-decoration: none;
    }

    .footer a:hover {
      color: #a5b4fc;
    }

    /* RESPONSIVE */

    @media (max-width: 600px) {
      body {
        padding: 28px 15px;
      }

      .toolbar {
        flex-direction: column;
      }

      #refresh {
        width: 100%;
      }

      .file-grid {
        grid-template-columns: repeat(2,minmax(0,1fr));
        gap: 11px;
      }

      .preview-container {
        height: 135px;
      }

      .file-details {
        padding: 12px;
      }

      .file-name {
        font-size: 12px;
      }

      .footer {
        justify-content: center;
        text-align: center;
      }
    }

    @media (max-width: 350px) {
      .file-grid {
        grid-template-columns: 1fr;
      }

      .preview-container {
        height: 190px;
      }
    }

  </style>
</head>

<body>

  <main class="container">

    <!-- HEADER -->
    <header class="header">

      <div class="header-top">

        <div class="header-icon">
          <i class="fa-solid fa-wand-magic-sparkles"></i>
        </div>

        <h1>CSS Animations</h1>

      </div>

      <p>
        Explore and discover all available animation projects.
      </p>

    </header>


    <!-- SEARCH -->
    <div class="toolbar">

      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>

        <input
          type="search"
          id="search"
          placeholder="Search projects by filename..."
          autocomplete="off"
        >
      </div>

      <button id="refresh" onclick="loadFiles()">
        <i class="fa-solid fa-rotate-right"></i>
        Refresh
      </button>

    </div>


    <!-- INFO -->
    <div class="info">

      <div class="info-left">
        <span class="status-dot"></span>
        <span id="fileCount">Loading projects...</span>
      </div>

      <span id="lastUpdated"></span>

    </div>


    <!-- PROJECT GRID -->
    <section class="file-grid" id="fileList">

      <div class="status">
        <i class="fa-solid fa-spinner fa-spin"></i>
        <h3>Loading projects</h3>
        <p>Please wait while we fetch your files.</p>
      </div>

    </section>


    <!-- FOOTER -->
    <footer class="footer">

      <span>
        <i class="fa-regular fa-copyright"></i>
        Antar's Projects
      </span>

      <a
        href="https://github.com/antargfx/antargfx.github.io"
        target="_blank"
        rel="noopener noreferrer"
      >
        <i class="fa-brands fa-github"></i>
        View Repository
      </a>

    </footer>

  </main>


  <script>

    // =====================================
    // CONFIGURATION
    // =====================================

    const FILES_URL = "./files.json";

    let allFiles = [];


    // =====================================
    // ELEMENTS
    // =====================================

    const fileList = document.getElementById("fileList");
    const fileCount = document.getElementById("fileCount");
    const lastUpdated = document.getElementById("lastUpdated");
    const searchInput = document.getElementById("search");
    const refreshButton = document.getElementById("refresh");


    // =====================================
    // LOAD FILES
    // =====================================

    async function loadFiles() {

      fileList.innerHTML = `
        <div class="status">
          <i class="fa-solid fa-spinner fa-spin"></i>
          <h3>Loading projects</h3>
          <p>Please wait...</p>
        </div>
      `;

      fileCount.textContent = "Fetching projects...";
      refreshButton.disabled = true;

      refreshButton.innerHTML = `
        <i class="fa-solid fa-spinner fa-spin"></i>
        Loading...
      `;

      try {

        const response = await fetch(
          FILES_URL + "?t=" + Date.now(),
          { cache: "no-store" }
        );

        if (!response.ok) {
          throw new Error(
            `HTTP ${response.status}: Unable to load files.json`
          );
        }

        const files = await response.json();

        if (!Array.isArray(files)) {
          throw new Error("Invalid files.json format.");
        }

        allFiles = files.filter(name =>
          typeof name === "string" &&
          name.toLowerCase().endsWith(".html") &&
          name.toLowerCase() !== "index.html" &&
          !name.includes("/") &&
          !name.includes("\\")
        );

        // Newest filename first
        allFiles.sort((a, b) =>
          b.localeCompare(a, undefined, {
            numeric: true,
            sensitivity: "base"
          })
        );

        renderFiles(allFiles);

        lastUpdated.textContent =
          "Updated: " + new Date().toLocaleTimeString();

      }

      catch (error) {

        console.error(error);

        fileCount.textContent = "Unable to load projects";

        fileList.innerHTML = `
          <div class="status">
            <i class="fa-solid fa-triangle-exclamation"
               style="color:#f87171"></i>

            <h3>Something went wrong!</h3>

            <p class="error-text">
              ${escapeHTML(error.message)}
            </p>

            <button class="retry-btn" onclick="loadFiles()">
              <i class="fa-solid fa-rotate-right"></i>
              Try Again
            </button>
          </div>
        `;

      }

      finally {

        refreshButton.disabled = false;

        refreshButton.innerHTML = `
          <i class="fa-solid fa-rotate-right"></i>
          Refresh
        `;

      }

    }


    // =====================================
    // RENDER PROJECT CARDS WITH PREVIEWS
    // =====================================

    function renderFiles(files) {

      fileCount.textContent =
        `${files.length} project${files.length !== 1 ? "s" : ""} found`;

      if (!files.length) {

        fileList.innerHTML = `
          <div class="status">
            <i class="fa-regular fa-folder-open"></i>
            <h3>No projects found</h3>
            <p>No matching HTML files were found.</p>
          </div>
        `;

        return;

      }

      fileList.innerHTML = files.map((name, index) => {

        const safeName = escapeHTML(name);
        const fileURL = "./" + encodeURIComponent(name);

        const frameID = "preview-" + index;

        return `

          <a
            class="file-card"
            href="${fileURL}"
            target="_blank"
            rel="noopener noreferrer"
          >

            <!-- LIVE PREVIEW -->
            <div class="preview-container">

              <div class="preview-label">
                <i class="fa-solid fa-eye"></i>
                LIVE PREVIEW
              </div>

              <iframe
                id="${frameID}"
                class="preview-frame"
                src="${fileURL}"
                loading="lazy"
                title="Preview of ${safeName}"
                sandbox="allow-scripts allow-same-origin"
                tabindex="-1"
                aria-hidden="true"
              ></iframe>

              <div class="preview-loading" id="${frameID}-loading">
                <div>
                  <i class="fa-solid fa-spinner fa-spin"></i>
                  Loading preview...
                </div>
              </div>

              <div class="preview-failed" id="${frameID}-failed">
                <div>
                  <i class="fa-regular fa-image"></i>
                  Preview unavailable
                </div>
              </div>

            </div>


            <!-- PROJECT DETAILS -->
            <div class="file-details">

              <div class="file-card-top">

                <div class="file-icon">
                  <i class="fa-brands fa-html5"></i>
                </div>

                <i class="fa-solid fa-arrow-up-right-from-square open-icon"></i>

              </div>

              <div class="file-name">
                ${safeName}
              </div>

              <div class="file-type">
                HTML Project · Open Project
              </div>

            </div>

          </a>

        `;

      }).join("");


      // Attach iframe preview events
      files.forEach((name, index) => {

        const frameID = "preview-" + index;

        const frame = document.getElementById(frameID);
        const loading = document.getElementById(frameID + "-loading");
        const failed = document.getElementById(frameID + "-failed");

        frame.addEventListener("load", () => {

          loading.classList.add("hidden");
          failed.style.display = "none";

        });

        frame.addEventListener("error", () => {

          loading.classList.add("hidden");
          failed.style.display = "grid";

        });

        // Fallback if the preview does not load
        setTimeout(() => {

          if (!frame.contentDocument?.readyState ||
              frame.contentDocument.readyState === "loading") {

            loading.classList.add("hidden");

          }

        }, 12000);

      });

    }


    // =====================================
    // SEARCH
    // =====================================

    searchInput.addEventListener("input", function() {

      const keyword = this.value.toLowerCase().trim();

      const filtered = allFiles.filter(name =>
        name.toLowerCase().includes(keyword)
      );

      renderFiles(filtered);

    });


    // =====================================
    // HTML ESCAPE
    // =====================================

    function escapeHTML(value) {

      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[char]);

    }


    // =====================================
    // INITIALIZE
    // =====================================

    loadFiles();

  </script>

</body>
</html>
