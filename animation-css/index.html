
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FF7033">

  <title>CSS Animations | Antar's Projects</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <style>
    :root {
      --ink: #252525;
      --muted: #777777;
      --primary: #FF7033;
      --primary-dark: #e85b20;
      --border: rgba(50, 40, 30, .10);
      --card-bg: rgba(255, 255, 255, .78);
      --radius: 18px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background-color: #FF7033;
      background-image: linear-gradient(
        45deg,
        rgba(255,112,51,.05) 0%,
        rgba(255,255,255,.33) 48%,
        rgba(255,112,51,.04) 100%
      );
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-size: 100% 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      padding: 50px 24px;
      background: transparent;
    }

    button {
      font: inherit;
    }

    .container {
      max-width: 1400px;
      width: 100%;
      margin: auto;
    }

    /* HEADER */

    .header {
      margin-bottom: 35px;
    }

    .header-top {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
    }

    .header-icon {
      width: 60px;
      height: 60px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.35);
      color: #a9431b;
      border: 1px solid rgba(255,255,255,.45);
      border-radius: 17px;
      font-size: 25px;
      box-shadow: 0 5px 20px rgba(120,50,20,.08);
    }

    .header h1 {
      font-size: clamp(27px, 5vw, 40px);
      font-weight: 800;
      letter-spacing: -1.5px;
      color: #29231f;
    }

    .header p {
      color: rgba(41,35,31,.72);
      font-size: 14px;
      line-height: 1.7;
    }

    /* INFO BAR */

    .info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }

    .info-left {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 13px;
      font-weight: 600;
      color: #45352c;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #16894c;
      box-shadow: 0 0 0 4px rgba(22,137,76,.12);
    }

    #lastUpdated {
      font-size: 12px;
      color: rgba(41,35,31,.65);
    }

    /* REFRESH BUTTON */

    .refresh-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 17px;
      background: rgba(255,255,255,.65);
      color: #4b3024;
      border: 1px solid rgba(255,255,255,.75);
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: .2s;
    }

    .refresh-btn:hover {
      background: white;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(100,40,15,.08);
    }

    .refresh-btn:disabled {
      opacity: .6;
      cursor: wait;
    }

    /* PROJECT GRID */

    .file-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 24px;
    }

    /* PROJECT CARD */

    .file-card {
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
      text-decoration: none;
      color: var(--ink);
      background: var(--card-bg);
      border: 1px solid rgba(255,255,255,.65);
      border-radius: var(--radius);
      box-shadow: 0 8px 28px rgba(95,44,20,.09);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: transform .25s ease, box-shadow .25s ease;
    }

    .file-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 38px rgba(95,44,20,.17);
    }

    /* LIVE PREVIEW */

    .preview-container {
      position: relative;
      width: 100%;
      height: 245px;
      overflow: hidden;
      background: #f1f1f1;
      border-bottom: 1px solid rgba(0,0,0,.07);
    }

    .preview-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
      background: white;
      pointer-events: none;
    }

    .preview-label {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 2;
      padding: 7px 10px;
      background: rgba(255,255,255,.9);
      color: #4c4038;
      border: 1px solid rgba(0,0,0,.06);
      border-radius: 7px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .3px;
      pointer-events: none;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .preview-label i {
      color: var(--primary);
      margin-right: 5px;
    }

    .preview-loading,
    .preview-failed {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: #fff9f5;
      color: #9b7967;
      font-size: 12px;
      text-align: center;
      pointer-events: none;
    }

    .preview-loading i,
    .preview-failed i {
      display: block;
      font-size: 25px;
      margin-bottom: 10px;
      color: var(--primary);
    }

    .preview-loading.hidden {
      display: none;
    }

    .preview-failed {
      display: none;
    }

    /* PROJECT DETAILS */

    .file-details {
      padding: 20px 22px 22px;
    }

    .file-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .file-icon {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      background: rgba(255,112,51,.12);
      color: #e75c24;
      border-radius: 11px;
      font-size: 20px;
    }

    .open-icon {
      color: #9a8173;
      font-size: 14px;
      transition: .2s;
    }

    .file-card:hover .open-icon {
      color: var(--primary-dark);
      transform: translate(3px,-3px);
    }

    .file-name {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.6;
      overflow-wrap: anywhere;
      color: #29231f;
    }

    .file-type {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 7px;
      color: #8b7669;
      font-size: 11px;
    }

    /* STATUS */

    .status {
      grid-column: 1 / -1;
      text-align: center;
      padding: 75px 20px;
      color: #80675a;
      background: rgba(255,255,255,.65);
      border: 1px solid rgba(255,255,255,.7);
      border-radius: var(--radius);
      box-shadow: 0 8px 28px rgba(95,44,20,.06);
    }

    .status > i {
      font-size: 34px;
      margin-bottom: 18px;
      display: block;
      color: var(--primary-dark);
    }

    .status h3 {
      color: #29231f;
      font-size: 17px;
      margin-bottom: 9px;
    }

    .status p {
      font-size: 13px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .error-text {
      color: #c0392b;
    }

    .retry-btn {
      margin-top: 18px;
      padding: 11px 18px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 9px;
      cursor: pointer;
      font-weight: 600;
    }

    /* FOOTER */

    .footer {
      margin-top: 50px;
      padding-top: 22px;
      border-top: 1px solid rgba(80,45,25,.15);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      color: rgba(41,35,31,.65);
      font-size: 12px;
    }

    .footer a {
      color: #8f3d1e;
      text-decoration: none;
      font-weight: 600;
    }

    .footer a:hover {
      color: #54210d;
    }

    /* RESPONSIVE */

    @media (max-width: 1000px) {
      .file-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .preview-container {
        height: 220px;
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 30px 15px;
      }

      .file-grid {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .preview-container {
        height: 230px;
      }

      .file-details {
        padding: 17px;
      }

      .header h1 {
        letter-spacing: -1px;
      }

      .footer {
        justify-content: center;
        text-align: center;
      }
    }

  </style>
</head>

<body>

  <main class="container">

    <!-- HEADER -->
    <header class="header">

      <div class="header-top">

        <div class="header-icon">
          <i class="fa-solid fa-wand-magic-sparkles"></i>
        </div>

        <h1>CSS Animations</h1>

      </div>

      <p>
        Explore and discover all available animation projects.
      </p>

    </header>


    <!-- INFO -->
    <div class="info">

      <div class="info-left">
        <span class="status-dot"></span>
        <span id="fileCount">Loading projects...</span>
      </div>

      <div style="display:flex;align-items:center;gap:15px;flex-wrap:wrap">

        <span id="lastUpdated"></span>

        <button class="refresh-btn" id="refresh" onclick="loadFiles()">
          <i class="fa-solid fa-rotate-right"></i>
          Refresh
        </button>

      </div>

    </div>


    <!-- PROJECT GRID -->
    <section class="file-grid" id="fileList">

      <div class="status">
        <i class="fa-solid fa-spinner fa-spin"></i>
        <h3>Loading projects</h3>
        <p>Please wait while we fetch your files.</p>
      </div>

    </section>


    <!-- FOOTER -->
    <footer class="footer">

      <span>
        <i class="fa-regular fa-copyright"></i>
        Antar's Projects
      </span>

      <a
        href="https://github.com/antargfx/antargfx.github.io"
        target="_blank"
        rel="noopener noreferrer"
      >
        <i class="fa-brands fa-github"></i>
        View Repository
      </a>

    </footer>

  </main>


  <script>

    // =====================================
    // CONFIGURATION
    // =====================================

    const FILES_URL = "./files.json";

    let allFiles = [];


    // =====================================
    // DOM ELEMENTS
    // =====================================

    const fileList = document.getElementById("fileList");
    const fileCount = document.getElementById("fileCount");
    const lastUpdated = document.getElementById("lastUpdated");
    const refreshButton = document.getElementById("refresh");


    // =====================================
    // LOAD FILES
    // =====================================

    async function loadFiles() {

      fileList.innerHTML = `
        <div class="status">
          <i class="fa-solid fa-spinner fa-spin"></i>
          <h3>Loading projects</h3>
          <p>Please wait...</p>
        </div>
      `;

      fileCount.textContent = "Fetching projects...";

      refreshButton.disabled = true;

      refreshButton.innerHTML = `
        <i class="fa-solid fa-spinner fa-spin"></i>
        Loading...
      `;

      try {

        const response = await fetch(
          FILES_URL + "?t=" + Date.now(),
          { cache: "no-store" }
        );

        if (!response.ok) {
          throw new Error(
            `HTTP ${response.status}: Unable to load files.json`
          );
        }

        const files = await response.json();

        if (!Array.isArray(files)) {
          throw new Error("Invalid files.json format.");
        }

        allFiles = files.filter(name =>
          typeof name === "string" &&
          name.toLowerCase().endsWith(".html") &&
          name.toLowerCase() !== "index.html" &&
          !name.includes("/") &&
          !name.includes("\\")
        );

        allFiles.sort((a, b) =>
          b.localeCompare(a, undefined, {
            numeric: true,
            sensitivity: "base"
          })
        );

        renderFiles(allFiles);

        lastUpdated.textContent =
          "Updated: " + new Date().toLocaleTimeString();

      }

      catch (error) {

        console.error(error);

        fileCount.textContent = "Unable to load projects";

        fileList.innerHTML = `
          <div class="status">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <h3>Something went wrong!</h3>
            <p class="error-text">
              ${escapeHTML(error.message)}
            </p>
            <button class="retry-btn" onclick="loadFiles()">
              <i class="fa-solid fa-rotate-right"></i>
              Try Again
            </button>
          </div>
        `;

      }

      finally {

        refreshButton.disabled = false;

        refreshButton.innerHTML = `
          <i class="fa-solid fa-rotate-right"></i>
          Refresh
        `;

      }

    }


    // =====================================
    // RENDER PROJECT CARDS
    // =====================================

    function renderFiles(files) {

      fileCount.textContent =
        `${files.length} project${files.length !== 1 ? "s" : ""} found`;

      if (!files.length) {

        fileList.innerHTML = `
          <div class="status">
            <i class="fa-regular fa-folder-open"></i>
            <h3>No projects found</h3>
            <p>No HTML files were found.</p>
          </div>
        `;

        return;

      }

      fileList.innerHTML = files.map((name, index) => {

        const safeName = escapeHTML(name);
        const fileURL = "./" + encodeURIComponent(name);
        const frameID = "preview-" + index;

        return `

          <a
            class="file-card"
            href="${fileURL}"
            target="_blank"
            rel="noopener noreferrer"
          >

            <!-- PREVIEW -->
            <div class="preview-container">

              <div class="preview-label">
                <i class="fa-solid fa-eye"></i>
                LIVE PREVIEW
              </div>

              <iframe
                id="${frameID}"
                class="preview-frame"
                src="${fileURL}"
                loading="lazy"
                title="Preview of ${safeName}"
                sandbox="allow-scripts allow-same-origin"
                tabindex="-1"
                aria-hidden="true"
              ></iframe>

              <div class="preview-loading" id="${frameID}-loading">
                <div>
                  <i class="fa-solid fa-spinner fa-spin"></i>
                  Loading preview...
                </div>
              </div>

              <div class="preview-failed" id="${frameID}-failed">
                <div>
                  <i class="fa-regular fa-image"></i>
                  Preview unavailable
                </div>
              </div>

            </div>


            <!-- DETAILS -->
            <div class="file-details">

              <div class="file-card-top">

                <div class="file-icon">
                  <i class="fa-brands fa-html5"></i>
                </div>

                <i class="fa-solid fa-arrow-up-right-from-square open-icon"></i>

              </div>

              <div class="file-name">
                ${safeName}
              </div>

              <div class="file-type">
                <i class="fa-solid fa-code"></i>
                HTML Project · Open Project
              </div>

            </div>

          </a>

        `;

      }).join("");


      // PREVIEW LOAD EVENTS
      files.forEach((name, index) => {

        const frameID = "preview-" + index;

        const frame = document.getElementById(frameID);
        const loading = document.getElementById(frameID + "-loading");
        const failed = document.getElementById(frameID + "-failed");

        frame.addEventListener("load", () => {
          loading.classList.add("hidden");
          failed.style.display = "none";
        });

        frame.addEventListener("error", () => {
          loading.classList.add("hidden");
          failed.style.display = "grid";
        });

        setTimeout(() => {
          if (loading && loading.isConnected) {
            loading.classList.add("hidden");
          }
        }, 15000);

      });

    }


    // =====================================
    // HTML ESCAPE
    // =====================================

    function escapeHTML(value) {

      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[char]);

    }


    // =====================================
    // INITIALIZE
    // =====================================

    loadFiles();

  </script>

</body>
</html>
