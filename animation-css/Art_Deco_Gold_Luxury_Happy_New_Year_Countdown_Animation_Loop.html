<title>Art Deco Gold Luxury Happy New Year Countdown Animation Loop</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#041418}
svg{display:block;width:100%;height:100%}
.rays-cw{transform-origin:960px 540px;animation:spinRays 10s linear infinite}
@keyframes spinRays{
0%{transform:rotate(0deg)}
100%{transform:rotate(30deg)}
}
.ring-outer{transform-origin:960px 540px;animation:spinOuter 10s linear infinite}
@keyframes spinOuter{
0%{transform:rotate(0deg)}
100%{transform:rotate(20deg)}
}
.ring-inner{transform-origin:960px 540px;animation:spinInner 10s linear infinite}
@keyframes spinInner{
0%{transform:rotate(0deg)}
100%{transform:rotate(-30deg)}
}
.beat-halo{transform-origin:960px 540px;animation:haloBeat 1s ease-in-out infinite}
@keyframes haloBeat{
0%{transform:scale(.92);opacity:.35}
25%{transform:scale(1.06);opacity:.95}
100%{transform:scale(.92);opacity:.35}
}
.beat-wave{transform-origin:960px 540px;animation:waveBeat 1s ease-in-out infinite}
@keyframes waveBeat{
0%{transform:scale(.88);opacity:0}
15%{transform:scale(1);opacity:.9}
85%{transform:scale(1.24);opacity:.15}
100%{transform:scale(1.3);opacity:0}
}
.num{transform-origin:960px 540px;opacity:0;animation:countTick 10s linear infinite}
.n10{animation-delay:0s}
.n9{animation-delay:-9s}
.n8{animation-delay:-8s}
.n7{animation-delay:-7s}
.n6{animation-delay:-6s}
.n5{animation-delay:-5s}
.n4{animation-delay:-4s}
.n3{animation-delay:-3s}
.n2{animation-delay:-2s}
.n1{animation-delay:-1s}
@keyframes countTick{
0%{opacity:0;transform:scale(.8)}
1.4%{opacity:1;transform:scale(1.08)}
3.4%{opacity:1;transform:scale(1.01)}
8.6%{opacity:1;transform:scale(1)}
9.8%{opacity:0;transform:scale(.92)}
10%{opacity:0;transform:scale(.8)}
100%{opacity:0;transform:scale(.8)}
}
.sheen{animation:sheenSweep 5s ease-in-out infinite}
@keyframes sheenSweep{
0%,15%{transform:translateX(-460px);opacity:0}
35%{opacity:.55}
65%{transform:translateX(460px);opacity:0}
100%{transform:translateX(460px);opacity:0}
}
.fw-a{transform-box:fill-box;transform-origin:center;animation:fireworkBurst 2s ease-in-out infinite}
.fw-b{transform-box:fill-box;transform-origin:center;animation:fireworkBurst 2s ease-in-out infinite;animation-delay:-1s}
.fw-c{transform-box:fill-box;transform-origin:center;animation:fireworkBurst 5s ease-in-out infinite;animation-delay:-1.5s}
.fw-d{transform-box:fill-box;transform-origin:center;animation:fireworkBurst 5s ease-in-out infinite;animation-delay:-4s}
@keyframes fireworkBurst{
0%{transform:scale(.25) rotate(0deg);opacity:0}
25%{transform:scale(.85) rotate(10deg);opacity:1}
75%{transform:scale(1.18) rotate(22deg);opacity:.7}
100%{transform:scale(1.32) rotate(30deg);opacity:0}
}
.spark-a{transform-box:fill-box;transform-origin:center;animation:sparkle 2s ease-in-out infinite}
.spark-b{transform-box:fill-box;transform-origin:center;animation:sparkle 2s ease-in-out infinite;animation-delay:-0.66s}
.spark-c{transform-box:fill-box;transform-origin:center;animation:sparkle 2s ease-in-out infinite;animation-delay:-1.33s}
.spark-d{transform-box:fill-box;transform-origin:center;animation:sparkle 5s ease-in-out infinite;animation-delay:-2.5s}
@keyframes sparkle{
0%,100%{transform:scale(.45) rotate(0deg);opacity:.25}
50%{transform:scale(1.2) rotate(18deg);opacity:1}
}
.bubble{animation:riseUp 5s linear infinite}
.b1{animation-delay:-0.2s}
.b2{animation-delay:-0.9s}
.b3{animation-delay:-1.6s}
.b4{animation-delay:-2.3s}
.b5{animation-delay:-3.1s}
.b6{animation-delay:-3.8s}
.b7{animation-delay:-4.4s}
.b8{animation-delay:-0.6s}
.b9{animation-delay:-1.9s}
.b10{animation-delay:-2.8s}
.b11{animation-delay:-3.5s}
.b12{animation-delay:-4.7s}
@keyframes riseUp{
0%{transform:translateY(0px);opacity:0}
12%{opacity:.65}
85%{opacity:.5}
100%{transform:translateY(-1160px);opacity:0}
}
</style>
