<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosmic Wave-Line Nebula Flowing Astral Contour Grid Seamless Loop</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050E}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
  const canvas=document.getElementById('c');
  const ctx=canvas.getContext('2d');
  const W=1920,H=1080,LOOP=10000,TAU=Math.PI*2;

  function mulberry32(a){
    return function(){
      a|=0;a=a+0x6D2B79F5|0;
      let t=Math.imul(a^a>>>15,1|a);
      t=t+Math.imul(t^t>>>7,61|t)^t;
      return((t^t>>>14)>>>0)/4294967296;
    };
  }
  const rng=mulberry32(948271);

  const driftStars=[];
  for(let i=0;i<150;i++){
    const layer=i<75?0:(i<125?1:2);
    driftStars.push({
      x:rng()*W,
      y:rng()*H,
      r:layer===0?0.7+rng()*0.9:(layer===1?1.1+rng()*1.2:1.6+rng()*1.4),
      dist:layer===0?70+rng()*40:(layer===1?130+rng()*60:210+rng()*80),
      phase:rng(),
      twFreq:layer===0?1:(layer===1?2:3),
      twOff:rng()*TAU,
      tint:rng()>0.35?'#FFFFFF':'#38BDF8',
      flare:layer===2&&rng()>0.55,
      baseAlpha:layer===0?0.35+rng()*0.3:(layer===1?0.5+rng()*0.35:0.7+rng()*0.3)
    });
  }

  const anchorStars=[];
  for(let i=0;i<70;i++){
    anchorStars.push({
      x:rng()*W,
      y:rng()*H,
      r:0.6+rng()*1.5,
      amp:2+rng()*5,
      ang:rng()*TAU,
      twFreq:1+Math.floor(rng()*3),
      twOff:rng()*TAU,
      alpha:0.25+rng()*0.6,
      tint:rng()>0.4?'#FFFFFF':'#7DD3FC',
      flare:rng()>0.86
    });
  }

  const nebulae=[
    {x:380,y:860,rx:520,ry:310,rot:-0.48,c1:'rgba(37,99,235,0.28)',c2:'rgba(56,189,248,0.10)',ph:0.0,ampX:28,ampY:18},
    {x:960,y:540,rx:660,ry:340,rot:-0.48,c1:'rgba(56,189,248,0.22)',c2:'rgba(37,99,235,0.14)',ph:1.8,ampX:34,ampY:22},
    {x:1540,y:240,rx:540,ry:300,rot:-0.48,c1:'rgba(37,99,235,0.26)',c2:'rgba(56,189,248,0.11)',ph:3.6,ampX:26,ampY:16},
    {x:720,y:680,rx:420,ry:210,rot:-0.48,c1:'rgba(56,189,248,0.16)',c2:'rgba(37,99,235,0.06)',ph:5.1,ampX:22,ampY:14},
    {x:1260,y:380,rx:440,ry:220,rot:-0.48,c1:'rgba(96,165,250,0.17)',c2:'rgba(37,99,235,0.07)',ph:2.7,ampX:24,ampY:15}
  ];

  const startX=-260,startY=1220,endX=2180,endY=-140;
  const dx=endX-startX,dy=endY-startY;
  const diagLen=Math.hypot(dx,dy);
  const ux=dx/diagLen,uy=dy/diagLen;
  const nx=-uy,ny=ux;

  const layers=[
    {
      count:18,
      spread:620,
      baseShift:-30,
      widthMin:0.85,
      widthMax:1.25,
      alphaMin:0.10,
      alphaMax:0.24,
      amp1:56,freq1:2.2,
      amp2:28,freq2:4.1,
      amp3:18,freq3:1.4,
      twist:0.22,
      mode:'deep'
    },
    {
      count:26,
      spread:410,
      baseShift:0,
      widthMin:1.15,
      widthMax:1.85,
      alphaMin:0.24,
      alphaMax:0.62,
      amp1:74,freq1:2.6,
      amp2:34,freq2:4.8,
      amp3:20,freq3:1.8,
      twist:0.17,
      mode:'mid'
    },
    {
      count:12,
      spread:250,
      baseShift:12,
      widthMin:1.45,
      widthMax:2.35,
      alphaMin:0.55,
      alphaMax:0.95,
      amp1:82,freq1:2.6,
      amp2:38,freq2:5.2,
      amp3:22,freq3:2.0,
      twist:0.19,
      mode:'fore'
    }
  ];

  function wavePoint(L,i,s,phase){
    const norm=(i/(L.count-1))*2-1;
    const pinch=0.68+0.48*Math.sin(s*Math.PI*1.35+0.4+norm*0.75);
    const baseOff=L.baseShift+norm*(L.spread*0.5)*pinch;
    const w1=Math.sin(s*TAU*L.freq1-phase+norm*1.9)*L.amp1;
    const w2=Math.sin(s*TAU*L.freq2-phase*2+i*L.twist)*L.amp2;
    const w3=Math.cos(s*TAU*L.freq3+phase+norm*2.6)*L.amp3;
    const crest=0.55+0.45*Math.cos(norm*Math.PI*0.85);
    const totalOff=baseOff+(w1+w2+w3)*crest;
    const bx=startX+dx*s;
    const by=startY+dy*s;
    return{x:bx+nx*totalOff,y:by+ny*totalOff,off:totalOff,norm:norm};
  }

  const pulses=[];
  for(let i=0;i<22;i++){
    const layerIdx=i<12?1:2;
    const L=layers[layerIdx];
    pulses.push({
      layerIdx:layerIdx,
      lineIdx:Math.floor(rng()*L.count),
      offset:rng(),
      speed:rng()>0.65?2:1,
      len:0.055+rng()*0.06,
      size:layerIdx===2?3.2+rng()*2.0:2.2+rng()*1.4
    });
  }

  const nodeDefs=[
    {l:2,i:1,s:0.16,r:3.6,ring:true},
    {l:2,i:4,s:0.21,r:2.8,ring:false},
    {l:2,i:8,s:0.25,r:4.2,ring:true},
    {l:1,i:19,s:0.29,r:2.6,ring:false},
    {l:2,i:2,s:0.32,r:3.4,ring:false},
    {l:2,i:6,s:0.37,r:4.6,ring:true},
    {l:2,i:10,s:0.41,r:3.0,ring:false},
    {l:1,i:7,s:0.44,r:2.8,ring:false},
    {l:2,i:3,s:0.48,r:4.0,ring:true},
    {l:2,i:7,s:0.53,r:5.0,ring:true},
    {l:2,i:11,s:0.57,r:3.2,ring:false},
    {l:1,i:22,s:0.60,r:2.7,ring:false},
    {l:2,i:1,s:0.62,r:3.5,ring:false},
    {l:2,i:5,s:0.66,r:4.4,ring:true},
    {l:2,i:9,s:0.71,r:3.6,ring:false},
    {l:1,i:11,s:0.74,r:2.9,ring:false},
    {l:2,i:2,s:0.78,r:3.8,ring:true},
    {l:2,i:6,s:0.82,r:4.1,ring:false},
    {l:2,i:10,s:0.86,r:3.3,ring:true},
    {l:1,i:16,s:0.35,r:2.5,ring:false},
    {l:1,i:15,s:0.51,r:2.8,ring:false},
    {l:1,i:9,s:0.68,r:2.6,ring:false}
  ];
  for(let k=0;k<nodeDefs.length;k++){
    nodeDefs[k].twPhase=rng()*TAU;
    nodeDefs[k].twFreq=1+(k%2);
  }

  const links=[
    [0,1],[1,2],[0,4],[1,4],[2,3],[2,5],[4,5],[5,6],[3,6],[4,7],[7,8],[5,8],
    [5,9],[6,9],[6,10],[8,9],[9,10],[10,11],[8,12],[9,13],[10,13],[12,13],
    [13,14],[11,14],[13,15],[14,15],[12,16],[15,16],[14,17],[16,17],[17,18],
    [14,18],[4,19],[5,19],[8,20],[9,20],[13,21],[14,21]
  ];

  function drawFlare(x,y,len,alpha,color){
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.strokeStyle=color;
    ctx.lineWidth=1.1;
    ctx.beginPath();
    ctx.moveTo(x-len,y);
    ctx.lineTo(x+len,y);
    ctx.moveTo(x,y-len);
    ctx.lineTo(x,y+len);
    ctx.stroke();
    ctx.restore();
  }

  function render(ts){
    const dpr=Math.min(window.devicePixelRatio||1,2);
    const cw=Math.round(window.innerWidth*dpr);
    const ch=Math.round(window.innerHeight*dpr);
    if(canvas.width!==cw||canvas.height!==ch){
      canvas.width=cw;
      canvas.height=ch;
    }

    const scale=Math.max(cw/W,ch/H);
    const ox=(cw-W*scale)*0.5;
    const oy=(ch-H*scale)*0.5;
    ctx.setTransform(scale,0,0,scale,ox,oy);

    const u=(((ts%LOOP)+LOOP)%LOOP)/LOOP;
    const phase=u*TAU;

    const bgGrad=ctx.createRadialGradient(W*0.52,H*0.48,80,W*0.5,H*0.5,W*0.72);
    bgGrad.addColorStop(0,'#06112B');
    bgGrad.addColorStop(0.55,'#03091A');
    bgGrad.addColorStop(1,'#02050E');
    ctx.fillStyle=bgGrad;
    ctx.fillRect(0,0,W,H);

    for(let i=0;i<nebulae.length;i++){
      const n=nebulae[i];
      const breathe=1+0.07*Math.sin(phase+n.ph);
      const nxPos=n.x+Math.cos(phase+n.ph)*n.ampX;
      const nyPos=n.y+Math.sin(phase+n.ph)*n.ampY;
      ctx.save();
      ctx.translate(nxPos,nyPos);
      ctx.rotate(n.rot);
      ctx.scale(n.rx*breathe,n.ry*breathe);
      const ng=ctx.createRadialGradient(0,0,0,0,0,1);
      ng.addColorStop(0,n.c1);
      ng.addColorStop(0.45,n.c2);
      ng.addColorStop(1,'rgba(2,5,14,0)');
      ctx.fillStyle=ng;
      ctx.beginPath();
      ctx.arc(0,0,1,0,TAU);
      ctx.fill();
      ctx.restore();
    }

    for(let i=0;i<anchorStars.length;i++){
      const s=anchorStars[i];
      const sx=s.x+Math.cos(phase+s.ang)*s.amp;
      const sy=s.y+Math.sin(phase+s.ang)*s.amp;
      const tw=0.55+0.45*Math.sin(phase*s.twFreq+s.twOff);
      const al=s.alpha*tw;
      ctx.fillStyle=s.tint;
      ctx.globalAlpha=al;
      ctx.beginPath();
      ctx.arc(sx,sy,s.r,0,TAU);
      ctx.fill();
      if(s.flare){
        drawFlare(sx,sy,s.r*4.2,al*0.7,s.tint);
      }
    }

    for(let i=0;i<driftStars.length;i++){
      const s=driftStars[i];
      const p=(s.phase+u)%1;
      const env=Math.sin(p*Math.PI);
      const sx=s.x+(p-0.5)*s.dist*ux;
      const sy=s.y+(p-0.5)*s.dist*uy;
      const tw=0.65+0.35*Math.sin(phase*s.twFreq+s.twOff);
      const al=s.baseAlpha*env*tw;
      if(al<0.01)continue;
      ctx.fillStyle=s.tint;
      ctx.globalAlpha=al;
      ctx.beginPath();
      ctx.arc(sx,sy,s.r,0,TAU);
      ctx.fill();
      if(s.flare){
        drawFlare(sx,sy,s.r*3.8,al*0.65,'#FFFFFF');
      }
    }
    ctx.globalAlpha=1;

    const steps=96;
    for(let li=0;li<layers.length;li++){
      const L=layers[li];
      for(let i=0;i<L.count;i++){
        const frac=i/(L.count-1);
        const centerWeight=1-Math.abs(frac*2-1);
        const lw=L.widthMin+(L.widthMax-L.widthMin)*Math.pow(centerWeight,0.8);
        const alpha=L.alphaMin+(L.alphaMax-L.alphaMin)*Math.pow(centerWeight,0.9);

        let strokeStyle;
        if(L.mode==='deep'){
          strokeStyle='rgba(37,99,235,'+alpha.toFixed(3)+')';
        }else if(L.mode==='mid'){
          const g=ctx.createLinearGradient(0,H,W,0);
          g.addColorStop(0,'rgba(37,99,235,'+(alpha*0.55).toFixed(3)+')');
          g.addColorStop(0.32,'rgba(37,99,235,'+alpha.toFixed(3)+')');
          g.addColorStop(0.55,'rgba(56,189,248,'+Math.min(1,alpha*1.12).toFixed(3)+')');
          g.addColorStop(0.78,'rgba(37,99,235,'+alpha.toFixed(3)+')');
          g.addColorStop(1,'rgba(37,99,235,'+(alpha*0.45).toFixed(3)+')');
          strokeStyle=g;
        }else{
          const g=ctx.createLinearGradient(0,H,W,0);
          g.addColorStop(0,'rgba(37,99,235,'+(alpha*0.45).toFixed(3)+')');
          g.addColorStop(0.25,'rgba(56,189,248,'+(alpha*0.85).toFixed(3)+')');
          g.addColorStop(0.5,'rgba(224,242,254,'+Math.min(1,alpha).toFixed(3)+')');
          g.addColorStop(0.75,'rgba(56,189,248,'+(alpha*0.85).toFixed(3)+')');
          g.addColorStop(1,'rgba(37,99,235,'+(alpha*0.4).toFixed(3)+')');
          strokeStyle=g;
        }

        ctx.beginPath();
        for(let st=0;st<=steps;st++){
          const s=st/steps;
          const pt=wavePoint(L,i,s,phase);
          if(st===0)ctx.moveTo(pt.x,pt.y);
          else ctx.lineTo(pt.x,pt.y);
        }
        ctx.strokeStyle=strokeStyle;
        ctx.lineWidth=lw;
        ctx.lineCap='round';
        ctx.stroke();

        if(L.mode==='fore'&&centerWeight>0.65){
          ctx.save();
          ctx.strokeStyle='rgba(56,189,248,'+(0.14*centerWeight).toFixed(3)+')';
          ctx.lineWidth=lw*4.2;
          ctx.stroke();
          ctx.restore();
        }
      }
    }

    for(let pi=0;pi<pulses.length;pi++){
      const pl=pulses[pi];
      const L=layers[pl.layerIdx];
      const p=(pl.offset+pl.speed*u)%1;
      const headS=-0.12+p*1.24;
      const tailS=headS-pl.len;
      const segs=16;

      for(let k=0;k<segs;k++){
        const f0=k/segs;
        const f1=(k+1)/segs;
        const s0=tailS+(headS-tailS)*f0;
        const s1=tailS+(headS-tailS)*f1;
        const pt0=wavePoint(L,pl.lineIdx,s0,phase);
        const pt1=wavePoint(L,pl.lineIdx,s1,phase);
        ctx.beginPath();
        ctx.moveTo(pt0.x,pt0.y);
        ctx.lineTo(pt1.x,pt1.y);
        ctx.strokeStyle=f1>0.72?'rgba(255,255,255,'+(f1*0.95).toFixed(3)+')':'rgba(56,189,248,'+(f1*0.85).toFixed(3)+')';
        ctx.lineWidth=pl.size*(0.25+f1*0.85);
        ctx.lineCap='round';
        ctx.stroke();
      }

      const hp=wavePoint(L,pl.lineIdx,headS,phase);
      const hg=ctx.createRadialGradient(hp.x,hp.y,0,hp.x,hp.y,pl.size*5.2);
      hg.addColorStop(0,'rgba(255,255,255,0.95)');
      hg.addColorStop(0.28,'rgba(56,189,248,0.55)');
      hg.addColorStop(1,'rgba(56,189,248,0)');
      ctx.fillStyle=hg;
      ctx.beginPath();
      ctx.arc(hp.x,hp.y,pl.size*5.2,0,TAU);
      ctx.fill();

      ctx.fillStyle='#FFFFFF';
      ctx.beginPath();
      ctx.arc(hp.x,hp.y,pl.size*0.65,0,TAU);
      ctx.fill();
    }

    const nodePts=[];
    for(let k=0;k<nodeDefs.length;k++){
      const nd=nodeDefs[k];
      nodePts.push(wavePoint(layers[nd.l],nd.i,nd.s,phase));
    }

    for(let k=0;k<links.length;k++){
      const a=nodePts[links[k][0]];
      const b=nodePts[links[k][1]];
      const dist=Math.hypot(b.x-a.x,b.y-a.y);
      const fade=Math.max(0,Math.min(1,1-(dist-120)/360));
      const shimmer=0.65+0.35*Math.sin(phase+k*0.7);
      const al=0.34*fade*shimmer;
      if(al<0.02)continue;
      const lg=ctx.createLinearGradient(a.x,a.y,b.x,b.y);
      lg.addColorStop(0,'rgba(56,189,248,'+al.toFixed(3)+')');
      lg.addColorStop(0.5,'rgba(255,255,255,'+(al*1.15).toFixed(3)+')');
      lg.addColorStop(1,'rgba(56,189,248,'+al.toFixed(3)+')');
      ctx.strokeStyle=lg;
      ctx.lineWidth=0.95;
      ctx.beginPath();
      ctx.moveTo(a.x,a.y);
      ctx.lineTo(b.x,b.y);
      ctx.stroke();
    }

    for(let k=0;k<nodeDefs.length;k++){
      const nd=nodeDefs[k];
      const pt=nodePts[k];
      const pulse=0.78+0.22*Math.sin(phase*nd.twFreq+nd.twPhase);
      const haloR=nd.r*5.8*pulse;
      const rg=ctx.createRadialGradient(pt.x,pt.y,0,pt.x,pt.y,haloR);
      rg.addColorStop(0,'rgba(255,255,255,0.9)');
      rg.addColorStop(0.22,'rgba(56,189,248,0.55)');
      rg.addColorStop(0.55,'rgba(37,99,235,0.18)');
      rg.addColorStop(1,'rgba(37,99,235,0)');
      ctx.fillStyle=rg;
      ctx.beginPath();
      ctx.arc(pt.x,pt.y,haloR,0,TAU);
      ctx.fill();

      if(nd.ring){
        ctx.strokeStyle='rgba(56,189,248,'+(0.42*pulse).toFixed(3)+')';
        ctx.lineWidth=1.1;
        ctx.beginPath();
        ctx.arc(pt.x,pt.y,nd.r*2.4+Math.sin(phase+nd.twPhase)*1.4,0,TAU);
        ctx.stroke();
        drawFlare(pt.x,pt.y,nd.r*3.6*pulse,0.75*pulse,'#FFFFFF');
      }

      ctx.fillStyle='#FFFFFF';
      ctx.beginPath();
      ctx.arc(pt.x,pt.y,nd.r*0.75,0,TAU);
      ctx.fill();
    }

    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);
})();
</script>
</body>
</html>
