<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Macro Ice Crystals &amp; Swirling Winter Wind Overlay</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02060F}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const W=1920,H=1080,LOOP=10000,TAU=Math.PI*2;

function mulberry32(a){
return function(){
a|=0;a=a+0x6D2B79F5|0;
let t=Math.imul(a^a>>>15,1|a);
t=t+Math.imul(t^t>>>7,61|t)^t;
return((t^t>>>14)>>>0)/4294967296;
};
}
const rand=mulberry32(9142026);

let cw=W,ch=H;
function resize(){
const dpr=Math.max(window.devicePixelRatio||1,1);
cw=Math.round(window.innerWidth*dpr);
ch=Math.round(window.innerHeight*dpr);
canvas.width=cw;
canvas.height=ch;
}
resize();
window.addEventListener('resize',resize);

const mists=[];
for(let i=0;i<14;i++){
mists.push({
bx:rand()*2600,
by:rand()*1400,
rx:260+rand()*340,
ry:110+rand()*150,
rot:-0.25+rand()*0.2,
wrapX:1,
alpha:0.04+rand()*0.06,
phase:rand()*TAU,
freq:1+Math.floor(rand()*2),
color:i%2===0?'14,165,233':'56,189,248'
});
}

const windRibbons=[];
for(let i=0;i<11;i++){
windRibbons.push({
yBase:80+i*92+(rand()-0.5)*40,
amp:35+rand()*55,
waves:1.5+rand()*1.5,
speedCycles:1+(i%2),
phase:rand()*TAU,
thickness:1.5+rand()*3.5,
glowWidth:16+rand()*26,
alpha:0.08+rand()*0.12,
slope:90+rand()*120,
offsetX:rand()*2800,
length:520+rand()*520,
cyan:i%3!==0
});
}

const dust=[];
for(let i=0;i<340;i++){
const layer=rand();
const fast=layer>0.72;
dust.push({
bx:rand()*2240,
by:rand()*1400,
r:fast?(1.8+rand()*2.6):(0.7+rand()*1.8),
vx:fast?(2+Math.floor(rand()*2)):1,
vy:1,
ampY:18+rand()*52,
ampX:10+rand()*28,
freqY:1+Math.floor(rand()*2),
phase:rand()*TAU,
alpha:fast?(0.45+rand()*0.45):(0.18+rand()*0.42),
twinkleFreq:1+Math.floor(rand()*3),
kind:rand()>0.78?1:0,
hue:rand()>0.35?'255,255,255':(rand()>0.5?'56,189,248':'14,165,233')
});
}

const midFlakes=[];
for(let i=0;i<26;i++){
midFlakes.push({
bx:rand()*2320,
by:rand()*1480,
size:16+rand()*36,
vx:1,
vy:1,
ampY:28+rand()*55,
freqY:1,
phase:rand()*TAU,
rotStart:rand()*TAU,
rotSteps:(rand()>0.5?1:-1)*(1+Math.floor(rand()*2)),
alpha:0.22+rand()*0.38,
variant:i%3
});
}

const macroFlakes=[
{x:115,y:135,size:260,rotStart:0.2,rotDir:1,sway:0.08,dx:18,dy:14,phase:0.3,alpha:0.44,variant:0},
{x:1810,y:155,size:290,rotStart:0.7,rotDir:-1,sway:0.06,dx:22,dy:16,phase:1.9,alpha:0.42,variant:1},
{x:165,y:955,size:310,rotStart:1.1,rotDir:1,sway:0.07,dx:20,dy:18,phase:3.4,alpha:0.46,variant:2},
{x:1780,y:930,size:275,rotStart:0.4,rotDir:-1,sway:0.08,dx:18,dy:15,phase:4.8,alpha:0.44,variant:0},
{x:540,y:-20,size:210,rotStart:0.9,rotDir:1,sway:0.06,dx:24,dy:12,phase:2.5,alpha:0.30,variant:1},
{x:1380,y:1090,size:235,rotStart:1.5,rotDir:-1,sway:0.07,dx:22,dy:14,phase:5.2,alpha:0.32,variant:2},
{x:-30,y:540,size:220,rotStart:0.5,rotDir:1,sway:0.05,dx:16,dy:20,phase:1.1,alpha:0.34,variant:1},
{x:1950,y:560,size:240,rotStart:1.3,rotDir:-1,sway:0.06,dx:16,dy:18,phase:3.9,alpha:0.36,variant:0}
];

const fgDrifters=[
{bx:220,by:260,size:135,vx:1,vy:1,ampY:46,phase:0.6,rotStart:0.3,rotDir:1,alpha:0.34,variant:2},
{bx:1180,by:720,size:155,vx:1,vy:1,ampY:54,phase:2.8,rotStart:1.2,rotDir:-1,alpha:0.30,variant:0},
{bx:1850,by:180,size:115,vx:1,vy:1,ampY:40,phase:4.4,rotStart:0.8,rotDir:1,alpha:0.36,variant:1}
];

const streaks=[];
for(let i=0;i<42;i++){
streaks.push({
bx:rand()*2400,
by:rand()*1360,
len:28+rand()*68,
vx:2+Math.floor(rand()*2),
vy:1,
ampY:24+rand()*40,
phase:rand()*TAU,
alpha:0.12+rand()*0.22,
w:0.8+rand()*1.4
});
}

function drawPolygon(r,sides,rot){
ctx.beginPath();
for(let i=0;i<sides;i++){
const a=rot+i*TAU/sides;
const px=Math.cos(a)*r;
const py=Math.sin(a)*r;
if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
}
ctx.closePath();
}

function drawSnowflake(x,y,size,rot,alpha,variant,isMacro){
ctx.save();
ctx.translate(x,y);
ctx.rotate(rot);
ctx.globalAlpha=alpha;

if(isMacro){
const halo=ctx.createRadialGradient(0,0,size*0.08,0,0,size*1.12);
halo.addColorStop(0,'rgba(56,189,248,0.22)');
halo.addColorStop(0.55,'rgba(14,165,233,0.08)');
halo.addColorStop(1,'rgba(2,6,15,0)');
ctx.fillStyle=halo;
ctx.beginPath();
ctx.arc(0,0,size*1.12,0,TAU);
ctx.fill();
}

const coreGrad=ctx.createRadialGradient(0,0,0,0,0,size);
coreGrad.addColorStop(0,'rgba(255,255,255,0.68)');
coreGrad.addColorStop(0.32,'rgba(56,189,248,0.42)');
coreGrad.addColorStop(0.75,'rgba(14,165,233,0.22)');
coreGrad.addColorStop(1,'rgba(56,189,248,0.06)');

const strokeMain=isMacro?'rgba(255,255,255,0.78)':'rgba(224,242,254,0.85)';
const strokeSub=isMacro?'rgba(56,189,248,0.65)':'rgba(56,189,248,0.55)';
const lw=Math.max(1,size*0.018);

drawPolygon(size*0.26,6,0);
ctx.fillStyle=coreGrad;
ctx.fill();
ctx.strokeStyle=strokeMain;
ctx.lineWidth=lw;
ctx.stroke();

if(isMacro){
drawPolygon(size*0.44,6,Math.PI/6);
ctx.fillStyle='rgba(14,165,233,0.12)';
ctx.fill();
ctx.strokeStyle=strokeSub;
ctx.lineWidth=lw*0.75;
ctx.stroke();
}

for(let i=0;i<6;i++){
ctx.save();
ctx.rotate(i*TAU/6);

ctx.beginPath();
ctx.moveTo(0,0);
ctx.lineTo(size*0.96,0);
ctx.strokeStyle=strokeMain;
ctx.lineWidth=lw*1.25;
ctx.lineCap='round';
ctx.stroke();

ctx.beginPath();
ctx.moveTo(size*0.16,0);
ctx.lineTo(size*0.42,-size*0.065);
ctx.lineTo(size*0.98,0);
ctx.lineTo(size*0.42,size*0.065);
ctx.closePath();
ctx.fillStyle=isMacro?'rgba(56,189,248,0.18)':'rgba(255,255,255,0.22)';
ctx.fill();
if(isMacro){
ctx.strokeStyle='rgba(255,255,255,0.45)';
ctx.lineWidth=lw*0.65;
ctx.stroke();
}

const branches=variant===0?[0.38,0.62,0.82]:(variant===1?[0.34,0.58,0.78]:[0.44,0.68,0.86]);
for(let b=0;b<branches.length;b++){
const pos=size*branches[b];
const len=size*(variant===1?(0.26-b*0.05):(0.22-b*0.045));
const ang=variant===2?0.95:0.82;
const bx=Math.cos(ang)*len;
const by=Math.sin(ang)*len;

ctx.beginPath();
ctx.moveTo(pos+bx,-by);
ctx.lineTo(pos,0);
ctx.lineTo(pos+bx,by);
ctx.strokeStyle=b===branches.length-1?strokeMain:strokeSub;
ctx.lineWidth=lw*(1.05-b*0.15);
ctx.lineCap='round';
ctx.lineJoin='round';
ctx.stroke();

if(isMacro&&b===1){
ctx.beginPath();
ctx.moveTo(pos+bx*0.55,-by*0.55);
ctx.lineTo(pos+bx*0.55+size*0.08,-by*0.55-size*0.04);
ctx.moveTo(pos+bx*0.55,by*0.55);
ctx.lineTo(pos+bx*0.55+size*0.08,by*0.55+size*0.04);
ctx.strokeStyle='rgba(255,255,255,0.55)';
ctx.lineWidth=lw*0.65;
ctx.stroke();
}
}

ctx.beginPath();
ctx.moveTo(size*0.86,0);
ctx.lineTo(size*0.95,-size*0.055);
ctx.lineTo(size*1.04,0);
ctx.lineTo(size*0.95,size*0.055);
ctx.closePath();
ctx.fillStyle='rgba(255,255,255,0.82)';
ctx.fill();

if(variant!==0){
ctx.beginPath();
ctx.moveTo(size*0.32,0);
ctx.lineTo(size*0.26,-size*0.14);
ctx.lineTo(size*0.18,-size*0.10);
ctx.moveTo(size*0.32,0);
ctx.lineTo(size*0.26,size*0.14);
ctx.lineTo(size*0.18,size*0.10);
ctx.strokeStyle='rgba(56,189,248,0.58)';
ctx.lineWidth=lw*0.7;
ctx.stroke();
}

ctx.restore();
}

drawPolygon(size*0.11,6,Math.PI/6);
ctx.fillStyle='rgba(255,255,255,0.9)';
ctx.fill();

ctx.restore();
}

function drawWindRibbon(r,p){
const wrapW=2800;
const headX=((r.offsetX+p*r.speedCycles*wrapW)%wrapW)-440;
const steps=36;
const pts=[];
for(let i=0;i<=steps;i++){
const f=i/steps;
const x=headX-f*r.length;
const waveArg=(x/W)*TAU*r.waves-p*TAU*r.speedCycles+r.phase;
const y=r.yBase+(x/W)*r.slope+Math.sin(waveArg)*r.amp+Math.cos(p*TAU+r.phase)*18;
pts.push([x,y]);
}
const grad=ctx.createLinearGradient(pts[0][0],pts[0][1],pts[steps][0],pts[steps][1]);
const c=r.cyan?'56,189,248':'14,165,233';
grad.addColorStop(0,`rgba(${c},0)`);
grad.addColorStop(0.28,`rgba(255,255,255,${r.alpha*0.85})`);
grad.addColorStop(0.65,`rgba(${c},${r.alpha})`);
grad.addColorStop(1,`rgba(${c},0)`);

ctx.save();
ctx.beginPath();
ctx.moveTo(pts[0][0],pts[0][1]);
for(let i=1;i<=steps;i++)ctx.lineTo(pts[i][0],pts[i][1]);
ctx.strokeStyle=grad;
ctx.lineWidth=r.glowWidth;
ctx.lineCap='round';
ctx.globalAlpha=0.22;
ctx.stroke();

ctx.lineWidth=r.thickness;
ctx.globalAlpha=0.85;
ctx.stroke();
ctx.restore();
}

function render(ts){
const p=(((ts%LOOP)+LOOP)%LOOP)/LOOP;
ctx.setTransform(cw/W,0,0,ch/H,0,0);

const bg=ctx.createRadialGradient(W*0.52,H*0.46,80,W*0.5,H*0.5,W*0.72);
bg.addColorStop(0,'#06152D');
bg.addColorStop(0.45,'#030B1B');
bg.addColorStop(1,'#02060F');
ctx.fillStyle=bg;
ctx.fillRect(0,0,W,H);

ctx.save();
ctx.globalCompositeOperation='screen';

for(let i=0;i<mists.length;i++){
const m=mists[i];
const mx=((m.bx+p*m.wrapX*2600)%2600)-340;
const my=((m.by+p*1400)%1400)-160+Math.sin(p*TAU+m.phase)*42;
const breathe=0.72+0.28*Math.sin(p*TAU*m.freq+m.phase);
ctx.save();
ctx.translate(mx,my);
ctx.rotate(m.rot);
ctx.scale(1,m.ry/m.rx);
const mg=ctx.createRadialGradient(0,0,0,0,0,m.rx);
mg.addColorStop(0,`rgba(${m.color},${m.alpha*breathe})`);
mg.addColorStop(0.55,`rgba(${m.color},${m.alpha*0.35*breathe})`);
mg.addColorStop(1,'rgba(2,6,15,0)');
ctx.fillStyle=mg;
ctx.beginPath();
ctx.arc(0,0,m.rx,0,TAU);
ctx.fill();
ctx.restore();
}

for(let i=0;i<windRibbons.length;i++){
drawWindRibbon(windRibbons[i],p);
}

const gustShift=Math.sin(p*TAU*2)*26;

for(let i=0;i<dust.length;i++){
const d=dust[i];
const x=((d.bx+p*d.vx*2240)%2240)-160+Math.sin(p*TAU+d.phase)*d.ampX+gustShift*0.4;
const y=((d.by+p*d.vy*1400)%1400)-160+Math.sin(p*TAU*d.freqY+d.phase+(x/2240)*TAU)*d.ampY;
if(x<-15||x>W+15||y<-15||y>H+15)continue;
const tw=0.55+0.45*Math.sin(p*TAU*d.twinkleFreq+d.phase);
ctx.fillStyle=`rgba(${d.hue},${d.alpha*tw})`;
if(d.kind===0){
ctx.beginPath();
ctx.arc(x,y,d.r,0,TAU);
ctx.fill();
}else{
ctx.save();
ctx.translate(x,y);
ctx.rotate(Math.PI/4);
const s=d.r*1.5;
ctx.fillRect(-s*0.5,-s*0.5,s,s);
ctx.restore();
}
}

for(let i=0;i<midFlakes.length;i++){
const f=midFlakes[i];
const x=((f.bx+p*f.vx*2320)%2320)-200+gustShift*0.65;
const y=((f.by+p*f.vy*1480)%1480)-200+Math.sin(p*TAU*f.freqY+f.phase+(x/2320)*TAU)*f.ampY;
if(x<-f.size*1.3||x>W+f.size*1.3||y<-f.size*1.3||y>H+f.size*1.3)continue;
const rot=f.rotStart+p*f.rotSteps*(TAU/6);
const op=f.alpha*(0.78+0.22*Math.sin(p*TAU+f.phase));
drawSnowflake(x,y,f.size,rot,op,f.variant,false);
}

for(let i=0;i<streaks.length;i++){
const s=streaks[i];
const x=((s.bx+p*s.vx*2400)%2400)-240+gustShift;
const y=((s.by+p*s.vy*1360)%1360)-140+Math.sin(p*TAU+s.phase+(x/2400)*TAU)*s.ampY;
if(x<-120||x>W+120||y<-60||y>H+60)continue;
const slopeY=s.len*0.26;
const sg=ctx.createLinearGradient(x,y,x-s.len,y-slopeY);
sg.addColorStop(0,'rgba(255,255,255,0)');
sg.addColorStop(0.5,`rgba(56,189,248,${s.alpha})`);
sg.addColorStop(1,'rgba(255,255,255,0)');
ctx.strokeStyle=sg;
ctx.lineWidth=s.w;
ctx.lineCap='round';
ctx.beginPath();
ctx.moveTo(x,y);
ctx.lineTo(x-s.len,y-slopeY);
ctx.stroke();
}

for(let i=0;i<fgDrifters.length;i++){
const f=fgDrifters[i];
const x=((f.bx+p*f.vx*2520)%2520)-300+gustShift*0.8;
const y=((f.by+p*f.vy*1640)%1640)-280+Math.sin(p*TAU+f.phase+(x/2520)*TAU)*f.ampY;
const rot=f.rotStart+p*f.rotDir*(TAU/6);
const op=f.alpha*(0.8+0.2*Math.sin(p*TAU+f.phase));
drawSnowflake(x,y,f.size,rot,op,f.variant,true);
}

for(let i=0;i<macroFlakes.length;i++){
const m=macroFlakes[i];
const mx=m.x+Math.sin(p*TAU+m.phase)*m.dx;
const my=m.y+Math.cos(p*TAU+m.phase)*m.dy;
const rot=m.rotStart+p*m.rotDir*(TAU/6)+Math.sin(p*TAU+m.phase)*m.sway;
const op=m.alpha*(0.76+0.24*Math.sin(p*TAU+m.phase));
drawSnowflake(mx,my,m.size,rot,op,m.variant,true);
}

ctx.restore();
requestAnimationFrame(render);
}
requestAnimationFrame(render);
})();
</script>
</body>
</html>
