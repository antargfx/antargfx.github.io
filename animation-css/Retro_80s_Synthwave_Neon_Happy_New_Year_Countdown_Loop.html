<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retro 80s Synthwave Neon Happy New Year Countdown Loop</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090218}
svg{display:block;width:100%;height:100%}
.grid-h{animation:gridMove 5s linear infinite}
.gh1{animation-delay:0s}
.gh2{animation-delay:-0.5s}
.gh3{animation-delay:-1s}
.gh4{animation-delay:-1.5s}
.gh5{animation-delay:-2s}
.gh6{animation-delay:-2.5s}
.gh7{animation-delay:-3s}
.gh8{animation-delay:-3.5s}
.gh9{animation-delay:-4s}
.gh10{animation-delay:-4.5s}
@keyframes gridMove{
0%{transform:translateY(0px);opacity:0}
10%{transform:translateY(3.8px);opacity:.35}
20%{transform:translateY(8.4px);opacity:.55}
30%{transform:translateY(14.3px);opacity:.72}
40%{transform:translateY(21.8px);opacity:.85}
50%{transform:translateY(31.9px);opacity:.92}
60%{transform:translateY(46.1px);opacity:.96}
70%{transform:translateY(67.6px);opacity:1}
80%{transform:translateY(104.2px);opacity:1}
90%{transform:translateY(180px);opacity:1}
95%{transform:translateY(259.4px);opacity:1}
100%{transform:translateY(430px);opacity:.9}
}
.sun-glow{transform-origin:960px 445px;animation:sunPulse 2s ease-in-out infinite}
@keyframes sunPulse{
0%,100%{transform:scale(1);opacity:.78}
50%{transform:scale(1.06);opacity:1}
}
.sign-glow{animation:signPulse 2s ease-in-out infinite}
@keyframes signPulse{
0%,100%{opacity:.92}
50%{opacity:1}
}
.speed-line-l{animation:speedLeft 2s ease-in-out infinite}
.speed-line-r{animation:speedRight 2s ease-in-out infinite}
@keyframes speedLeft{
0%,100%{transform:translateX(0px);opacity:.75}
50%{transform:translateX(-18px);opacity:1}
}
@keyframes speedRight{
0%,100%{transform:translateX(0px);opacity:.75}
50%{transform:translateX(18px);opacity:1}
}
.beat-ring{transform-origin:960px 540px;animation:ringPulse 1s ease-in-out infinite}
.beat-ring-2{transform-origin:960px 540px;animation:ringPulse2 1s ease-in-out infinite}
@keyframes ringPulse{
0%{transform:scale(.82);opacity:0}
15%{transform:scale(1.02);opacity:.95}
65%{transform:scale(1.22);opacity:.3}
100%{transform:scale(1.36);opacity:0}
}
@keyframes ringPulse2{
0%{transform:scale(.9);opacity:.3}
20%{transform:scale(1.08);opacity:.85}
100%{transform:scale(.9);opacity:.3}
}
.num{transform-origin:960px 540px;opacity:0;animation:countBeat 10s linear infinite}
.n10{animation-delay:0s}
.n9{animation-delay:-9s}
.n8{animation-delay:-8s}
.n7{animation-delay:-7s}
.n6{animation-delay:-6s}
.n5{animation-delay:-5s}
.n4{animation-delay:-4s}
.n3{animation-delay:-3s}
.n2{animation-delay:-2s}
.n1{animation-delay:-1s}
@keyframes countBeat{
0%{opacity:0;transform:scale(.82)}
1.2%{opacity:1;transform:scale(1.1)}
3.2%{opacity:1;transform:scale(1.02)}
8.8%{opacity:1;transform:scale(1)}
9.8%{opacity:0;transform:scale(.92)}
10%{opacity:0;transform:scale(.82)}
100%{opacity:0;transform:scale(.82)}
}
.star-a{transform-box:fill-box;transform-origin:center;animation:twinkle 2s ease-in-out infinite}
.star-b{transform-box:fill-box;transform-origin:center;animation:twinkle 2s ease-in-out infinite;animation-delay:-0.66s}
.star-c{transform-box:fill-box;transform-origin:center;animation:twinkle 2s ease-in-out infinite;animation-delay:-1.33s}
.star-d{transform-box:fill-box;transform-origin:center;animation:twinkle 5s ease-in-out infinite;animation-delay:-2.5s}
@keyframes twinkle{
0%,100%{transform:scale(.55);opacity:.35}
50%{transform:scale(1.25);opacity:1}
}
.tri-a{transform-box:fill-box;transform-origin:center;animation:floatSpinA 5s ease-in-out infinite}
.tri-b{transform-box:fill-box;transform-origin:center;animation:floatSpinB 5s ease-in-out infinite;animation-delay:-1.25s}
.tri-c{transform-box:fill-box;transform-origin:center;animation:floatSpinA 10s ease-in-out infinite;animation-delay:-2.5s}
.tri-d{transform-box:fill-box;transform-origin:center;animation:floatSpinB 10s ease-in-out infinite;animation-delay:-5s}
@keyframes floatSpinA{
0%,100%{transform:translateY(0px) rotate(0deg) scale(1);opacity:.75}
50%{transform:translateY(-14px) rotate(24deg) scale(1.12);opacity:1}
}
@keyframes floatSpinB{
0%,100%{transform:translateY(0px) rotate(0deg) scale(1);opacity:.7}
50%{transform:translateY(14px) rotate(-26deg) scale(1.14);opacity:1}
}
</style>
