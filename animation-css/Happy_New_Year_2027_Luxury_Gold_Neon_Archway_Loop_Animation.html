<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy New Year 2027 Luxury Gold Neon Archway Loop Animation</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0A0C12}
.stage{position:relative;width:100vw;height:100vh;background:#0A0C12;overflow:hidden}
svg.scene,canvas.bokeh{position:absolute;inset:0;width:100%;height:100%;display:block}
canvas.bokeh{pointer-events:none}
.arch-wash{transform-origin:960px 560px;animation:washPulse 10s ease-in-out infinite}
.floor-glow{transform-origin:960px 980px;animation:floorPulse 10s ease-in-out infinite}
.neon-num-aura{animation:goldAura 5s ease-in-out infinite}
.neon-num-tube{animation:goldTube 5s ease-in-out infinite}
.neon-script-aura{animation:whiteAura 5s ease-in-out infinite;animation-delay:-1.25s}
.neon-script-tube{animation:whiteTube 5s ease-in-out infinite;animation-delay:-1.25s}
.bar-aura{animation:barAura 10s ease-in-out infinite}
.bar-aura-alt{animation:barAura 10s ease-in-out infinite;animation-delay:-5s}
.bar-sheen-l{animation:sheenDown 5s linear infinite}
.bar-sheen-r{animation:sheenUp 5s linear infinite}
.arch-rim-glow{animation:rimBreath 10s ease-in-out infinite}
@keyframes washPulse{
  0%,100%{opacity:0.78;transform:scale(1)}
  50%{opacity:1;transform:scale(1.06)}
}
@keyframes floorPulse{
  0%,100%{opacity:0.55;transform:scaleX(0.98)}
  50%{opacity:0.85;transform:scaleX(1.04)}
}
@keyframes goldAura{
  0%,100%{opacity:0.76}
  50%{opacity:1}
}
@keyframes goldTube{
  0%,100%{opacity:0.93}
  50%{opacity:1}
}
@keyframes whiteAura{
  0%,100%{opacity:0.74}
  50%{opacity:1}
}
@keyframes whiteTube{
  0%,100%{opacity:0.94}
  50%{opacity:1}
}
@keyframes barAura{
  0%,100%{opacity:0.65}
  50%{opacity:0.98}
}
@keyframes rimBreath{
  0%,100%{opacity:0.42}
  50%{opacity:0.78}
}
@keyframes sheenDown{
  0%{transform:translateY(-420px);opacity:0}
  15%{opacity:0.85}
  85%{opacity:0.85}
  100%{transform:translateY(520px);opacity:0}
}
@keyframes sheenUp{
  0%{transform:translateY(520px);opacity:0}
  15%{opacity:0.85}
  85%{opacity:0.85}
  100%{transform:translateY(-420px);opacity:0}
}
</style>

<script>
(function(){
  const canvas = document.getElementById('bokehCanvas');
  const ctx = canvas.getContext('2d');
  const W = 1920, H = 1080, LOOP = 10000;
  let seed = 20270101;
  function rand(){
    seed = (seed * 1664525 + 1013904223) >>> 0;
    return seed / 4294967296;
  }
  const colors = [
    [255, 253, 247],
    [255, 232, 168],
    [255, 209, 102],
    [255, 178, 72]
  ];
  const particles = [];
  for(let i = 0; i < 82; i++){
    const isStar = i % 5 === 0;
    const col = colors[Math.floor(rand() * colors.length)];
    const depth = rand();
    particles.push({
      x0: 210 + rand() * 1500,
      y0: rand(),
      r: isStar ? (2.2 + rand() * 3.8) : (2.5 + depth * 11),
      speedY: rand() < 0.65 ? 1 : 2,
      swayAmp: 12 + rand() * 34,
      swayCycles: rand() < 0.5 ? 1 : 2,
      phaseX: rand() * Math.PI * 2,
      twinkleCycles: 1 + Math.floor(rand() * 3),
      phaseT: rand() * Math.PI * 2,
      baseAlpha: isStar ? (0.45 + rand() * 0.45) : (0.14 + (1 - depth) * 0.36),
      col: col,
      isStar: isStar
    });
  }
  function drawStar(x, y, r, alpha, col){
    ctx.save();
    ctx.translate(x, y);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 3.2);
    g.addColorStop(0, `rgba(${col[0]},${col[1]},${col[2]},${alpha})`);
    g.addColorStop(0.35, `rgba(${col[0]},${col[1]},${col[2]},${alpha * 0.45})`);
    g.addColorStop(1, `rgba(${col[0]},${col[1]},${col[2]},0)`);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, r * 3.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = `rgba(255,253,247,${Math.min(1, alpha * 1.15)})`;
    ctx.beginPath();
    const len = r * 2.4, w = r * 0.34;
    ctx.moveTo(0, -len);
    ctx.quadraticCurveTo(0, 0, len, 0);
    ctx.quadraticCurveTo(0, 0, 0, len);
    ctx.quadraticCurveTo(0, 0, -len, 0);
    ctx.quadraticCurveTo(0, 0, 0, -len);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
  function render(ts){
    const p = (((ts % LOOP) + LOOP) % LOOP) / LOOP;
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    for(let i = 0; i < particles.length; i++){
      const pt = particles[i];
      const yn = (((pt.y0 - p * pt.speedY) % 1) + 1) % 1;
      const y = yn * H;
      const x = pt.x0 + Math.sin(p * Math.PI * 2 * pt.swayCycles + pt.phaseX) * pt.swayAmp;
      let edgeFade = 1;
      if(yn < 0.14) edgeFade = yn / 0.14;
      else if(yn > 0.84) edgeFade = (1 - yn) / 0.16;
      const twinkle = 0.55 + 0.45 * Math.sin(p * Math.PI * 2 * pt.twinkleCycles + pt.phaseT);
      const alpha = pt.baseAlpha * edgeFade * twinkle;
      if(alpha <= 0.005) continue;
      if(pt.isStar){
        drawStar(x, y, pt.r, alpha, pt.col);
      } else {
        const g = ctx.createRadialGradient(x, y, 0, x, y, pt.r);
        g.addColorStop(0, `rgba(255,253,247,${alpha * 0.9})`);
        g.addColorStop(0.45, `rgba(${pt.col[0]},${pt.col[1]},${pt.col[2]},${alpha * 0.65})`);
        g.addColorStop(1, `rgba(${pt.col[0]},${pt.col[1]},${pt.col[2]},0)`);
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(x, y, pt.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);
})();
</script>
