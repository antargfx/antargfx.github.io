<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosmic Golden Dust and Bokeh Rings Ambient Loop</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080502}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
  const W = 1920, H = 1080, DUR = 10000, TAU = Math.PI * 2;
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  let seed = 48271;
  function rand(){
    seed = (seed * 16807) % 2147483647;
    return (seed - 1) / 2147483646;
  }

  function resize(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rw = Math.max(1, Math.round(window.innerWidth * dpr));
    const rh = Math.max(1, Math.round(window.innerHeight * dpr));
    if(canvas.width !== rw || canvas.height !== rh){
      canvas.width = rw;
      canvas.height = rh;
    }
  }
  window.addEventListener('resize', resize);
  resize();

  const farBokeh = [];
  for(let i = 0; i < 16; i++){
    farBokeh.push({
      x: rand() * W,
      y: rand() * H,
      r: 85 + rand() * 145,
      ax: 18 + rand() * 34,
      ay: 14 + rand() * 28,
      px: rand() * TAU,
      py: rand() * TAU,
      pr: rand() * TAU,
      alpha: 0.045 + rand() * 0.065,
      hueShift: rand()
    });
  }

  const goldDust = [];
  for(let i = 0; i < 260; i++){
    const sizeTier = rand();
    const r = sizeTier < 0.65 ? (1.1 + rand() * 1.9) : (sizeTier < 0.92 ? (2.8 + rand() * 2.4) : (5.0 + rand() * 3.0));
    goldDust.push({
      x: rand() * W,
      y: rand() * H,
      r: r,
      ax: 10 + rand() * 38,
      ay: 10 + rand() * 32,
      ax2: 4 + rand() * 14,
      ay2: 4 + rand() * 12,
      px: rand() * TAU,
      py: rand() * TAU,
      px2: rand() * TAU,
      py2: rand() * TAU,
      shimmerK: rand() < 0.5 ? 2 : 3,
      shimmerP: rand() * TAU,
      baseAlpha: 0.22 + rand() * 0.55,
      warmth: rand()
    });
  }

  const heroRings = [];
  for(let i = 0; i < 18; i++){
    heroRings.push({
      x: 110 + rand() * (W - 220),
      y: 90 + rand() * (H - 180),
      r: 42 + rand() * 115,
      ax: 16 + rand() * 36,
      ay: 12 + rand() * 30,
      px: rand() * TAU,
      py: rand() * TAU,
      ps: rand() * TAU,
      alpha: 0.07 + rand() * 0.11,
      rimWidth: 0.06 + rand() * 0.07,
      fillAlpha: 0.025 + rand() * 0.045
    });
  }

  const microSparks = [];
  for(let i = 0; i < 72; i++){
    microSparks.push({
      x: 40 + rand() * (W - 80),
      y: 40 + rand() * (H - 80),
      r: 3.5 + rand() * 9.5,
      ax: 8 + rand() * 26,
      ay: 8 + rand() * 22,
      px: rand() * TAU,
      py: rand() * TAU,
      twinkleK: rand() < 0.45 ? 1 : (rand() < 0.75 ? 2 : 3),
      twinkleP: rand() * TAU,
      rotBase: rand() * TAU,
      rotDir: rand() < 0.5 ? 1 : -1,
      baseAlpha: 0.35 + rand() * 0.65
    });
  }

  const pinpoints = [];
  for(let i = 0; i < 90; i++){
    pinpoints.push({
      x: rand() * W,
      y: rand() * H,
      r: 0.7 + rand() * 1.3,
      ax: 6 + rand() * 18,
      ay: 6 + rand() * 16,
      px: rand() * TAU,
      py: rand() * TAU,
      tk: rand() < 0.5 ? 2 : 3,
      tp: rand() * TAU
    });
  }

  function drawBokehRing(x, y, r, alpha, fillAlpha, rimWidth, auraX, auraY, prox){
    const boost = 1 + prox * 0.95;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    const innerStop = Math.max(0.55, 1 - rimWidth * 2.2);
    const rimPeak = Math.max(0.78, 1 - rimWidth * 0.7);
    const fa = Math.min(0.45, fillAlpha * boost);
    const ra = Math.min(0.75, alpha * boost);
    g.addColorStop(0, `rgba(255,214,122,${(fa * 0.45).toFixed(4)})`);
    g.addColorStop(innerStop, `rgba(242,182,78,${(fa * 0.85).toFixed(4)})`);
    g.addColorStop(rimPeak, `rgba(255,228,154,${ra.toFixed(4)})`);
    g.addColorStop(0.96, `rgba(255,204,102,${(ra * 0.55).toFixed(4)})`);
    g.addColorStop(1, 'rgba(214,142,42,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.fill();

    const angle = Math.atan2(auraY - y, auraX - x);
    const hx = x + Math.cos(angle) * (r * 0.88);
    const hy = y + Math.sin(angle) * (r * 0.88);
    const hg = ctx.createRadialGradient(hx, hy, 0, hx, hy, r * 0.55);
    const ha = Math.min(0.5, (0.04 + prox * 0.22) * (alpha / 0.12));
    hg.addColorStop(0, `rgba(255,244,205,${ha.toFixed(4)})`);
    hg.addColorStop(0.5, `rgba(255,212,118,${(ha * 0.35).toFixed(4)})`);
    hg.addColorStop(1, 'rgba(255,190,80,0)');
    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, r * 0.985, 0, TAU);
    ctx.clip();
    ctx.fillStyle = hg;
    ctx.beginPath();
    ctx.arc(hx, hy, r * 0.55, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  function drawDiamondSpark(x, y, size, rot, alpha, warmFactor){
    if(alpha < 0.02) return;
    const haloR = size * 1.45;
    const hg = ctx.createRadialGradient(x, y, 0, x, y, haloR);
    hg.addColorStop(0, `rgba(255,252,240,${(alpha * 0.72).toFixed(4)})`);
    hg.addColorStop(0.32, `rgba(255,232,175,${(alpha * (0.28 + warmFactor * 0.24)).toFixed(4)})`);
    hg.addColorStop(1, 'rgba(255,196,92,0)');
    ctx.fillStyle = hg;
    ctx.beginPath();
    ctx.arc(x, y, haloR, 0, TAU);
    ctx.fill();

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    const outer = size;
    const inner = size * 0.14;
    ctx.beginPath();
    ctx.moveTo(0, -outer);
    ctx.quadraticCurveTo(inner, -inner, outer, 0);
    ctx.quadraticCurveTo(inner, inner, 0, outer);
    ctx.quadraticCurveTo(-inner, inner, -outer, 0);
    ctx.quadraticCurveTo(-inner, -inner, 0, -outer);
    ctx.closePath();
    ctx.fillStyle = `rgba(255,253,248,${Math.min(1, alpha).toFixed(4)})`;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(0, 0, Math.max(0.7, size * 0.18), 0, TAU);
    ctx.fillStyle = `rgba(255,255,255,${Math.min(1, alpha * 1.15).toFixed(4)})`;
    ctx.fill();
    ctx.restore();
  }

  function render(ts){
    const p = (((ts % DUR) + DUR) % DUR) / DUR;
    const t = p * TAU;

    ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
    ctx.globalCompositeOperation = 'source-over';

    const bgGrad = ctx.createRadialGradient(W * 0.5, H * 0.5, 80, W * 0.5, H * 0.5, W * 0.72);
    bgGrad.addColorStop(0, '#1C1107');
    bgGrad.addColorStop(0.45, '#120A04');
    bgGrad.addColorStop(1, '#070402');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    const aura1X = W * 0.5 + Math.sin(t) * 320 + Math.cos(2 * t) * 90;
    const aura1Y = H * 0.5 + Math.cos(t) * 165 + Math.sin(2 * t) * 55;
    const aura1R = 640 + Math.sin(t + 0.7) * 115 + Math.cos(2 * t) * 45;
    const aura1I = 0.24 + 0.07 * Math.sin(t + 0.3) + 0.03 * Math.cos(2 * t);

    const aura2X = W * 0.5 - Math.sin(t + 1.1) * 280 + Math.sin(2 * t) * 75;
    const aura2Y = H * 0.5 + Math.sin(t + 2.2) * 150;
    const aura2R = 520 + Math.cos(t + 1.4) * 95;
    const aura2I = 0.15 + 0.05 * Math.cos(t + 0.9);

    ctx.globalCompositeOperation = 'screen';

    const g1 = ctx.createRadialGradient(aura1X, aura1Y, 0, aura1X, aura1Y, aura1R);
    g1.addColorStop(0, `rgba(255,214,112,${(aura1I * 1.15).toFixed(4)})`);
    g1.addColorStop(0.28, `rgba(226,154,48,${(aura1I * 0.78).toFixed(4)})`);
    g1.addColorStop(0.62, `rgba(136,78,18,${(aura1I * 0.34).toFixed(4)})`);
    g1.addColorStop(1, 'rgba(42,20,5,0)');
    ctx.fillStyle = g1;
    ctx.fillRect(0, 0, W, H);

    const g2 = ctx.createRadialGradient(aura2X, aura2Y, 0, aura2X, aura2Y, aura2R);
    g2.addColorStop(0, `rgba(255,232,158,${(aura2I * 1.05).toFixed(4)})`);
    g2.addColorStop(0.35, `rgba(198,128,36,${(aura2I * 0.6).toFixed(4)})`);
    g2.addColorStop(0.7, `rgba(98,52,12,${(aura2I * 0.22).toFixed(4)})`);
    g2.addColorStop(1, 'rgba(30,14,4,0)');
    ctx.fillStyle = g2;
    ctx.fillRect(0, 0, W, H);

    function auraProx(x, y){
      const dx1 = x - aura1X, dy1 = y - aura1Y;
      const d1 = Math.exp(-(dx1 * dx1 + dy1 * dy1) / (2 * 430 * 430));
      const dx2 = x - aura2X, dy2 = y - aura2Y;
      const d2 = Math.exp(-(dx2 * dx2 + dy2 * dy2) / (2 * 360 * 360));
      return Math.min(1, d1 * 0.9 + d2 * 0.55);
    }

    ctx.globalCompositeOperation = 'lighter';

    for(let i = 0; i < farBokeh.length; i++){
      const b = farBokeh[i];
      const bx = b.x + Math.sin(t + b.px) * b.ax;
      const by = b.y + Math.cos(t + b.py) * b.ay;
      const br = b.r * (0.94 + 0.06 * Math.sin(t + b.pr));
      const prox = auraProx(bx, by);
      const a = b.alpha * (0.65 + 0.85 * prox);
      const fg = ctx.createRadialGradient(bx, by, 0, bx, by, br);
      fg.addColorStop(0, `rgba(245,186,76,${(a * 0.25).toFixed(4)})`);
      fg.addColorStop(0.72, `rgba(255,204,96,${(a * 0.65).toFixed(4)})`);
      fg.addColorStop(0.9, `rgba(255,222,138,${(a * 0.95).toFixed(4)})`);
      fg.addColorStop(1, 'rgba(205,134,36,0)');
      ctx.fillStyle = fg;
      ctx.beginPath();
      ctx.arc(bx, by, br, 0, TAU);
      ctx.fill();
    }

    for(let i = 0; i < goldDust.length; i++){
      const d = goldDust[i];
      const dx = d.x + Math.sin(t + d.px) * d.ax + Math.cos(2 * t + d.px2) * d.ax2;
      const dy = d.y + Math.cos(t + d.py) * d.ay + Math.sin(2 * t + d.py2) * d.ay2;
      const prox = auraProx(dx, dy);
      const shim = 0.55 + 0.45 * Math.sin(d.shimmerK * t + d.shimmerP);
      const alpha = Math.min(0.95, d.baseAlpha * (0.45 + 0.85 * prox) * (0.6 + 0.55 * shim));
      const rr = d.r * (0.88 + 0.24 * shim) * (1 + prox * 0.22);

      const cr = Math.round(215 + 40 * prox);
      const cg = Math.round(148 + 76 * prox + 14 * d.warmth);
      const cb = Math.round(42 + 106 * prox * shim);

      const dg = ctx.createRadialGradient(dx, dy, 0, dx, dy, rr * 2.2);
      dg.addColorStop(0, `rgba(255,246,214,${(alpha * (0.6 + 0.4 * prox)).toFixed(4)})`);
      dg.addColorStop(0.35, `rgba(${cr},${cg},${cb},${(alpha * 0.85).toFixed(4)})`);
      dg.addColorStop(1, `rgba(${cr},${cg},${cb},0)`);
      ctx.fillStyle = dg;
      ctx.beginPath();
      ctx.arc(dx, dy, rr * 2.2, 0, TAU);
      ctx.fill();
    }

    for(let i = 0; i < heroRings.length; i++){
      const h = heroRings[i];
      const hx = h.x + Math.sin(t + h.px) * h.ax;
      const hy = h.y + Math.cos(t + h.py) * h.ay;
      const hr = h.r * (0.95 + 0.05 * Math.sin(t + h.ps));
      const prox = auraProx(hx, hy);
      drawBokehRing(hx, hy, hr, h.alpha, h.fillAlpha, h.rimWidth, aura1X, aura1Y, prox);
    }

    for(let i = 0; i < pinpoints.length; i++){
      const pt = pinpoints[i];
      const px = pt.x + Math.sin(t + pt.px) * pt.ax;
      const py = pt.y + Math.cos(t + pt.py) * pt.ay;
      const prox = auraProx(px, py);
      const tw = Math.pow(0.5 + 0.5 * Math.sin(pt.tk * t + pt.tp), 3);
      const a = (0.18 + 0.78 * tw) * (0.45 + 0.65 * prox);
      ctx.fillStyle = `rgba(255,250,236,${Math.min(1, a).toFixed(4)})`;
      ctx.beginPath();
      ctx.arc(px, py, pt.r * (0.8 + 0.5 * tw), 0, TAU);
      ctx.fill();
    }

    for(let i = 0; i < microSparks.length; i++){
      const s = microSparks[i];
      const sx = s.x + Math.sin(t + s.px) * s.ax;
      const sy = s.y + Math.cos(t + s.py) * s.ay;
      const prox = auraProx(sx, sy);
      const pulse = Math.pow(0.5 + 0.5 * Math.sin(s.twinkleK * t + s.twinkleP), 3.2);
      const alpha = s.baseAlpha * (0.12 + 0.88 * pulse) * (0.55 + 0.65 * prox);
      const sz = s.r * (0.55 + 0.65 * pulse) * (0.9 + 0.25 * prox);
      const rot = s.rotBase + s.rotDir * (Math.sin(t + s.px) * 0.35);
      drawDiamondSpark(sx, sy, sz, rot, alpha, prox);
    }

    ctx.globalCompositeOperation = 'source-over';
    const vig = ctx.createRadialGradient(W * 0.5, H * 0.5, H * 0.28, W * 0.5, H * 0.5, W * 0.68);
    vig.addColorStop(0, 'rgba(8,4,2,0)');
    vig.addColorStop(0.52, 'rgba(10,5,2,0.18)');
    vig.addColorStop(0.78, 'rgba(8,4,1,0.62)');
    vig.addColorStop(1, 'rgba(4,2,1,0.94)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);
  }

  function frame(ts){
    render(ts);
    requestAnimationFrame(frame);
  }
  render(0);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
