<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Champagne Gold Bokeh and Diamond Starburst Sparks Midnight Gala Animation</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0D0703}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
const W=1920,H=1080,LOOP=10000,TAU=Math.PI*2;
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');

function resize(){
const dpr=Math.min(window.devicePixelRatio||1,2);
canvas.width=Math.max(1,Math.round(window.innerWidth*dpr));
canvas.height=Math.max(1,Math.round(window.innerHeight*dpr));
}
resize();
window.addEventListener('resize',resize);

let seed=20260517;
function rand(){
seed|=0;seed=seed+0x6D2B79F5|0;
let t=Math.imul(seed^seed>>>15,1|seed);
t=t+Math.imul(t^t>>>7,61|t)^t;
return((t^t>>>14)>>>0)/4294967296;
}
function range(a,b){return a+(b-a)*rand();}

function makeBokehSprite(stops){
const s=256,half=s/2;
const oc=document.createElement('canvas');
oc.width=s;oc.height=s;
const g=oc.getContext('2d');
const grad=g.createRadialGradient(half,half,0,half,half,half);
for(let i=0;i<stops.length;i++)grad.addColorStop(stops[i][0],stops[i][1]);
g.fillStyle=grad;
g.beginPath();
g.arc(half,half,half,0,TAU);
g.fill();
return oc;
}

const sprites=[
makeBokehSprite([
[0,'rgba(180,83,9,0.55)'],
[0.5,'rgba(180,83,9,0.28)'],
[0.82,'rgba(217,119,6,0.12)'],
[1,'rgba(180,83,9,0)']
]),
makeBokehSprite([
[0,'rgba(251,191,36,0.5)'],
[0.45,'rgba(217,119,6,0.25)'],
[0.82,'rgba(180,83,9,0.08)'],
[1,'rgba(180,83,9,0)']
]),
makeBokehSprite([
[0,'rgba(251,191,36,0.24)'],
[0.62,'rgba(251,191,36,0.32)'],
[0.83,'rgba(254,240,138,0.62)'],
[0.92,'rgba(251,191,36,0.22)'],
[1,'rgba(251,191,36,0)']
]),
makeBokehSprite([
[0,'rgba(180,83,9,0.2)'],
[0.65,'rgba(217,119,6,0.28)'],
[0.84,'rgba(251,191,36,0.52)'],
[0.93,'rgba(180,83,9,0.16)'],
[1,'rgba(180,83,9,0)']
]),
makeBokehSprite([
[0,'rgba(255,255,255,0.62)'],
[0.35,'rgba(254,243,199,0.44)'],
[0.72,'rgba(251,191,36,0.36)'],
[0.88,'rgba(251,191,36,0.18)'],
[1,'rgba(251,191,36,0)']
])
];

const farBokeh=[];
for(let i=0;i<18;i++){
const r=range(115,245);
farBokeh.push({
x0:range(-120,W+120),
y0:range(0,H+520),
pad:260,
wrap:H+520,
r,
sprite:i%2===0?sprites[0]:sprites[1],
alpha:range(0.14,0.28),
swayAmp:range(20,55),
swayFreq:1,
swayPhase:rand(),
breatheFreq:1,
breathePhase:rand(),
breatheScale:range(0.05,0.11),
breatheAlpha:range(0.18,0.32),
loops:1
});
}

const midBokeh=[];
for(let i=0;i<36;i++){
const r=range(34,98);
const spIdx=i%3===0?2:(i%3===1?3:1);
midBokeh.push({
x0:range(-80,W+80),
y0:range(0,H+240),
pad:120,
wrap:H+240,
r,
sprite:sprites[spIdx],
alpha:range(0.18,0.42),
swayAmp:range(18,52),
swayFreq:rand()<0.65?1:2,
swayPhase:rand(),
breatheFreq:rand()<0.6?1:2,
breathePhase:rand(),
breatheScale:range(0.06,0.14),
breatheAlpha:range(0.2,0.38),
loops:1
});
}

const nearBokeh=[];
for(let i=0;i<26;i++){
const r=range(12,32);
nearBokeh.push({
x0:range(-40,W+40),
y0:range(0,H+120),
pad:60,
wrap:H+120,
r,
sprite:i%2===0?sprites[4]:sprites[2],
alpha:range(0.28,0.58),
swayAmp:range(14,40),
swayFreq:rand()<0.5?1:2,
swayPhase:rand(),
breatheFreq:2,
breathePhase:rand(),
breatheScale:range(0.08,0.16),
breatheAlpha:range(0.22,0.42),
loops:1
});
}

const glitters=[];
for(let i=0;i<115;i++){
const isStar=i<30;
glitters.push({
x0:range(20,W-20),
y0:range(0,H+140),
pad:70,
wrap:H+140,
r:isStar?range(2.2,4.2):range(1.1,2.8),
starSize:isStar?range(22,58):range(10,20),
isStar,
hasMiniFlare:!isStar&&i<58,
swayAmp:range(10,36),
swayFreq:rand()<0.5?1:2,
swayPhase:rand(),
cycleFreq:rand()<0.55?5:2,
twinklePhase:rand(),
rotBase:range(-0.18,0.18),
rotAmp:range(0.12,0.35),
loops:isStar?(rand()<0.5?1:2):(rand()<0.65?2:1),
warmth:rand()
});
}

function drawStarburst(x,y,size,alpha,rot,warmth){
if(alpha<=0.01||size<=1)return;
ctx.save();
ctx.translate(x,y);
ctx.rotate(rot);

const haloR=size*1.15;
const hg=ctx.createRadialGradient(0,0,0,0,0,haloR);
hg.addColorStop(0,'rgba(255,255,255,'+(alpha*0.85)+')');
hg.addColorStop(0.22,'rgba(254,240,138,'+(alpha*0.58)+')');
hg.addColorStop(0.55,'rgba(251,191,36,'+(alpha*0.22)+')');
hg.addColorStop(1,'rgba(180,83,9,0)');
ctx.fillStyle=hg;
ctx.beginPath();
ctx.arc(0,0,haloR,0,TAU);
ctx.fill();

const diagLen=size*0.36;
const diagW=size*0.045;
ctx.fillStyle='rgba(254,243,199,'+(alpha*0.55)+')';
ctx.save();
ctx.rotate(Math.PI/4);
ctx.beginPath();
ctx.moveTo(0,-diagLen);
ctx.quadraticCurveTo(diagW,-diagW,diagLen,0);
ctx.quadraticCurveTo(diagW,diagW,0,diagLen);
ctx.quadraticCurveTo(-diagW,diagW,-diagLen,0);
ctx.quadraticCurveTo(-diagW,-diagW,0,-diagLen);
ctx.closePath();
ctx.fill();
ctx.restore();

const outerW=size*0.095;
const sg=ctx.createRadialGradient(0,0,0,0,0,size);
sg.addColorStop(0,'rgba(255,255,255,'+alpha+')');
sg.addColorStop(0.35,warmth>0.5?'rgba(254,249,195,'+(alpha*0.92)+')':'rgba(255,255,255,'+(alpha*0.95)+')');
sg.addColorStop(0.75,'rgba(251,191,36,'+(alpha*0.45)+')');
sg.addColorStop(1,'rgba(251,191,36,0)');
ctx.fillStyle=sg;
ctx.beginPath();
ctx.moveTo(0,-size);
ctx.quadraticCurveTo(outerW,-outerW,size,0);
ctx.quadraticCurveTo(outerW,outerW,0,size);
ctx.quadraticCurveTo(-outerW,outerW,-size,0);
ctx.quadraticCurveTo(-outerW,-outerW,0,-size);
ctx.closePath();
ctx.fill();

const coreS=size*0.42;
const coreW=size*0.042;
ctx.fillStyle='rgba(255,255,255,'+Math.min(1,alpha*1.1)+')';
ctx.beginPath();
ctx.moveTo(0,-coreS);
ctx.quadraticCurveTo(coreW,-coreW,coreS,0);
ctx.quadraticCurveTo(coreW,coreW,0,coreS);
ctx.quadraticCurveTo(-coreW,coreW,-coreS,0);
ctx.quadraticCurveTo(-coreW,-coreW,0,-coreS);
ctx.closePath();
ctx.fill();

ctx.beginPath();
ctx.arc(0,0,Math.max(1.2,size*0.085),0,TAU);
ctx.fill();

ctx.restore();
}

function drawBokehLayer(list,u){
for(let i=0;i<list.length;i++){
const b=list[i];
const y=((b.y0-u*b.wrap*b.loops)%b.wrap+b.wrap)%b.wrap-b.pad;
const x=b.x0+Math.sin(TAU*(b.swayFreq*u+b.swayPhase))*b.swayAmp;
const br=Math.sin(TAU*(b.breatheFreq*u+b.breathePhase));
const r=b.r*(1+br*b.breatheScale);
const a=Math.max(0,b.alpha*(1+br*b.breatheAlpha));
ctx.globalAlpha=a;
ctx.drawImage(b.sprite,x-r,y-r,r*2,r*2);
}
}

function render(ts){
const u=((ts%LOOP)+LOOP)%LOOP/LOOP;
ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);

ctx.globalCompositeOperation='source-over';
ctx.globalAlpha=1;
ctx.fillStyle='#0D0703';
ctx.fillRect(0,0,W,H);

const bgPulse=0.5+0.5*Math.sin(TAU*u);
const g1x=W*0.5+Math.sin(TAU*u)*90;
const g1y=H*0.58+Math.cos(TAU*u)*45;
const bg1=ctx.createRadialGradient(g1x,g1y,40,g1x,g1y,W*0.62);
bg1.addColorStop(0,'rgba(180,83,9,'+(0.22+bgPulse*0.06)+')');
bg1.addColorStop(0.45,'rgba(120,45,6,'+(0.12+bgPulse*0.03)+')');
bg1.addColorStop(1,'rgba(13,7,3,0)');
ctx.fillStyle=bg1;
ctx.fillRect(0,0,W,H);

const g2x=W*0.28+Math.cos(TAU*u)*70;
const g2y=H*0.35+Math.sin(TAU*u)*55;
const bg2=ctx.createRadialGradient(g2x,g2y,10,g2x,g2y,W*0.42);
bg2.addColorStop(0,'rgba(251,191,36,0.08)');
bg2.addColorStop(0.55,'rgba(180,83,9,0.05)');
bg2.addColorStop(1,'rgba(13,7,3,0)');
ctx.fillStyle=bg2;
ctx.fillRect(0,0,W,H);

const g3x=W*0.74-Math.sin(TAU*u)*80;
const g3y=H*0.7-Math.cos(TAU*u)*40;
const bg3=ctx.createRadialGradient(g3x,g3y,10,g3x,g3y,W*0.38);
bg3.addColorStop(0,'rgba(251,191,36,0.09)');
bg3.addColorStop(0.5,'rgba(180,83,9,0.04)');
bg3.addColorStop(1,'rgba(13,7,3,0)');
ctx.fillStyle=bg3;
ctx.fillRect(0,0,W,H);

ctx.globalCompositeOperation='lighter';
drawBokehLayer(farBokeh,u);
drawBokehLayer(midBokeh,u);
drawBokehLayer(nearBokeh,u);

ctx.globalAlpha=1;
for(let i=0;i<glitters.length;i++){
const p=glitters[i];
const y=((p.y0-u*p.wrap*p.loops)%p.wrap+p.wrap)%p.wrap-p.pad;
const x=p.x0+Math.sin(TAU*(p.swayFreq*u+p.swayPhase))*p.swayAmp;
const wave=0.5+0.5*Math.sin(TAU*(p.cycleFreq*u+p.twinklePhase));
const twinkle=Math.pow(wave,2.4);
const baseAlpha=0.14+0.86*twinkle;

const glowR=p.r*4.2;
const pg=ctx.createRadialGradient(x,y,0,x,y,glowR);
pg.addColorStop(0,'rgba(255,255,255,'+(baseAlpha*0.95)+')');
pg.addColorStop(0.32,'rgba(251,191,36,'+(baseAlpha*0.65)+')');
pg.addColorStop(1,'rgba(180,83,9,0)');
ctx.fillStyle=pg;
ctx.beginPath();
ctx.arc(x,y,glowR,0,TAU);
ctx.fill();

ctx.fillStyle='rgba(255,255,255,'+Math.min(1,baseAlpha*1.1)+')';
ctx.beginPath();
ctx.arc(x,y,p.r*(0.65+0.55*twinkle),0,TAU);
ctx.fill();

if(p.isStar){
const flare=Math.pow(wave,5.5);
if(flare>0.03){
const rot=p.rotBase+Math.sin(TAU*(u+p.twinklePhase))*p.rotAmp;
drawStarburst(x,y,p.starSize*(0.35+0.65*flare),Math.min(1,flare*1.25),rot,p.warmth);
}
}else if(p.hasMiniFlare){
const flare=Math.pow(wave,8);
if(flare>0.08){
drawStarburst(x,y,p.starSize*flare,flare*0.85,p.rotBase,p.warmth);
}
}
}

ctx.globalCompositeOperation='source-over';
ctx.globalAlpha=1;
const vig=ctx.createRadialGradient(W*0.5,H*0.5,H*0.28,W*0.5,H*0.5,W*0.64);
vig.addColorStop(0,'rgba(13,7,3,0)');
vig.addColorStop(0.62,'rgba(13,7,3,0.18)');
vig.addColorStop(1,'rgba(13,7,3,0.78)');
ctx.fillStyle=vig;
ctx.fillRect(0,0,W,H);

requestAnimationFrame(render);
}
requestAnimationFrame(render);
})();
</script>
</body>
</html>
