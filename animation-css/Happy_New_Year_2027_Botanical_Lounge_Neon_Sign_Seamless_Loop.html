<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#041512;display:flex;align-items:center;justify-content:center}
svg{width:100%;height:100%;display:block}
.leaf-sway-a{animation:swayA 10s ease-in-out infinite}
.leaf-sway-b{animation:swayB 10s ease-in-out infinite}
.leaf-sway-c{animation:swayC 10s ease-in-out infinite}
.leaf-sway-d{animation:swayD 10s ease-in-out infinite}
.leaf-sway-e{animation:swayE 5s ease-in-out infinite}
.neon-ring-glow{animation:ringPulse 5s ease-in-out infinite}
.neon-pink-glow{animation:pinkPulse 5s ease-in-out infinite;animation-delay:-1.5s}
.neon-mint-glow{animation:mintPulse 5s ease-in-out infinite;animation-delay:-3s}
.wall-aura{animation:auraPulse 10s ease-in-out infinite}
.ff1{animation:drift1 10s ease-in-out infinite}
.ff2{animation:drift2 10s ease-in-out infinite}
.ff3{animation:drift3 10s ease-in-out infinite}
.ff4{animation:drift4 10s ease-in-out infinite}
.ff5{animation:drift5 5s ease-in-out infinite}
.twinkle-a{animation:twinkleA 5s ease-in-out infinite}
.twinkle-b{animation:twinkleB 10s ease-in-out infinite}
@keyframes swayA{
0%,100%{transform:rotate(0deg)}
50%{transform:rotate(3.2deg)}
}
@keyframes swayB{
0%,100%{transform:rotate(0deg)}
50%{transform:rotate(-3.6deg)}
}
@keyframes swayC{
0%,100%{transform:rotate(0deg)}
35%{transform:rotate(2.4deg)}
70%{transform:rotate(-1.8deg)}
}
@keyframes swayD{
0%,100%{transform:rotate(0deg)}
40%{transform:rotate(-2.8deg)}
75%{transform:rotate(1.6deg)}
}
@keyframes swayE{
0%,100%{transform:rotate(0deg)}
50%{transform:rotate(1.8deg)}
}
@keyframes ringPulse{
0%,100%{opacity:0.92}
50%{opacity:1}
}
@keyframes pinkPulse{
0%,100%{opacity:0.88}
50%{opacity:1}
}
@keyframes mintPulse{
0%,100%{opacity:0.9}
50%{opacity:1}
}
@keyframes auraPulse{
0%,100%{opacity:0.78;transform:scale(1)}
50%{opacity:1;transform:scale(1.03)}
}
@keyframes drift1{
0%,100%{transform:translate(0px,0px)}
25%{transform:translate(18px,-22px)}
50%{transform:translate(34px,-6px)}
75%{transform:translate(12px,16px)}
}
@keyframes drift2{
0%,100%{transform:translate(0px,0px)}
25%{transform:translate(-22px,-16px)}
50%{transform:translate(-10px,-34px)}
75%{transform:translate(14px,-14px)}
}
@keyframes drift3{
0%,100%{transform:translate(0px,0px)}
33%{transform:translate(24px,18px)}
66%{transform:translate(-14px,28px)}
}
@keyframes drift4{
0%,100%{transform:translate(0px,0px)}
30%{transform:translate(-26px,14px)}
65%{transform:translate(-8px,-22px)}
}
@keyframes drift5{
0%,100%{transform:translate(0px,0px)}
50%{transform:translate(12px,-18px)}
}
@keyframes twinkleA{
0%,100%{opacity:0.25}
50%{opacity:1}
}
@keyframes twinkleB{
0%,100%{opacity:0.3}
25%{opacity:0.95}
55%{opacity:0.2}
80%{opacity:0.85}
}
</style>
