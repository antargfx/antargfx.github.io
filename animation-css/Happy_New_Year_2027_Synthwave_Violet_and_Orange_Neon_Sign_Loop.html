<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy New Year 2027 Synthwave Violet and Orange Neon Sign Loop</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080514}
svg{display:block;width:100%;height:100%}
.aura-violet{animation:pulseA 5s ease-in-out infinite}
.aura-orange{animation:pulseB 5s ease-in-out infinite;animation-delay:-2.5s}
.halo-outer{animation:tubeGlow 5s ease-in-out infinite}
.halo-inner{animation:tubeFlickerA 5s linear infinite}
.bars-wave{animation:barsPulse 2s ease-in-out infinite}
.title-orange{animation:tubeFlickerB 5s linear infinite}
.n-2a{animation:tubeGlow 5s ease-in-out infinite}
.n-0{animation:flickerShort 2s linear infinite}
.n-2b{animation:tubeGlow 5s ease-in-out infinite;animation-delay:-1.8s}
.n-7{animation:tubeFlickerC 5s linear infinite}
.spark-a{animation:floatUpA 10s linear infinite}
.spark-b{animation:floatUpB 10s linear infinite}
.spark-c{animation:floatUpC 5s linear infinite}
@keyframes pulseA{
  0%,100%{opacity:.74}
  50%{opacity:1}
}
@keyframes pulseB{
  0%,100%{opacity:.7}
  50%{opacity:.96}
}
@keyframes tubeGlow{
  0%,100%{opacity:.92}
  50%{opacity:1}
}
@keyframes barsPulse{
  0%,100%{opacity:.68}
  50%{opacity:1}
}
@keyframes tubeFlickerA{
  0%,100%{opacity:1}
  54%{opacity:.97}
  55.5%{opacity:.82}
  57%{opacity:1}
}
@keyframes tubeFlickerB{
  0%,100%{opacity:1}
  26%{opacity:.96}
  27%{opacity:.74}
  28.5%{opacity:1}
  71%{opacity:.96}
  72.5%{opacity:.78}
  74%{opacity:1}
}
@keyframes flickerShort{
  0%,100%{opacity:1}
  40%{opacity:1}
  43%{opacity:.82}
  46%{opacity:1}
}
@keyframes tubeFlickerC{
  0%,100%{opacity:1}
  18%{opacity:1}
  19.5%{opacity:.68}
  21%{opacity:1}
  22.5%{opacity:.8}
  24%{opacity:1}
}
@keyframes floatUpA{
  0%{transform:translate(0px,150px);opacity:0}
  16%{opacity:.85}
  50%{transform:translate(20px,-80px);opacity:.65}
  84%{opacity:.75}
  100%{transform:translate(0px,-310px);opacity:0}
}
@keyframes floatUpB{
  0%{transform:translate(0px,170px);opacity:0}
  18%{opacity:.75}
  50%{transform:translate(-18px,-90px);opacity:.9}
  82%{opacity:.6}
  100%{transform:translate(0px,-340px);opacity:0}
}
@keyframes floatUpC{
  0%{transform:translate(0px,95px);opacity:0}
  20%{opacity:.7}
  50%{transform:translate(12px,-45px);opacity:.85}
  80%{opacity:.55}
  100%{transform:translate(0px,-190px);opacity:0}
}
</style>
</head>
