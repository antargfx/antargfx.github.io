<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy New Year 2027 Circular Neon Halo Sign Architectural Wall Loop</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060913}
svg{display:block;width:100%;height:100%}
.ambient-cyan{animation:breathCyan 5s ease-in-out infinite}
.ambient-magenta{animation:breathMagenta 5s ease-in-out infinite;animation-delay:-2.5s}
.orbit-ring{transform-origin:960px 540px;animation:spinHalo 10s linear infinite}
.orbit-ring-rev{transform-origin:960px 540px;animation:spinHaloRev 10s linear infinite}
.ring-cyan{animation:ringPulse 5s ease-in-out infinite}
.ring-magenta{animation:magentaFlicker 5s linear infinite}
.title-neon{animation:titleFlicker 5s linear infinite}
.num-2a{animation:tubeSteady 5s ease-in-out infinite}
.num-0{animation:flickerA 2s linear infinite}
.num-2b{animation:tubeSteady 5s ease-in-out infinite;animation-delay:-1.8s}
.num-7{animation:flickerB 5s linear infinite}
.spark-a{transform-origin:960px 232px;animation:sparkPulse 2s ease-in-out infinite}
.spark-b{transform-origin:960px 842px;animation:sparkPulse 2s ease-in-out infinite;animation-delay:-1s}
.dust-a{animation:driftA 10s linear infinite}
.dust-b{animation:driftB 10s linear infinite}
.dust-c{animation:driftC 5s linear infinite}
@keyframes breathCyan{
  0%,100%{opacity:.74}
  50%{opacity:1}
}
@keyframes breathMagenta{
  0%,100%{opacity:.68}
  50%{opacity:.96}
}
@keyframes spinHalo{
  0%{transform:rotate(0deg)}
  100%{transform:rotate(360deg)}
}
@keyframes spinHaloRev{
  0%{transform:rotate(360deg)}
  100%{transform:rotate(0deg)}
}
@keyframes ringPulse{
  0%,100%{opacity:.93}
  50%{opacity:1}
}
@keyframes magentaFlicker{
  0%,100%{opacity:.94}
  44%{opacity:1}
  45.5%{opacity:.82}
  47%{opacity:1}
  80%{opacity:.96}
  81.5%{opacity:.86}
  83%{opacity:1}
}
@keyframes titleFlicker{
  0%,100%{opacity:1}
  19%{opacity:.96}
  20%{opacity:.74}
  21.5%{opacity:1}
  68%{opacity:.98}
  69%{opacity:.78}
  70.2%{opacity:.95}
  71.2%{opacity:.75}
  72.8%{opacity:1}
}
@keyframes tubeSteady{
  0%,100%{opacity:.92}
  50%{opacity:1}
}
@keyframes flickerA{
  0%,100%{opacity:1}
  48%{opacity:1}
  50%{opacity:.82}
  52%{opacity:1}
  86%{opacity:.97}
  88%{opacity:.86}
  90%{opacity:1}
}
@keyframes flickerB{
  0%,100%{opacity:1}
  26%{opacity:1}
  27.2%{opacity:.66}
  28.6%{opacity:1}
  29.8%{opacity:.78}
  31.2%{opacity:1}
  72%{opacity:.96}
  74%{opacity:.84}
  76%{opacity:1}
}
@keyframes sparkPulse{
  0%,100%{opacity:.65;transform:scale(0.86)}
  50%{opacity:1;transform:scale(1.16)}
}
@keyframes driftA{
  0%{transform:translate(0px,140px);opacity:0}
  16%{opacity:.82}
  50%{transform:translate(16px,-80px);opacity:.66}
  84%{opacity:.72}
  100%{transform:translate(0px,-300px);opacity:0}
}
@keyframes driftB{
  0%{transform:translate(0px,160px);opacity:0}
  18%{opacity:.7}
  50%{transform:translate(-20px,-90px);opacity:.88}
  82%{opacity:.6}
  100%{transform:translate(0px,-340px);opacity:0}
}
@keyframes driftC{
  0%{transform:translate(0px,90px);opacity:0}
  20%{opacity:.64}
  50%{transform:translate(12px,-45px);opacity:.84}
  80%{opacity:.54}
  100%{transform:translate(0px,-180px);opacity:0}
}
</style>
</head>
