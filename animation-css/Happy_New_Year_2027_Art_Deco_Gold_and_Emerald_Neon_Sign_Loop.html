<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy New Year 2027 Art Deco Gold and Emerald Neon Sign Loop</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a0e}
svg{display:block;width:100%;height:100%}
.glow-gold{animation:breathA 5s ease-in-out infinite}
.glow-emerald{animation:breathB 5s ease-in-out infinite;animation-delay:-2.5s}
.frame-outer{animation:steadyGlow 5s ease-in-out infinite}
.frame-inner{animation:softFlicker 5s linear infinite}
.rays-pulse{animation:rayBreath 2s ease-in-out infinite}
.text-emerald{animation:flickerFast 5s linear infinite}
.d-2a{animation:steadyGlow 5s ease-in-out infinite}
.d-0{animation:flickerTwo 2s linear infinite}
.d-2b{animation:steadyGlow 5s ease-in-out infinite;animation-delay:-2s}
.d-7{animation:flickerFive 5s linear infinite}
.mote-a{animation:riseA 10s linear infinite}
.mote-b{animation:riseB 10s linear infinite}
.mote-c{animation:riseC 5s linear infinite}
@keyframes breathA{
  0%,100%{opacity:.76}
  50%{opacity:1}
}
@keyframes breathB{
  0%,100%{opacity:.7}
  50%{opacity:.98}
}
@keyframes steadyGlow{
  0%,100%{opacity:.93}
  50%{opacity:1}
}
@keyframes rayBreath{
  0%,100%{opacity:.62}
  50%{opacity:1}
}
@keyframes softFlicker{
  0%,100%{opacity:1}
  38%{opacity:.96}
  39.5%{opacity:.8}
  41%{opacity:1}
  82%{opacity:.95}
  83.5%{opacity:.86}
  85%{opacity:1}
}
@keyframes flickerFast{
  0%,100%{opacity:1}
  22%{opacity:.97}
  23%{opacity:.75}
  24.5%{opacity:1}
  67%{opacity:.95}
  68%{opacity:.78}
  69%{opacity:.98}
  70%{opacity:.82}
  71.5%{opacity:1}
}
@keyframes flickerTwo{
  0%,100%{opacity:1}
  44%{opacity:1}
  47%{opacity:.84}
  50%{opacity:1}
  85%{opacity:.96}
  88%{opacity:.88}
  91%{opacity:1}
}
@keyframes flickerFive{
  0%,100%{opacity:1}
  30%{opacity:1}
  31%{opacity:.68}
  32.5%{opacity:1}
  34%{opacity:.8}
  35.5%{opacity:1}
}
@keyframes riseA{
  0%{transform:translate(0px,150px);opacity:0}
  15%{opacity:.85}
  50%{transform:translate(16px,-75px);opacity:.7}
  85%{opacity:.75}
  100%{transform:translate(0px,-300px);opacity:0}
}
@keyframes riseB{
  0%{transform:translate(0px,170px);opacity:0}
  18%{opacity:.75}
  50%{transform:translate(-20px,-85px);opacity:.9}
  82%{opacity:.65}
  100%{transform:translate(0px,-340px);opacity:0}
}
@keyframes riseC{
  0%{transform:translate(0px,95px);opacity:0}
  20%{opacity:.7}
  50%{transform:translate(10px,-45px);opacity:.85}
  80%{opacity:.55}
  100%{transform:translate(0px,-185px);opacity:0}
}
</style>
</head>

  <filter id="gGold" x="-30%" y="-30%" width="160%" height="160%">

  <polygon id="outerFrame" points="290,116 1630,116 1630,166 1690,166 1690,914 1630,914 1630,964 290,964 290,914 230,914 230,166 290,166"/>
  <polygon id="innerFrame" points="316,144 1604,144 1604,192 1662,192 1662,888 1604,888 1604,936 316,936 316,888 258,888 258,192 316,192"/>
