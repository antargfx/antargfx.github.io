<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interstellar Warp-Line Tunnel - Hyper-Space Blue Vector Vortex Seamless Loop</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020611}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const W=1920,H=1080,CX=960,CY=540,DURATION=10000;
let seed=918273645;
function rand(){
seed=(seed*1664525+1013904223)>>>0;
return seed/4294967296;
}
function resize(){
const dpr=Math.max(1,window.devicePixelRatio||1);
const rw=Math.round(window.innerWidth*dpr);
const rh=Math.round(window.innerHeight*dpr);
if(canvas.width!==rw||canvas.height!==rh){
canvas.width=rw;
canvas.height=rh;
}
}
window.addEventListener('resize',resize);
resize();
const outerStreaks=[];
for(let i=0;i<140;i++){
const baseAngle=(i/140)*Math.PI*2+(rand()-0.5)*0.025;
outerStreaks.push({
angle:baseAngle,
phase:rand(),
cycles:1+Math.floor(rand()*2),
len:0.14+rand()*0.18,
width:1.6+rand()*3.4,
alpha:0.45+rand()*0.45,
color:rand()>0.4?'#0369A1':'#0284C7'
});
}
const cyanStreaks=[];
for(let i=0;i<150;i++){
const sym=i%2===0?0:Math.PI;
const halfIdx=Math.floor(i/2);
const angle=sym+(halfIdx/75)*Math.PI+(rand()-0.5)*0.02;
cyanStreaks.push({
angle:angle,
phase:rand(),
cycles:2+Math.floor(rand()*3),
len:0.12+rand()*0.16,
width:1.1+rand()*2.4,
alpha:0.55+rand()*0.45,
bright:rand()>0.45
});
}
const coreStreaks=[];
for(let i=0;i<64;i++){
const angle=(i/64)*Math.PI*2+(rand()-0.5)*0.015;
coreStreaks.push({
angle:angle,
phase:rand(),
cycles:3+Math.floor(rand()*3),
len:0.08+rand()*0.12,
width:0.8+rand()*1.4,
alpha:0.65+rand()*0.35
});
}
const rings=[];
const RING_COUNT=18;
for(let i=0;i<RING_COUNT;i++){
const segs=i%3===0?12:(i%3===1?18:24);
rings.push({
phase:i/RING_COUNT,
segs:segs,
gapRatio:i%2===0?0.34:0.22,
dir:i%2===0?1:-1,
rotSteps:i%3===0?2:1,
weight:i%3===0?2.4:1.3,
accent:i%3===0
});
}
const starRings=[];
const STAR_RING_COUNT=12;
for(let i=0;i<STAR_RING_COUNT;i++){
starRings.push({
phase:(i+0.5)/STAR_RING_COUNT,
count:i%2===0?18:24,
dir:i%2===0?1:-1
});
}
function drawDiamond(x,y,s){
ctx.beginPath();
ctx.moveTo(x,y-s);
ctx.lineTo(x+s*0.65,y);
ctx.lineTo(x,y+s);
ctx.lineTo(x-s*0.65,y);
ctx.closePath();
ctx.fill();
}
function drawFrame(ts){
resize();
const t=(((ts%DURATION)+DURATION)%DURATION)/DURATION;
const tau=Math.PI*2;
const pulse1=0.5+0.5*Math.sin(t*tau*2);
const pulse2=0.5+0.5*Math.sin(t*tau*4);
ctx.save();
ctx.scale(canvas.width/W,canvas.height/H);
ctx.globalCompositeOperation='source-over';
const bgGrad=ctx.createRadialGradient(CX,CY,10,CX,CY,1150);
bgGrad.addColorStop(0,'#06254A');
bgGrad.addColorStop(0.28,'#03122C');
bgGrad.addColorStop(0.68,'#020817');
bgGrad.addColorStop(1,'#020611');
ctx.fillStyle=bgGrad;
ctx.fillRect(0,0,W,H);
const spokeCount=36;
const spokeRot=t*(tau/spokeCount);
ctx.lineCap='round';
for(let i=0;i<spokeCount;i++){
const a=spokeRot+(i/spokeCount)*tau;
const cos=Math.cos(a),sin=Math.sin(a);
const major=i%3===0;
const r0=22;
const r1=1180;
const g=ctx.createLinearGradient(CX+cos*r0,CY+sin*r0,CX+cos*r1,CY+sin*r1);
g.addColorStop(0,'rgba(0,245,255,0)');
g.addColorStop(0.12,major?'rgba(0,245,255,0.22)':'rgba(3,105,161,0.16)');
g.addColorStop(0.55,major?'rgba(3,105,161,0.18)':'rgba(3,105,161,0.08)');
g.addColorStop(1,'rgba(2,6,17,0)');
ctx.strokeStyle=g;
ctx.lineWidth=major?1.5:0.85;
ctx.beginPath();
ctx.moveTo(CX+cos*r0,CY+sin*r0);
ctx.lineTo(CX+cos*r1,CY+sin*r1);
ctx.stroke();
}
ctx.globalCompositeOperation='lighter';
for(let i=0;i<rings.length;i++){
const rg=rings[i];
const p=(rg.phase+t*2)%1;
const r=Math.pow(p,2.55)*1260;
if(r<8)continue;
const fadeIn=Math.min(1,p*7);
const fadeOut=Math.min(1,(1-p)*4.5);
const alpha=fadeIn*fadeOut*(rg.accent?0.58:0.32);
const segAngle=tau/rg.segs;
const rot=rg.dir*t*segAngle*rg.rotSteps;
const arcSpan=segAngle*(1-rg.gapRatio);
const lw=rg.weight*(0.35+p*1.65);
ctx.strokeStyle=rg.accent?`rgba(0,245,255,${alpha.toFixed(4)})`:`rgba(3,105,161,${(alpha*1.35).toFixed(4)})`;
ctx.lineWidth=lw;
for(let s=0;s<rg.segs;s++){
const a0=rot+s*segAngle;
ctx.beginPath();
ctx.arc(CX,CY,r,a0,a0+arcSpan);
ctx.stroke();
}
if(rg.accent&&r>35){
ctx.strokeStyle=`rgba(255,255,255,${(alpha*0.35).toFixed(4)})`;
ctx.lineWidth=lw*0.42;
for(let s=0;s<rg.segs;s++){
const a0=rot+s*segAngle+arcSpan*0.18;
ctx.beginPath();
ctx.arc(CX,CY,r,a0,a0+arcSpan*0.64);
ctx.stroke();
}
}
}
for(let i=0;i<starRings.length;i++){
const sr=starRings[i];
const p=(sr.phase+t*2)%1;
const r=Math.pow(p,2.6)*1240;
if(r<18)continue;
const fadeIn=Math.min(1,p*8);
const fadeOut=Math.min(1,(1-p)*5);
const alpha=fadeIn*fadeOut*0.75;
const step=tau/sr.count;
const rot=sr.dir*t*step;
const size=1.2+p*4.8;
ctx.fillStyle=`rgba(0,245,255,${(alpha*0.85).toFixed(4)})`;
for(let k=0;k<sr.count;k++){
const a=rot+k*step;
const x=CX+Math.cos(a)*r;
const y=CY+Math.sin(a)*r;
drawDiamond(x,y,size);
}
ctx.fillStyle=`rgba(255,255,255,${(alpha*0.7).toFixed(4)})`;
for(let k=0;k<sr.count;k+=2){
const a=rot+k*step;
const x=CX+Math.cos(a)*r;
const y=CY+Math.sin(a)*r;
drawDiamond(x,y,size*0.48);
}
}
for(let i=0;i<outerStreaks.length;i++){
const st=outerStreaks[i];
const p=(st.phase+t*st.cycles)%1;
const uHead=p*(1+st.len);
const uTail=uHead-st.len;
const rHead=Math.pow(Math.max(0,uHead),2.7)*1320;
const rTail=Math.pow(Math.max(0,uTail),2.7)*1320;
if(rHead-rTail<2||rTail>1180)continue;
const fadeIn=Math.min(1,p*10);
const fadeOut=Math.min(1,(1-p)*8);
const alpha=fadeIn*fadeOut*st.alpha;
const cos=Math.cos(st.angle),sin=Math.sin(st.angle);
const px=-sin,py=cos;
const wHead=st.width*(0.25+Math.min(1.3,uHead)*1.25);
const wTail=wHead*0.18;
const x0=CX+cos*rTail,y0=CY+sin*rTail;
const x1=CX+cos*rHead,y1=CY+sin*rHead;
const g=ctx.createLinearGradient(x0,y0,x1,y1);
g.addColorStop(0,'rgba(3,105,161,0)');
g.addColorStop(0.55,st.color==='#0369A1'?`rgba(3,105,161,${(alpha*0.85).toFixed(4)})`:`rgba(2,132,199,${(alpha*0.9).toFixed(4)})`);
g.addColorStop(1,`rgba(0,245,255,${(alpha*0.65).toFixed(4)})`);
ctx.fillStyle=g;
ctx.beginPath();
ctx.moveTo(x0+px*wTail,y0+py*wTail);
ctx.lineTo(x1+px*wHead,y1+py*wHead);
ctx.lineTo(x1-px*wHead,y1-py*wHead);
ctx.lineTo(x0-px*wTail,y0-py*wTail);
ctx.closePath();
ctx.fill();
}
for(let i=0;i<cyanStreaks.length;i++){
const st=cyanStreaks[i];
const p=(st.phase+t*st.cycles)%1;
const uHead=p*(1+st.len);
const uTail=uHead-st.len;
const rHead=Math.pow(Math.max(0,uHead),2.75)*1340;
const rTail=Math.pow(Math.max(0,uTail),2.75)*1340;
if(rHead-rTail<2||rTail>1180)continue;
const fadeIn=Math.min(1,p*11);
const fadeOut=Math.min(1,(1-p)*8);
const alpha=fadeIn*fadeOut*st.alpha;
const cos=Math.cos(st.angle),sin=Math.sin(st.angle);
const px=-sin,py=cos;
const wHead=st.width*(0.2+Math.min(1.25,uHead)*1.15);
const wTail=wHead*0.12;
const x0=CX+cos*rTail,y0=CY+sin*rTail;
const x1=CX+cos*rHead,y1=CY+sin*rHead;
const g=ctx.createLinearGradient(x0,y0,x1,y1);
g.addColorStop(0,'rgba(0,245,255,0)');
g.addColorStop(0.45,`rgba(0,245,255,${(alpha*0.85).toFixed(4)})`);
g.addColorStop(0.88,st.bright?`rgba(220,253,255,${alpha.toFixed(4)})`:`rgba(0,245,255,${alpha.toFixed(4)})`);
g.addColorStop(1,`rgba(255,255,255,${(alpha*0.95).toFixed(4)})`);
ctx.fillStyle=g;
ctx.beginPath();
ctx.moveTo(x0+px*wTail,y0+py*wTail);
ctx.lineTo(x1+px*wHead,y1+py*wHead);
ctx.lineTo(x1-px*wHead,y1-py*wHead);
ctx.lineTo(x0-px*wTail,y0-py*wTail);
ctx.closePath();
ctx.fill();
}
for(let i=0;i<coreStreaks.length;i++){
const st=coreStreaks[i];
const p=(st.phase+t*st.cycles)%1;
const uHead=p*(1+st.len);
const uTail=uHead-st.len;
const rHead=Math.pow(Math.max(0,uHead),2.85)*1280;
const rTail=Math.pow(Math.max(0,uTail),2.85)*1280;
if(rHead-rTail<2||rTail>1180)continue;
const fadeIn=Math.min(1,p*12);
const fadeOut=Math.min(1,(1-p)*8);
const alpha=fadeIn*fadeOut*st.alpha;
const cos=Math.cos(st.angle),sin=Math.sin(st.angle);
const px=-sin,py=cos;
const wHead=st.width*(0.2+Math.min(1.2,uHead)*0.95);
const wTail=wHead*0.1;
const x0=CX+cos*rTail,y0=CY+sin*rTail;
const x1=CX+cos*rHead,y1=CY+sin*rHead;
const g=ctx.createLinearGradient(x0,y0,x1,y1);
g.addColorStop(0,'rgba(0,245,255,0)');
g.addColorStop(0.5,`rgba(165,250,255,${(alpha*0.75).toFixed(4)})`);
g.addColorStop(1,`rgba(255,255,255,${alpha.toFixed(4)})`);
ctx.fillStyle=g;
ctx.beginPath();
ctx.moveTo(x0+px*wTail,y0+py*wTail);
ctx.lineTo(x1+px*wHead,y1+py*wHead);
ctx.lineTo(x1-px*wHead,y1-py*wHead);
ctx.lineTo(x0-px*wTail,y0-py*wTail);
ctx.closePath();
ctx.fill();
}
const haloR=310+pulse1*38;
const haloGrad=ctx.createRadialGradient(CX,CY,0,CX,CY,haloR);
haloGrad.addColorStop(0,'rgba(255,255,255,0.95)');
haloGrad.addColorStop(0.12,'rgba(195,253,255,0.78)');
haloGrad.addColorStop(0.32,'rgba(0,245,255,0.36)');
haloGrad.addColorStop(0.65,'rgba(3,105,161,0.12)');
haloGrad.addColorStop(1,'rgba(2,6,17,0)');
ctx.fillStyle=haloGrad;
ctx.beginPath();
ctx.arc(CX,CY,haloR,0,tau);
ctx.fill();
const coreR=64+pulse2*10;
const coreGrad=ctx.createRadialGradient(CX,CY,0,CX,CY,coreR);
coreGrad.addColorStop(0,'rgba(255,255,255,1)');
coreGrad.addColorStop(0.35,'rgba(255,255,255,0.92)');
coreGrad.addColorStop(0.7,'rgba(0,245,255,0.45)');
coreGrad.addColorStop(1,'rgba(0,245,255,0)');
ctx.fillStyle=coreGrad;
ctx.beginPath();
ctx.arc(CX,CY,coreR,0,tau);
ctx.fill();
const flareLen=165+pulse1*28;
const flareGradH=ctx.createLinearGradient(CX-flareLen,CY,CX+flareLen,CY);
flareGradH.addColorStop(0,'rgba(0,245,255,0)');
flareGradH.addColorStop(0.38,'rgba(0,245,255,0.55)');
flareGradH.addColorStop(0.5,'rgba(255,255,255,0.98)');
flareGradH.addColorStop(0.62,'rgba(0,245,255,0.55)');
flareGradH.addColorStop(1,'rgba(0,245,255,0)');
ctx.fillStyle=flareGradH;
ctx.beginPath();
ctx.moveTo(CX-flareLen,CY);
ctx.lineTo(CX,CY-4.2);
ctx.lineTo(CX+flareLen,CY);
ctx.lineTo(CX,CY+4.2);
ctx.closePath();
ctx.fill();
const flareLenV=flareLen*0.62;
const flareGradV=ctx.createLinearGradient(CX,CY-flareLenV,CX,CY+flareLenV);
flareGradV.addColorStop(0,'rgba(0,245,255,0)');
flareGradV.addColorStop(0.38,'rgba(0,245,255,0.45)');
flareGradV.addColorStop(0.5,'rgba(255,255,255,0.95)');
flareGradV.addColorStop(0.62,'rgba(0,245,255,0.45)');
flareGradV.addColorStop(1,'rgba(0,245,255,0)');
ctx.fillStyle=flareGradV;
ctx.beginPath();
ctx.moveTo(CX,CY-flareLenV);
ctx.lineTo(CX+3.5,CY);
ctx.lineTo(CX,CY+flareLenV);
ctx.lineTo(CX-3.5,CY);
ctx.closePath();
ctx.fill();
ctx.globalCompositeOperation='source-over';
const vig=ctx.createRadialGradient(CX,CY,460,CX,CY,1180);
vig.addColorStop(0,'rgba(2,6,17,0)');
vig.addColorStop(0.75,'rgba(2,6,17,0.18)');
vig.addColorStop(1,'rgba(2,6,17,0.68)');
ctx.fillStyle=vig;
ctx.fillRect(0,0,W,H);
ctx.restore();
requestAnimationFrame(drawFrame);
}
requestAnimationFrame(drawFrame);
})();
</script>
</body>
</html>
