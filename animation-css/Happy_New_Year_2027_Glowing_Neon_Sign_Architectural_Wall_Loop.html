<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy New Year 2027 Glowing Neon Sign Architectural Wall Loop</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060913}
svg{display:block;width:100%;height:100%}
.ambient-cyan{animation:breathCyan 5s ease-in-out infinite}
.ambient-magenta{animation:breathMagenta 5s ease-in-out infinite;animation-delay:-2.5s}
.wall-spill{animation:spillPulse 10s ease-in-out infinite}
.border-cyan{animation:cyanTube 5s ease-in-out infinite}
.border-magenta{animation:magentaTube 5s ease-in-out infinite}
.title-neon{animation:titleFlicker 5s linear infinite}
.num-2a{animation:tubeSteady 5s ease-in-out infinite}
.num-0{animation:flickerSubtleA 2s linear infinite}
.num-2b{animation:tubeSteady 5s ease-in-out infinite;animation-delay:-1.5s}
.num-7{animation:flickerSubtleB 5s linear infinite}
.dust-a{animation:driftA 10s linear infinite}
.dust-b{animation:driftB 10s linear infinite}
.dust-c{animation:driftC 5s linear infinite}
@keyframes breathCyan{
  0%,100%{opacity:.78}
  50%{opacity:1}
}
@keyframes breathMagenta{
  0%,100%{opacity:.72}
  50%{opacity:.98}
}
@keyframes spillPulse{
  0%,100%{opacity:.82}
  25%{opacity:.95}
  50%{opacity:.76}
  75%{opacity:1}
}
@keyframes cyanTube{
  0%,100%{opacity:.94}
  50%{opacity:1}
}
@keyframes magentaTube{
  0%,100%{opacity:.92}
  42%{opacity:1}
  44%{opacity:.84}
  45%{opacity:1}
  50%{opacity:.98}
}
@keyframes titleFlicker{
  0%,100%{opacity:1}
  18%{opacity:.96}
  19%{opacity:.74}
  20%{opacity:1}
  50%{opacity:.94}
  73%{opacity:1}
  74%{opacity:.8}
  75%{opacity:.98}
  76%{opacity:.76}
  77.5%{opacity:1}
}
@keyframes tubeSteady{
  0%,100%{opacity:.93}
  50%{opacity:1}
}
@keyframes flickerSubtleA{
  0%,100%{opacity:1}
  46%{opacity:1}
  48%{opacity:.82}
  50%{opacity:1}
  84%{opacity:.97}
  86%{opacity:.88}
  88%{opacity:1}
}
@keyframes flickerSubtleB{
  0%,100%{opacity:1}
  28%{opacity:1}
  29%{opacity:.66}
  30.5%{opacity:1}
  31.5%{opacity:.78}
  33%{opacity:1}
  68%{opacity:.95}
  70%{opacity:.85}
  71.5%{opacity:1}
}
@keyframes driftA{
  0%{transform:translate(0px,140px);opacity:0}
  15%{opacity:.85}
  50%{transform:translate(18px,-80px);opacity:.65}
  85%{opacity:.75}
  100%{transform:translate(0px,-300px);opacity:0}
}
@keyframes driftB{
  0%{transform:translate(0px,160px);opacity:0}
  18%{opacity:.7}
  50%{transform:translate(-22px,-90px);opacity:.9}
  82%{opacity:.6}
  100%{transform:translate(0px,-340px);opacity:0}
}
@keyframes driftC{
  0%{transform:translate(0px,90px);opacity:0}
  20%{opacity:.65}
  50%{transform:translate(12px,-45px);opacity:.85}
  80%{opacity:.55}
  100%{transform:translate(0px,-180px);opacity:0}
}
</style>
</head>
