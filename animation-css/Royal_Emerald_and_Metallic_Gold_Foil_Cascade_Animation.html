<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Royal Emerald and Metallic Gold Foil Cascade Animation</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#032218}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="stage" width="3840" height="2160"></canvas>
<script>
(function(){
const canvas=document.getElementById('stage');
const ctx=canvas.getContext('2d');
const W=1920,H=1080,SCALE=2,LOOP=10000,TAU=Math.PI*2;

function mulberry32(seed){
  return function(){
    seed|=0;
    seed=seed+0x6D2B79F5|0;
    let t=Math.imul(seed^seed>>>15,1|seed);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}

const rng=mulberry32(739145);
const rand=(a,b)=>a+(b-a)*rng();
const randInt=(a,b)=>Math.floor(rand(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

function makeBackdrop(){
  const oc=document.createElement('canvas');
  oc.width=W;
  oc.height=H;
  const g=oc.getContext('2d');

  const base=g.createLinearGradient(0,0,0,H);
  base.addColorStop(0,'#063b29');
  base.addColorStop(0.45,'#052d20');
  base.addColorStop(1,'#031f16');
  g.fillStyle=base;
  g.fillRect(0,0,W,H);

  const spotlight=g.createRadialGradient(W*0.5,H*0.14,40,W*0.5,H*0.26,W*0.62);
  spotlight.addColorStop(0,'rgba(11,93,65,0.85)');
  spotlight.addColorStop(0.38,'rgba(9,74,52,0.52)');
  spotlight.addColorStop(0.72,'rgba(4,42,29,0.22)');
  spotlight.addColorStop(1,'rgba(3,34,24,0)');
  g.fillStyle=spotlight;
  g.fillRect(0,0,W,H);

  const sideGlowL=g.createRadialGradient(W*0.18,H*0.42,10,W*0.18,H*0.42,W*0.36);
  sideGlowL.addColorStop(0,'rgba(11,93,65,0.28)');
  sideGlowL.addColorStop(1,'rgba(3,34,24,0)');
  g.fillStyle=sideGlowL;
  g.fillRect(0,0,W,H);

  const sideGlowR=g.createRadialGradient(W*0.82,H*0.42,10,W*0.82,H*0.42,W*0.36);
  sideGlowR.addColorStop(0,'rgba(11,93,65,0.28)');
  sideGlowR.addColorStop(1,'rgba(3,34,24,0)');
  g.fillStyle=sideGlowR;
  g.fillRect(0,0,W,H);

  const vig=g.createRadialGradient(W*0.5,H*0.5,W*0.34,W*0.5,H*0.5,W*0.72);
  vig.addColorStop(0,'rgba(3,34,24,0)');
  vig.addColorStop(0.68,'rgba(3,34,24,0.34)');
  vig.addColorStop(1,'rgba(2,20,14,0.82)');
  g.fillStyle=vig;
  g.fillRect(0,0,W,H);

  return oc;
}

function makeBokehSprite(size){
  const oc=document.createElement('canvas');
  oc.width=size;
  oc.height=size;
  const g=oc.getContext('2d');
  const cx=size/2,cy=size/2,r=size/2;
  const grd=g.createRadialGradient(cx,cy,r*0.05,cx,cy,r);
  grd.addColorStop(0,'rgba(254,240,138,0.16)');
  grd.addColorStop(0.55,'rgba(245,158,11,0.12)');
  grd.addColorStop(0.82,'rgba(254,240,138,0.20)');
  grd.addColorStop(0.94,'rgba(180,83,9,0.08)');
  grd.addColorStop(1,'rgba(180,83,9,0)');
  g.fillStyle=grd;
  g.beginPath();
  g.arc(cx,cy,r,0,TAU);
  g.fill();
  return oc;
}

const backdropCanvas=makeBackdrop();
const bokehSprite=makeBokehSprite(256);

const bokehList=[];
for(let i=0;i<26;i++){
  const r=rand(42,128);
  const pad=r+30;
  const span=H+pad*2;
  bokehList.push({
    x0:rand(-60,W+60),
    y0:rand(0,span),
    r,
    pad,
    span,
    cycles:randInt(1,2),
    swayAmp:rand(18,46),
    swayFreq:randInt(1,2),
    swayPhase:rand(0,1),
    alpha:rand(0.14,0.34),
    pulseFreq:randInt(1,2),
    pulsePhase:rand(0,1)
  });
}

function sampleStreamX(){
  const zoneRoll=rng();
  if(zoneRoll<0.40){
    const u=rng();
    const biased=Math.pow(u,1.35);
    return -60+biased*(W*0.36+60);
  }
  if(zoneRoll<0.80){
    const u=rng();
    const biased=1-Math.pow(1-u,1.35);
    return W*0.64+biased*(W*0.36+60);
  }
  return W*0.32+rng()*(W*0.36);
}

const shapes=['rect','strip','diamond','circle'];
const confettiList=[];
const TOTAL_CONFETTI=420;

for(let i=0;i<TOTAL_CONFETTI;i++){
  const depth=rng();
  const isForeground=depth>0.74;
  const isBackground=depth<0.28;
  const shape=shapes[randInt(0,shapes.length-1)];

  let baseW,baseH;
  if(shape==='rect'){
    baseW=rand(11,22)*(0.72+depth*0.65);
    baseH=baseW*rand(0.45,0.72);
  }else if(shape==='strip'){
    baseW=rand(18,34)*(0.72+depth*0.65);
    baseH=rand(5,9)*(0.72+depth*0.65);
  }else if(shape==='diamond'){
    const s=rand(11,20)*(0.72+depth*0.65);
    baseW=s;
    baseH=s*rand(1.0,1.35);
  }else{
    const d=rand(7,14)*(0.72+depth*0.65);
    baseW=d;
    baseH=d;
  }

  const pad=55;
  const span=H+pad*2;
  const cycles=isForeground?randInt(3,4):(isBackground?randInt(1,2):randInt(2,3));

  confettiList.push({
    x0:sampleStreamX(),
    y0:rand(0,span),
    w:baseW,
    h:baseH,
    shape,
    pad,
    span,
    cycles,
    sway1Amp:rand(14,42)*(0.6+depth*0.6),
    sway1Freq:randInt(1,3),
    sway1Phase:rand(0,1),
    sway2Amp:rand(5,16),
    sway2Freq:randInt(3,5),
    sway2Phase:rand(0,1),
    rollFreq:randInt(2,6),
    rollPhase:rand(0,1),
    pitchFreq:randInt(2,5),
    pitchPhase:rand(0,1),
    spinDir:rng()<0.5?1:-1,
    baseSpin:rand(0,TAU),
    lightPhase:rand(0,1),
    alpha:(isBackground?rand(0.42,0.68):rand(0.76,0.98)),
    sharpness:isForeground?1.15:(isBackground?0.85:1.0)
  });
}

function lerpChannel(a,b,t){
  return Math.round(a+(b-a)*t);
}

function getFoilColors(glint){
  const g=clamp(glint,0,1);
  let c1,c2,c3;
  if(g>=0.5){
    const k=(g-0.5)*2;
    const r1=lerpChannel(254,255,k);
    const g1=lerpChannel(240,253,k);
    const b1=lerpChannel(138,224,k);

    const r2=lerpChannel(245,254,k);
    const g2=lerpChannel(158,229,k);
    const b2=lerpChannel(11,110,k);

    const r3=lerpChannel(180,245,k);
    const g3=lerpChannel(83,158,k);
    const b3=lerpChannel(9,11,k);

    c1='rgb('+r1+','+g1+','+b1+')';
    c2='rgb('+r2+','+g2+','+b2+')';
    c3='rgb('+r3+','+g3+','+b3+')';
  }else{
    const k=g*2;
    const r1=lerpChannel(217,254,k);
    const g1=lerpChannel(119,240,k);
    const b1=lerpChannel(6,138,k);

    const r2=lerpChannel(180,245,k);
    const g2=lerpChannel(83,158,k);
    const b2=lerpChannel(9,11,k);

    const r3=lerpChannel(120,180,k);
    const g3=lerpChannel(53,83,k);
    const b3=lerpChannel(15,9,k);

    c1='rgb('+r1+','+g1+','+b1+')';
    c2='rgb('+r2+','+g2+','+b2+')';
    c3='rgb('+r3+','+g3+','+b3+')';
  }
  return [c1,c2,c3];
}

function drawShapePath(g,shape,hw,hh){
  g.beginPath();
  if(shape==='rect'||shape==='strip'){
    g.rect(-hw,-hh,hw*2,hh*2);
  }else if(shape==='diamond'){
    g.moveTo(0,-hh);
    g.lineTo(hw,0);
    g.lineTo(0,hh);
    g.lineTo(-hw,0);
    g.closePath();
  }else{
    const rad=Math.max(1.5,Math.min(hw,hh));
    g.arc(0,0,rad,0,TAU);
  }
}

function render(ts){
  const t=(((ts||0)%LOOP)+LOOP)%LOOP/LOOP;

  ctx.setTransform(SCALE,0,0,SCALE,0,0);
  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=1;
  ctx.drawImage(backdropCanvas,0,0,W,H);

  ctx.globalCompositeOperation='screen';
  for(let i=0;i<bokehList.length;i++){
    const b=bokehList[i];
    const rawY=b.y0+b.cycles*b.span*t;
    const y=(((rawY%b.span)+b.span)%b.span)-b.pad;
    const x=b.x0+b.swayAmp*Math.sin(TAU*(b.swayFreq*t+b.swayPhase));
    const pulse=0.75+0.25*Math.sin(TAU*(b.pulseFreq*t+b.pulsePhase));
    ctx.globalAlpha=b.alpha*pulse;
    ctx.drawImage(bokehSprite,x-b.r,y-b.r,b.r*2,b.r*2);
  }

  ctx.globalCompositeOperation='source-over';
  for(let i=0;i<confettiList.length;i++){
    const p=confettiList[i];
    const rawY=p.y0+p.cycles*p.span*t;
    const y=(((rawY%p.span)+p.span)%p.span)-p.pad;

    const sway=p.sway1Amp*Math.sin(TAU*(p.sway1Freq*t+p.sway1Phase))
               +p.sway2Amp*Math.sin(TAU*(p.sway2Freq*t+p.sway2Phase));
    const x=p.x0+sway;

    const rollWave=Math.cos(TAU*(p.rollFreq*t+p.rollPhase));
    const pitchWave=Math.sin(TAU*(p.pitchFreq*t+p.pitchPhase));

    const sx=0.22+0.78*Math.abs(rollWave);
    const sy=0.24+0.76*Math.abs(pitchWave);
    const zAngle=p.baseSpin+p.spinDir*TAU*(t*2)+0.35*Math.sin(TAU*(t+p.lightPhase));

    const facing=0.5+0.5*Math.cos(TAU*(p.rollFreq*t+p.lightPhase));
    const glint=Math.pow(facing,1.45);
    const [cTop,cMid,cBot]=getFoilColors(glint);

    const hw=p.w*0.5;
    const hh=p.h*0.5;

    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(zAngle);
    ctx.scale(sx,sy);
    ctx.globalAlpha=p.alpha;

    const grad=ctx.createLinearGradient(-hw,-hh,hw,hh);
    grad.addColorStop(0,cTop);
    grad.addColorStop(0.52,cMid);
    grad.addColorStop(1,cBot);

    drawShapePath(ctx,p.shape,hw,hh);
    ctx.fillStyle=grad;
    ctx.fill();

    if(glint>0.58){
      ctx.globalAlpha=p.alpha*((glint-0.58)/0.42)*0.72;
      ctx.fillStyle='#FEF08A';
      drawShapePath(ctx,p.shape,hw*0.72,hh*0.72);
      ctx.fill();
    }

    ctx.restore();
  }

  requestAnimationFrame(render);
}

requestAnimationFrame(render);
})();
</script>
</body>
</html>
