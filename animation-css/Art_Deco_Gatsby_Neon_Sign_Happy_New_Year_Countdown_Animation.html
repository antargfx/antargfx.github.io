<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Art Deco Gatsby Neon Sign Happy New Year Countdown Animation</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050814}
.stage{position:fixed;inset:0;width:100%;height:100%;display:block}
svg{width:100%;height:100%;display:block}
.ray-inner{animation:rayPulse 2s ease-in-out infinite}
.ray-mid{animation:rayPulse 2s ease-in-out -0.35s infinite}
.ray-outer{animation:rayPulse 2s ease-in-out -0.7s infinite}
.fan-pulse{animation:fanGlow 2s ease-in-out infinite}
.marquee-glow{animation:neonBreathe 2s ease-in-out infinite}
.border-shimmer{animation:borderGlow 5s ease-in-out infinite}
.medallion-ring{transform-box:fill-box;transform-origin:center;animation:ringPulse 1s ease-in-out infinite}
.medallion-star{transform-box:fill-box;transform-origin:center;animation:starSpin 10s linear infinite}
.medallion-aura{animation:auraBeat 1s ease-in-out infinite}
.tick-flash{transform-box:fill-box;transform-origin:center;animation:tickBurst 1s ease-in-out infinite}
.cd-num{
  font-family:'Futura','Century Gothic','Avant Garde','Trebuchet MS','Segoe UI',sans-serif;
  font-weight:700;
  font-size:186px;
  text-anchor:middle;
  dominant-baseline:central;
  transform-box:fill-box;
  transform-origin:center;
  opacity:0;
  animation:countdownStep 10s linear infinite;
}
.cd-10{animation-delay:0s}
.cd-9{animation-delay:-9s}
.cd-8{animation-delay:-8s}
.cd-7{animation-delay:-7s}
.cd-6{animation-delay:-6s}
.cd-5{animation-delay:-5s}
.cd-4{animation-delay:-4s}
.cd-3{animation-delay:-3s}
.cd-2{animation-delay:-2s}
.cd-1{animation-delay:-1s}
.marquee-text-halo{
  font-family:'Futura','Century Gothic','Avant Garde','Trebuchet MS','Segoe UI',sans-serif;
  font-weight:700;
  font-size:94px;
  letter-spacing:14px;
  text-anchor:middle;
  dominant-baseline:central;
  fill:none;
  stroke:#F59E0B;
  stroke-width:10;
  opacity:0.7;
}
.marquee-text-tube{
  font-family:'Futura','Century Gothic','Avant Garde','Trebuchet MS','Segoe UI',sans-serif;
  font-weight:700;
  font-size:94px;
  letter-spacing:14px;
  text-anchor:middle;
  dominant-baseline:central;
  fill:#FDE68A;
  stroke:#FDE68A;
  stroke-width:3.2;
}
.marquee-text-inline{
  font-family:'Futura','Century Gothic','Avant Garde','Trebuchet MS','Segoe UI',sans-serif;
  font-weight:700;
  font-size:94px;
  letter-spacing:14px;
  text-anchor:middle;
  dominant-baseline:central;
  fill:none;
  stroke:#080D1F;
  stroke-width:2.6;
}
.marquee-text-core{
  font-family:'Futura','Century Gothic','Avant Garde','Trebuchet MS','Segoe UI',sans-serif;
  font-weight:700;
  font-size:94px;
  letter-spacing:14px;
  text-anchor:middle;
  dominant-baseline:central;
  fill:none;
  stroke:#FFFBEB;
  stroke-width:0.9;
  opacity:0.9;
}
.bubble-slow{animation:bubbleRise 10s linear infinite}
.bubble-fast{animation:bubbleRise 5s linear infinite}
@keyframes rayPulse{
  0%{opacity:0.22;stroke-width:2.2}
  45%{opacity:0.95;stroke-width:4.2}
  100%{opacity:0.22;stroke-width:2.2}
}
@keyframes fanGlow{
  0%,100%{opacity:0.55}
  50%{opacity:1}
}
@keyframes neonBreathe{
  0%,100%{opacity:0.86}
  50%{opacity:1}
}
@keyframes borderGlow{
  0%,100%{opacity:0.75}
  50%{opacity:1}
}
@keyframes ringPulse{
  0%{transform:scale(0.97);opacity:0.65}
  18%{transform:scale(1.03);opacity:1}
  100%{transform:scale(0.97);opacity:0.65}
}
@keyframes starSpin{
  0%{transform:rotate(0deg)}
  100%{transform:rotate(360deg)}
}
@keyframes auraBeat{
  0%{opacity:0.35}
  20%{opacity:0.8}
  100%{opacity:0.35}
}
@keyframes tickBurst{
  0%{transform:scale(0.92);opacity:0.9}
  35%{transform:scale(1.12);opacity:0}
  100%{transform:scale(1.12);opacity:0}
}
@keyframes countdownStep{
  0%{opacity:0;transform:scale(0.84)}
  1.1%{opacity:1;transform:scale(1.04)}
  2.2%{opacity:1;transform:scale(1)}
  8.6%{opacity:1;transform:scale(1)}
  9.8%{opacity:0;transform:scale(1.07)}
  100%{opacity:0;transform:scale(0.84)}
}
@keyframes bubbleRise{
  0%{transform:translate(0px,0px) scale(0.75);opacity:0}
  10%{transform:translate(7px,-118px) scale(1);opacity:0.85}
  35%{transform:translate(-8px,-413px) scale(0.92);opacity:0.7}
  60%{transform:translate(9px,-708px) scale(1.05);opacity:0.85}
  85%{transform:translate(-6px,-1003px) scale(0.9);opacity:0.6}
  100%{transform:translate(0px,-1180px) scale(0.75);opacity:0}
}
</style>
</head>
<body>

<svg id="scene" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">

    <path d="M126 58 L1794 58 L1794 88 L1828 88 L1828 122 L1860 122 L1860 958 L1828 958 L1828 992 L1794 992 L1794 1022 L126 1022 L126 992 L92 992 L92 958 L60 958 L60 122 L92 122 L92 88 L126 88 Z" fill="none" stroke="#F59E0B" stroke-width="1.8" opacity="0.85"/>
    <path d="M148 74 L1772 74 M148 1006 L1772 1006 M76 146 L76 934 M1844 146 L1844 934" fill="none" stroke="#FDE68A" stroke-width="1.2" opacity="0.6"/>

    </g>

    <path d="M350 185 L1570 185 L1612 225 L1644 225 L1644 335 L1612 335 L1570 375 L350 375 L308 335 L276 335 L276 225 L308 225 Z" fill="url(#marqueeBg)" stroke="url(#goldTube)" stroke-width="4.5" filter="url(#goldGlow)"/>
    <path d="M362 199 L1558 199 L1596 236 L1628 236 L1628 324 L1596 324 L1558 361 L362 361 L324 324 L292 324 L292 236 L324 236 Z" fill="none" stroke="#F59E0B" stroke-width="2.2" filter="url(#softGoldGlow)"/>
    <path d="M376 211 L1544 211 M376 349 L1544 349" stroke="#FDE68A" stroke-width="1.4" opacity="0.85"/>

<script>
(function(){
  const ns="http://www.w3.org/2000/svg";
  function el(tag,attrs,parent){
    const n=document.createElementNS(ns,tag);
    for(const k in attrs)n.setAttribute(k,attrs[k]);
    if(parent)parent.appendChild(n);
    return n;
  }

  const sunbeams=document.getElementById("sunbeams");
  const cx=960,cy=510;
  const totalRays=36;
  for(let i=0;i<totalRays;i++){
    const a=(i/totalRays)*Math.PI*2;
    const cos=Math.cos(a),sin=Math.sin(a);
    const isMajor=i%2===0;
    const c1=isMajor?"#FDE68A":"#F59E0B";
    el("line",{
      x1:(cx+cos*180).toFixed(1),y1:(cy+sin*180).toFixed(1),
      x2:(cx+cos*430).toFixed(1),y2:(cy+sin*430).toFixed(1),
      stroke:c1,"stroke-linecap":"round",class:"ray-inner"
    },sunbeams);
    el("line",{
      x1:(cx+cos*455).toFixed(1),y1:(cy+sin*455).toFixed(1),
      x2:(cx+cos*740).toFixed(1),y2:(cy+sin*740).toFixed(1),
      stroke:c1,"stroke-linecap":"round",class:"ray-mid"
    },sunbeams);
    el("line",{
      x1:(cx+cos*765).toFixed(1),y1:(cy+sin*765).toFixed(1),
      x2:(cx+cos*1080).toFixed(1),y2:(cy+sin*1080).toFixed(1),
      stroke:c1,"stroke-linecap":"round",class:"ray-outer"
    },sunbeams);
  }

  const sideArches=document.getElementById("sideArches");
  function drawArchFan(ox,oy,rMax,startDeg,endDeg,spokes,rings,parent){
    for(let r=1;r<=rings;r++){
      const rad=(rMax/rings)*r;
      const s=startDeg*Math.PI/180,e=endDeg*Math.PI/180;
      const x1=ox+Math.cos(s)*rad,y1=oy+Math.sin(s)*rad;
      const x2=ox+Math.cos(e)*rad,y2=oy+Math.sin(e)*rad;
      const large=Math.abs(endDeg-startDeg)>180?1:0;
      const sweep=endDeg>startDeg?1:0;
      el("path",{
        d:`M${x1.toFixed(1)} ${y1.toFixed(1)} A${rad.toFixed(1)} ${rad.toFixed(1)} 0 ${large} ${sweep} ${x2.toFixed(1)} ${y2.toFixed(1)}`,
        fill:"none",stroke:r%2===0?"#FDE68A":"#F59E0B","stroke-width":r===rings?"2.6":"1.6",opacity:r===rings?"0.9":"0.65"
      },parent);
    }
    for(let i=0;i<=spokes;i++){
      const deg=startDeg+(endDeg-startDeg)*(i/spokes);
      const rad=deg*Math.PI/180;
      el("line",{
        x1:ox,y1:oy,
        x2:(ox+Math.cos(rad)*rMax).toFixed(1),
        y2:(oy+Math.sin(rad)*rMax).toFixed(1),
        stroke:i%2===0?"#FDE68A":"#F59E0B","stroke-width":"1.4",opacity:"0.65"
      },parent);
    }
  }

  drawArchFan(76,540,210,-90,90,10,4,sideArches);
  drawArchFan(1844,540,210,90,270,10,4,sideArches);
  drawArchFan(960,1038,240,180,360,12,4,sideArches);

  const cornerFans=document.getElementById("cornerFans");
  drawArchFan(76,72,155,0,90,6,3,cornerFans);
  drawArchFan(1844,72,155,90,180,6,3,cornerFans);
  drawArchFan(76,1008,155,270,360,6,3,cornerFans);
  drawArchFan(1844,1008,155,180,270,6,3,cornerFans);

  function octPoints(ox,oy,r){
    const pts=[];
    for(let i=0;i<8;i++){
      const a=(i*45+22.5)*Math.PI/180;
      pts.push(`${(ox+Math.cos(a)*r).toFixed(1)},${(oy+Math.sin(a)*r).toFixed(1)}`);
    }
    return pts.join(" ");
  }

  const mcx=960,mcy=735;
  document.getElementById("octBurst").setAttribute("points",octPoints(mcx,mcy,232));
  document.getElementById("octOuter").setAttribute("points",octPoints(mcx,mcy,256));
  document.getElementById("octStep").setAttribute("points",octPoints(mcx,mcy,236));
  document.getElementById("octCyanOuter").setAttribute("points",octPoints(mcx,mcy,214));
  document.getElementById("octCyanInner").setAttribute("points",octPoints(mcx,mcy,194));

  const starGroup=document.getElementById("octStarGroup");
  el("polygon",{points:octPoints(mcx,mcy,182),fill:"none",stroke:"#2DD4BF","stroke-width":"1.2"},starGroup);
  const star2=[];
  for(let i=0;i<8;i++){
    const a=(i*45)*Math.PI/180;
    star2.push(`${(mcx+Math.cos(a)*182).toFixed(1)},${(mcy+Math.sin(a)*182).toFixed(1)}`);
  }
  el("polygon",{points:star2.join(" "),fill:"none",stroke:"#FDE68A","stroke-width":"1.1"},starGroup);

  const vertGroup=document.getElementById("octVertices");
  for(let i=0;i<8;i++){
    const a=(i*45+22.5)*Math.PI/180;
    const vx=mcx+Math.cos(a)*256,vy=mcy+Math.sin(a)*256;
    el("circle",{cx:vx.toFixed(1),cy:vy.toFixed(1),r:"5.5",fill:"#FDE68A",stroke:"#FFFBEB","stroke-width":"1.2"},vertGroup);
    const ix=mcx+Math.cos(a)*214,iy=mcy+Math.sin(a)*214;
