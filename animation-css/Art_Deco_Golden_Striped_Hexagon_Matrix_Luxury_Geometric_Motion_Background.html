<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Art Deco Golden Striped Hexagon Matrix Luxury Geometric Motion Background</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090A0C}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const W=1920,H=1080,DURATION=10000;
const R=136;
const DX=1.5*R;
const DY=Math.sqrt(3)*R;
const HH=DY*0.5;
const PI=Math.PI;
const STEP=PI/3;

const cells=[];
for(let col=-6;col<=6;col++){
  for(let row=-4;row<=4;row++){
    const cx=W*0.5+col*DX;
    const cy=H*0.5+row*DY+(Math.abs(col)%2===1?HH:0);
    if(cx>-R*2&&cx<W+R*2&&cy>-R*2&&cy<H+R*2){
      const dist=Math.hypot((cx-W*0.5)/W,(cy-H*0.5)/H);
      const wave=((col*0.11+row*0.17)%2+2)%2;
      cells.push({col,row,cx,cy,dist,wave,parity:(Math.abs(col+row))%2});
    }
  }
}

const tracks=[];
for(let row=-3;row<=4;row++){
  const pts=[];
  let x=W*0.5-8*DX-R;
  let y=H*0.5+row*DY;
  pts.push({x,y});
  for(let i=0;i<10;i++){
    x+=R*0.5;y-=HH;pts.push({x,y});
    x+=R;pts.push({x,y});
    x+=R*0.5;y+=HH;pts.push({x,y});
    x+=R;pts.push({x,y});
  }
  tracks.push({pts,len:(pts.length-1)*R,phase:((row+4)*0.19)%1,dir:row%2===0?1:-1,speed:1,tail:R*2.8});
}

for(let k=-6;k<=6;k+=2){
  const pts1=[];
  let x1=W*0.5+k*DX-R-4.5*R;
  let y1=H*0.5+4*DY;
  pts1.push({x:x1,y:y1});
  for(let i=0;i<14;i++){
    x1+=R*0.5;y1-=HH;pts1.push({x:x1,y:y1});
    x1+=R;pts1.push({x:x1,y:y1});
  }
  tracks.push({pts:pts1,len:(pts1.length-1)*R,phase:((k+7)*0.137)%1,dir:1,speed:1,tail:R*2.5});

  const pts2=[];
  let x2=W*0.5+k*DX-R-4.5*R;
  let y2=H*0.5-4*DY;
  pts2.push({x:x2,y:y2});
  for(let i=0;i<14;i++){
    x2+=R*0.5;y2+=HH;pts2.push({x:x2,y:y2});
    x2+=R;pts2.push({x:x2,y:y2});
  }
  tracks.push({pts:pts2,len:(pts2.length-1)*R,phase:((k+11)*0.231)%1,dir:-1,speed:1,tail:R*2.5});
}

function resize(){
  const dpr=window.devicePixelRatio||1;
  const cw=Math.max(1,Math.round(window.innerWidth*dpr));
  const ch=Math.max(1,Math.round(window.innerHeight*dpr));
  if(canvas.width!==cw||canvas.height!==ch){
    canvas.width=cw;
    canvas.height=ch;
  }
}
window.addEventListener('resize',resize);
resize();

function easeQuint(t){
  return t*t*t*(t*(t*6-15)+10);
}

function harmonicStepAngle(p,offset,stepsPerLoop){
  const u=((p*stepsPerLoop+offset)%stepsPerLoop+stepsPerLoop)%stepsPerLoop;
  const idx=Math.floor(u);
  const f=u-idx;
  let local=0;
  if(f<=0.18){
    local=0;
  }else if(f>=0.82){
    local=1;
  }else{
    local=easeQuint((f-0.18)/0.64);
  }
  return (idx+local)*STEP;
}

function traceHex(cx,cy,radius,rot){
  ctx.beginPath();
  for(let i=0;i<6;i++){
    const a=rot+i*STEP;
    const x=cx+Math.cos(a)*radius;
    const y=cy+Math.sin(a)*radius;
    if(i===0)ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
  }
  ctx.closePath();
}

function drawPinstripeBackdrop(p){
  const bg=ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'#090A0C');
  bg.addColorStop(0.35,'#15181E');
  bg.addColorStop(0.68,'#23262D');
  bg.addColorStop(1,'#090A0C');
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,W,H);

  const shimmerX=W*0.5+Math.sin(p*PI*2)*160;
  const shimmerY=H*0.5+Math.cos(p*PI*2)*90;
  const rad=ctx.createRadialGradient(shimmerX,shimmerY,40,W*0.5,H*0.5,1150);
  rad.addColorStop(0,'rgba(197,160,89,0.08)');
  rad.addColorStop(0.45,'rgba(120,90,40,0.03)');
  rad.addColorStop(1,'rgba(9,10,12,0.55)');
  ctx.fillStyle=rad;
  ctx.fillRect(0,0,W,H);

  ctx.save();
  ctx.lineWidth=1;
  const angles=[0,PI/3,-PI/3];
  for(let aIdx=0;aIdx<3;aIdx++){
    ctx.save();
    ctx.translate(W*0.5,H*0.5);
    ctx.rotate(angles[aIdx]);
    const span=1400;
    const spacing=DY;
    for(let y=-span;y<=span;y+=spacing){
      ctx.strokeStyle='rgba(120,90,40,0.22)';
      ctx.beginPath();
      ctx.moveTo(-1600,y-5);ctx.lineTo(1600,y-5);
      ctx.moveTo(-1600,y+5);ctx.lineTo(1600,y+5);
      ctx.stroke();

      ctx.strokeStyle='rgba(197,160,89,0.26)';
      ctx.beginPath();
      ctx.moveTo(-1600,y);ctx.lineTo(1600,y);
      ctx.stroke();
    }
    ctx.restore();
  }
  ctx.restore();
}

function drawHexCell(cell,p,goldGrad,brightGoldGrad){
  const {cx,cy,wave,parity}=cell;

  const tileGrad=ctx.createLinearGradient(cx-R,cy-R,cx+R,cy+R);
  tileGrad.addColorStop(0,'#1A1D24');
  tileGrad.addColorStop(0.5,'#111318');
  tileGrad.addColorStop(1,'#0B0C0F');

  traceHex(cx,cy,R*0.955,0);
  ctx.fillStyle=tileGrad;
  ctx.fill();

  traceHex(cx,cy,R,0);
  ctx.lineWidth=2.2;
  ctx.strokeStyle='#785A28';
  ctx.stroke();

  traceHex(cx,cy,R*0.955,0);
  ctx.lineWidth=1.1;
  ctx.strokeStyle=goldGrad;
  ctx.stroke();

  traceHex(cx,cy,R*0.905,0);
  ctx.lineWidth=0.9;
  ctx.strokeStyle='rgba(120,90,40,0.75)';
  ctx.stroke();

  for(let i=0;i<6;i++){
    const a=i*STEP;
    const vx=cx+Math.cos(a)*R;
    const vy=cy+Math.sin(a)*R;
    ctx.fillStyle='#C5A059';
    ctx.beginPath();
    ctx.arc(vx,vy,2.4,0,PI*2);
    ctx.fill();
  }

  const dir1=parity===0?1:-1;
  const rot1=dir1*harmonicStepAngle(p,wave,2);
  const rot2=-dir1*harmonicStepAngle(p,wave+0.5,2);
  const rot3=dir1*harmonicStepAngle(p,wave+1.0,2);

  const pulseSheen=0.5+0.5*Math.sin((p*2+wave)*PI*2);

  traceHex(cx,cy,R*0.79,rot1);
  ctx.lineWidth=1.8;
  ctx.strokeStyle=goldGrad;
  ctx.stroke();

  traceHex(cx,cy,R*0.74,rot1);
  ctx.lineWidth=1;
  ctx.strokeStyle='#785A28';
  ctx.stroke();

  traceHex(cx,cy,R*0.695,rot1);
  ctx.lineWidth=1.1;
  ctx.strokeStyle='rgba(255,243,176,'+(0.32+0.25*pulseSheen).toFixed(3)+')';
  ctx.stroke();

  ctx.save();
  ctx.strokeStyle='#C5A059';
  ctx.lineWidth=1.2;
  for(let i=0;i<6;i++){
    const a=rot1+i*STEP+STEP*0.5;
    const c=Math.cos(a),s=Math.sin(a);
    const rIn=R*0.60,rOut=R*0.695;
    ctx.beginPath();
    ctx.moveTo(cx+c*rIn,cy+s*rIn);
    ctx.lineTo(cx+c*rOut,cy+s*rOut);
    ctx.stroke();
  }
  ctx.restore();

  traceHex(cx,cy,R*0.58,rot2);
  ctx.fillStyle='rgba(12,13,17,0.85)';
  ctx.fill();
  ctx.lineWidth=1.9;
  ctx.strokeStyle=brightGoldGrad;
  ctx.stroke();

  traceHex(cx,cy,R*0.53,rot2);
  ctx.lineWidth=1.1;
  ctx.strokeStyle='#785A28';
  ctx.stroke();

  traceHex(cx,cy,R*0.48,rot2);
  ctx.lineWidth=1.3;
  ctx.strokeStyle='#C5A059';
  ctx.stroke();

  ctx.save();
  ctx.strokeStyle='rgba(255,243,176,0.55)';
  ctx.lineWidth=1.1;
  for(let i=0;i<6;i++){
    const a=rot2+i*STEP;
    const x1=cx+Math.cos(a)*R*0.48;
    const y1=cy+Math.sin(a)*R*0.48;
    const x2=cx+Math.cos(a)*R*0.36;
    const y2=cy+Math.sin(a)*R*0.36;
    ctx.beginPath();
    ctx.moveTo(x1,y1);
    ctx.lineTo(x2,y2);
    ctx.stroke();
  }
  ctx.restore();

  traceHex(cx,cy,R*0.32,rot3);
  ctx.fillStyle='#0D0E12';
  ctx.fill();
  ctx.lineWidth=1.8;
  ctx.strokeStyle=goldGrad;
  ctx.stroke();

  traceHex(cx,cy,R*0.24,rot3);
  ctx.lineWidth=1;
  ctx.strokeStyle='rgba(255,243,176,'+(0.45+0.35*pulseSheen).toFixed(3)+')';
  ctx.stroke();

  traceHex(cx,cy,R*0.13,rot3+STEP*0.5);
  ctx.lineWidth=1.2;
  ctx.strokeStyle='#C5A059';
  ctx.stroke();

  ctx.fillStyle='#FFF3B0';
  ctx.beginPath();
  ctx.arc(cx,cy,2.6,0,PI*2);
  ctx.fill();
}

function pointOnTrack(pts,dist){
  const seg=Math.floor(dist/R);
  const idx=Math.max(0,Math.min(pts.length-2,seg));
  const frac=Math.max(0,Math.min(1,(dist-idx*R)/R));
  const p0=pts[idx],p1=pts[idx+1];
  return {x:p0.x+(p1.x-p0.x)*frac,y:p0.y+(p1.y-p0.y)*frac};
}

function drawPulses(p){
  ctx.save();
  ctx.lineCap='round';
  ctx.lineJoin='round';

  for(let i=0;i<tracks.length;i++){
    const tr=tracks[i];
    const cycle=((p*tr.speed+tr.phase)%1+1)%1;
    const span=tr.len+tr.tail;
    const head=tr.dir===1?cycle*span:tr.len-cycle*span+tr.tail;
    const sStart=tr.dir===1?head-tr.tail:head;
    const sEnd=tr.dir===1?head:head+tr.tail;

    const visStart=Math.max(0,sStart);
    const visEnd=Math.min(tr.len,sEnd);
    if(visEnd<=visStart)continue;

    const steps=16;
    const ds=(visEnd-visStart)/steps;
    for(let s=0;s<steps;s++){
      const d0=visStart+s*ds;
      const d1=d0+ds;
      const dm=(d0+d1)*0.5;
      const rawT=tr.dir===1?(dm-(head-tr.tail))/tr.tail:(head+tr.tail-dm)/tr.tail;
      const t=Math.max(0,Math.min(1,rawT));
      const intensity=t*t;

      const a=pointOnTrack(tr.pts,d0);
      const b=pointOnTrack(tr.pts,d1);

      ctx.strokeStyle='rgba(197,160,89,'+(0.32*intensity).toFixed(3)+')';
      ctx.lineWidth=11*t+2;
      ctx.beginPath();
      ctx.moveTo(a.x,a.y);
      ctx.lineTo(b.x,b.y);
      ctx.stroke();

      ctx.strokeStyle='rgba(255,243,176,'+(0.88*intensity).toFixed(3)+')';
      ctx.lineWidth=3.2*t+0.8;
      ctx.beginPath();
      ctx.moveTo(a.x,a.y);
      ctx.lineTo(b.x,b.y);
      ctx.stroke();

      ctx.strokeStyle='rgba(255,255,240,'+(0.95*intensity*t).toFixed(3)+')';
      ctx.lineWidth=1.4*t+0.3;
      ctx.beginPath();
      ctx.moveTo(a.x,a.y);
      ctx.lineTo(b.x,b.y);
      ctx.stroke();
    }

    if(head>=0&&head<=tr.len){
      const hp=pointOnTrack(tr.pts,head);
      const flare=ctx.createRadialGradient(hp.x,hp.y,0,hp.x,hp.y,22);
      flare.addColorStop(0,'rgba(255,255,240,0.95)');
      flare.addColorStop(0.25,'rgba(255,243,176,0.75)');
      flare.addColorStop(0.6,'rgba(197,160,89,0.28)');
      flare.addColorStop(1,'rgba(120,90,40,0)');
      ctx.fillStyle=flare;
      ctx.beginPath();
      ctx.arc(hp.x,hp.y,22,0,PI*2);
      ctx.fill();
    }
  }
  ctx.restore();
}

function render(ts){
  resize();
  const p=(((ts||0)%DURATION)+DURATION)%DURATION/DURATION;

  const cw=canvas.width,ch=canvas.height;
  const scale=Math.max(cw/W,ch/H);
  const ox=(cw-W*scale)*0.5;
  const oy=(ch-H*scale)*0.5;

  ctx.save();
  ctx.setTransform(scale,0,0,scale,ox,oy);

  drawPinstripeBackdrop(p);

  const sweep=Math.sin(p*PI*2)*240;
  const goldGrad=ctx.createLinearGradient(sweep,0,W+sweep,H);
  goldGrad.addColorStop(0,'#785A28');
  goldGrad.addColorStop(0.25,'#C5A059');
  goldGrad.addColorStop(0.5,'#FFF3B0');
  goldGrad.addColorStop(0.75,'#C5A059');
  goldGrad.addColorStop(1,'#785A28');

  const brightGoldGrad=ctx.createLinearGradient(W-sweep,0,-sweep,H);
  brightGoldGrad.addColorStop(0,'#9A7738');
  brightGoldGrad.addColorStop(0.45,'#FFF3B0');
  brightGoldGrad.addColorStop(0.6,'#C5A059');
  brightGoldGrad.addColorStop(1,'#785A28');

  for(let i=0;i<cells.length;i++){
    drawHexCell(cells[i],p,goldGrad,brightGoldGrad);
  }

  drawPulses(p);

  const vig=ctx.createRadialGradient(W*0.5,H*0.5,H*0.38,W*0.5,H*0.5,W*0.66);
  vig.addColorStop(0,'rgba(9,10,12,0)');
  vig.addColorStop(1,'rgba(9,10,12,0.52)');
  ctx.fillStyle=vig;
  ctx.fillRect(0,0,W,H);

  ctx.restore();
  requestAnimationFrame(render);
}

requestAnimationFrame(render);
})();
</script>
</body>
</html>
