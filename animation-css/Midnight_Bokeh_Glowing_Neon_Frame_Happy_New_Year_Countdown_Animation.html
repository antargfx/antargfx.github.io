<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Midnight Bokeh Glowing Neon Frame Happy New Year Countdown Animation</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07061A}
svg{display:block;width:100%;height:100%}
.bokeh-slow{animation:floatUp 10s linear infinite}
.bokeh-mid{animation:floatUp 10s linear infinite;animation-delay:-3.5s}
.bokeh-fast{animation:floatUp 5s linear infinite}
.star-a{transform-origin:0 0;animation:twinkle 2s ease-in-out infinite}
.star-b{transform-origin:0 0;animation:twinkle 5s ease-in-out infinite}
.fw-burst-a{transform-origin:0 0;animation:fwExpand 5s ease-in-out infinite}
.fw-burst-b{transform-origin:0 0;animation:fwExpand 5s ease-in-out infinite}
.fw-ring{transform-origin:0 0;animation:fwRing 5s ease-in-out infinite}
.neon-pulse-rose{animation:neonBreathe 2s ease-in-out infinite}
.neon-pulse-aqua{animation:neonBreathe 2s ease-in-out infinite;animation-delay:-1s}
.title-glow{animation:titlePulse 2s ease-in-out infinite}
.halo-sweep{stroke-dasharray:1319.47;stroke-dashoffset:1319.47;animation:sweepRing 1s linear infinite}
.halo-spark{transform-origin:0 0;animation:orbitSpark 1s linear infinite}
.halo-tick-pulse{transform-origin:960px 615px;animation:tickWave 1s ease-in-out infinite}
.inner-orbit{transform-origin:960px 615px;animation:spinSlow 10s linear infinite}
.count-num{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;font-weight:800;font-size:210px;text-anchor:middle;dominant-baseline:central;transform-origin:960px 615px;opacity:0;animation:countSlot 10s linear infinite}
.n10{animation-delay:0s}
.n9{animation-delay:-9s}
.n8{animation-delay:-8s}
.n7{animation-delay:-7s}
.n6{animation-delay:-6s}
.n5{animation-delay:-5s}
.n4{animation-delay:-4s}
.n3{animation-delay:-3s}
.n2{animation-delay:-2s}
.n1{animation-delay:-1s}
@keyframes floatUp{
  0%{transform:translateY(0)}
  100%{transform:translateY(-1080px)}
}
@keyframes twinkle{
  0%,100%{transform:scale(0.35) rotate(0deg);opacity:0.25}
  50%{transform:scale(1.15) rotate(22deg);opacity:1}
}
@keyframes fwExpand{
  0%{transform:scale(0.12);opacity:0}
  18%{opacity:0.95}
  62%{transform:scale(1.05);opacity:0.65}
  85%{transform:scale(1.22);opacity:0}
  100%{transform:scale(1.22);opacity:0}
}
@keyframes fwRing{
  0%{transform:scale(0.1);opacity:0}
  15%{opacity:0.8}
  58%{transform:scale(1.18);opacity:0}
  100%{transform:scale(1.18);opacity:0}
}
@keyframes neonBreathe{
  0%,100%{opacity:0.86}
  50%{opacity:1}
}
@keyframes titlePulse{
  0%,100%{opacity:0.9}
  50%{opacity:1}
}
@keyframes sweepRing{
  0%{stroke-dashoffset:1319.47}
  100%{stroke-dashoffset:0}
}
@keyframes orbitSpark{
  0%{transform:rotate(0deg)}
  100%{transform:rotate(360deg)}
}
@keyframes tickWave{
  0%{transform:scale(0.96);opacity:0.75}
  45%{transform:scale(1.12);opacity:0}
  100%{transform:scale(1.12);opacity:0}
}
@keyframes spinSlow{
  0%{transform:rotate(0deg)}
  100%{transform:rotate(-360deg)}
}
@keyframes countSlot{
  0%{opacity:0;transform:scale(0.84)}
  1.2%{opacity:1;transform:scale(1.04)}
  2.2%{opacity:1;transform:scale(1)}
  8.6%{opacity:1;transform:scale(1)}
  9.8%{opacity:0;transform:scale(1.1)}
  100%{opacity:0;transform:scale(1.1)}
}
</style>
</head>
