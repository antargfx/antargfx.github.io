<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minimalist Noir Gold Pinstripe & Floating Hexagonal Wireframe Loop Background</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#040405}
#stage{width:100%;height:100%;display:block}
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1C20"/>
      <stop offset="48%" stop-color="#0E1013"/>
      <stop offset="100%" stop-color="#040405"/>
    </linearGradient>

    <radialGradient id="ambientGlowLeft" cx="16%" cy="32%" r="42%">
      <stop offset="0%" stop-color="#9A7B3E" stop-opacity="0.11"/>
      <stop offset="55%" stop-color="#5C4820" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#040405" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ambientGlowRight" cx="84%" cy="68%" r="44%">
      <stop offset="0%" stop-color="#9A7B3E" stop-opacity="0.1"/>
      <stop offset="55%" stop-color="#5C4820" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#040405" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="centerVignette" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0A0B0D" stop-opacity="0"/>
      <stop offset="72%" stop-color="#040405" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#020203" stop-opacity="0.62"/>
    </radialGradient>

    <linearGradient id="stripeSheen" gradientUnits="userSpaceOnUse" x1="-400" y1="0" x2="2320" y2="1080">
      <stop offset="0%" stop-color="#9A7B3E" stop-opacity="0.09"/>
      <stop offset="32%" stop-color="#9A7B3E" stop-opacity="0.11"/>
      <stop offset="47%" stop-color="#D4AF37" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#F3D06B" stop-opacity="0.38"/>
      <stop offset="53%" stop-color="#D4AF37" stop-opacity="0.28"/>
      <stop offset="68%" stop-color="#9A7B3E" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#9A7B3E" stop-opacity="0.09"/>
    </linearGradient>

    <linearGradient id="goldBevelA" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1920" y2="1080">
      <stop offset="0%" stop-color="#7D6128"/>
      <stop offset="22%" stop-color="#D4AF37"/>
      <stop offset="36%" stop-color="#FFF2B8"/>
      <stop offset="46%" stop-color="#F3D06B"/>
      <stop offset="62%" stop-color="#8C6B29"/>
      <stop offset="78%" stop-color="#D4AF37"/>
      <stop offset="90%" stop-color="#F3D06B"/>
      <stop offset="100%" stop-color="#7D6128"/>
    </linearGradient>

    <linearGradient id="goldBevelB" gradientUnits="userSpaceOnUse" x1="1920" y1="0" x2="0" y2="1080">
      <stop offset="0%" stop-color="#6E5422"/>
      <stop offset="18%" stop-color="#C9A233"/>
      <stop offset="35%" stop-color="#F3D06B"/>
      <stop offset="50%" stop-color="#FFF4C4"/>
      <stop offset="64%" stop-color="#D4AF37"/>
      <stop offset="82%" stop-color="#7B5E25"/>
      <stop offset="100%" stop-color="#6E5422"/>
    </linearGradient>

    <linearGradient id="goldBevelInner" gradientUnits="userSpaceOnUse" x1="0" y1="1080" x2="1920" y2="0">
      <stop offset="0%" stop-color="#5E471C" stop-opacity="0.7"/>
      <stop offset="30%" stop-color="#D4AF37" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#FFF0AD" stop-opacity="1"/>
      <stop offset="70%" stop-color="#B8922F" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#5E471C" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="goldFine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1920" y2="1080">
      <stop offset="0%" stop-color="#9A7B3E" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#F3D06B" stop-opacity="0.95"/>
      <stop offset="52%" stop-color="#FFF4C2" stop-opacity="1"/>
      <stop offset="65%" stop-color="#D4AF37" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#9A7B3E" stop-opacity="0.45"/>
    </linearGradient>

    <linearGradient id="hexFacetFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3D06B" stop-opacity="0.045"/>
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.012"/>
      <stop offset="100%" stop-color="#040405" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="centerClearMaskGrad" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="52%" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="78%" stop-color="#ffffff" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </radialGradient>

    <mask id="gridCenterMask">
      <rect width="1920" height="1080" fill="url(#centerClearMaskGrad)"/>
    </mask>

    <pattern id="pinstripePattern" width="32" height="32" patternUnits="userSpaceOnUse">
      <line x1="0.5" y1="0" x2="0.5" y2="32" stroke="#9A7B3E" stroke-width="0.75" stroke-opacity="0.16"/>
      <line x1="16.5" y1="0" x2="16.5" y2="32" stroke="#9A7B3E" stroke-width="0.45" stroke-opacity="0.08"/>
      <line x1="0" y1="0.5" x2="32" y2="0.5" stroke="#9A7B3E" stroke-width="0.4" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgGrad)"/>
  <rect width="1920" height="1080" fill="url(#ambientGlowLeft)"/>
  <rect width="1920" height="1080" fill="url(#ambientGlowRight)"/>

  <g mask="url(#gridCenterMask)">
    <rect id="pinstripeBase" x="-64" y="-64" width="2048" height="1208" fill="url(#pinstripePattern)"/>
    <g id="sheenLines"></g>
  </g>

  <g id="layerDeep"></g>
  <g id="layerMid"></g>
  <g id="layerFront"></g>

  <rect width="1920" height="1080" fill="url(#centerVignette)" pointer-events="none"/>
</svg>
<script>
(function(){
  const NS="http://www.w3.org/2000/svg";
  const el=(tag,attrs,parent)=>{
    const n=document.createElementNS(NS,tag);
    for(const k in attrs)n.setAttribute(k,attrs[k]);
    if(parent)parent.appendChild(n);
    return n;
  };

  const hexPoints=(r)=>{
    const pts=[];
    for(let i=0;i<6;i++){
      const a=(Math.PI/180)*(i*60-90);
      pts.push((Math.cos(a)*r).toFixed(2)+","+(Math.sin(a)*r).toFixed(2));
    }
    return pts.join(" ");
  };

  const sheenGroup=document.getElementById("sheenLines");
  for(let x=0;x<=1920;x+=32){
    el("line",{
      x1:x+0.5,y1:0,x2:x+0.5,y2:1080,
      stroke:"url(#stripeSheen)",
      "stroke-width":"0.85"
    },sheenGroup);
  }

  const createHexAssembly=(parent,cfg)=>{
    const g=el("g",{},parent);
    const r=cfg.r;

    if(cfg.fill){
      el("polygon",{
        points:hexPoints(r),
        fill:"url(#hexFacetFill)"
      },g);
    }

    if(cfg.bevel){
      el("polygon",{
        points:hexPoints(r),
        fill:"none",
        stroke:"#030304",
        "stroke-width":(cfg.sw+3.6).toFixed(2),
        "stroke-opacity":"0.52",
        "stroke-linejoin":"miter",
        "stroke-miterlimit":"10",
        transform:"translate(2.5,3)"
      },g);
    }

    el("polygon",{
      points:hexPoints(r),
      fill:"none",
      stroke:cfg.stroke,
      "stroke-width":cfg.sw,
      "stroke-opacity":cfg.op,
      "stroke-linejoin":"miter",
      "stroke-miterlimit":"10"
    },g);

    if(cfg.innerScale){
      el("polygon",{
        points:hexPoints(r*cfg.innerScale),
        fill:"none",
        stroke:cfg.innerStroke||"url(#goldBevelInner)",
        "stroke-width":(cfg.sw*0.42).toFixed(2),
        "stroke-opacity":(cfg.op*0.78).toFixed(2),
        "stroke-linejoin":"miter",
        "stroke-miterlimit":"10"
      },g);
    }

    if(cfg.outerHairline){
      el("polygon",{
        points:hexPoints(r*cfg.outerHairline),
        fill:"none",
        stroke:"url(#goldFine)",
        "stroke-width":"0.9",
        "stroke-opacity":(cfg.op*0.48).toFixed(2),
        "stroke-linejoin":"miter"
      },g);
    }

    if(cfg.vertices){
      for(let i=0;i<6;i++){
        const a=(Math.PI/180)*(i*60-90);
        const vx=Math.cos(a)*r;
        const vy=Math.sin(a)*r;
        el("circle",{
          cx:vx.toFixed(2),
          cy:vy.toFixed(2),
          r:cfg.vertexR||2.4,
          fill:"#FFF2B8",
          "fill-opacity":(cfg.op*0.92).toFixed(2)
        },g);
      }
    }

    if(cfg.ticks){
      for(let i=0;i<6;i++){
        const a=(Math.PI/180)*(i*60-90);
        const x1=Math.cos(a)*(r*0.86);
        const y1=Math.sin(a)*(r*0.86);
        const x2=Math.cos(a)*(r*0.94);
        const y2=Math.sin(a)*(r*0.94);
        el("line",{
          x1:x1.toFixed(2),y1:y1.toFixed(2),
          x2:x2.toFixed(2),y2:y2.toFixed(2),
          stroke:"url(#goldFine)",
          "stroke-width":"1.1",
          "stroke-opacity":(cfg.op*0.65).toFixed(2)
        },g);
      }
    }

    return {el:g,cfg};
  };

  const layerDeep=document.getElementById("layerDeep");
  const layerMid=document.getElementById("layerMid");
  const layerFront=document.getElementById("layerFront");

  const items=[
    createHexAssembly(layerDeep,{
      x:150,y:210,r:290,sw:1.4,op:0.26,stroke:"url(#goldBevelB)",
      innerScale:0.93,bevel:false,fill:false,
      dx:28,dy:-22,rot:2.2,phase:0.2,dir:1
    }),
    createHexAssembly(layerDeep,{
      x:390,y:890,r:245,sw:1.3,op:0.22,stroke:"url(#goldBevelA)",
      innerScale:0.92,bevel:false,fill:false,
      dx:24,dy:-18,rot:-1.8,phase:1.7,dir:1
    }),
    createHexAssembly(layerDeep,{
      x:1780,y:830,r:310,sw:1.5,op:0.28,stroke:"url(#goldBevelA)",
      innerScale:0.94,bevel:false,fill:false,
      dx:30,dy:-24,rot:2.0,phase:3.1,dir:1
    }),
    createHexAssembly(layerDeep,{
      x:1530,y:170,r:240,sw:1.25,op:0.22,stroke:"url(#goldBevelB)",
      innerScale:0.92,bevel:false,fill:false,
      dx:22,dy:-18,rot:-2.1,phase:4.4,dir:1
    }),

    createHexAssembly(layerMid,{
      x:240,y:340,r:215,sw:3.4,op:0.92,stroke:"url(#goldBevelA)",
      innerScale:0.915,outerHairline:1.055,bevel:true,fill:true,vertices:true,vertexR:2.6,ticks:true,
      dx:-38,dy:26,rot:-2.8,phase:0.0,dir:-1
    }),
    createHexAssembly(layerMid,{
      x:115,y:765,r:168,sw:2.8,op:0.84,stroke:"url(#goldBevelB)",
      innerScale:0.905,bevel:true,fill:true,vertices:false,ticks:true,
      dx:-32,dy:24,rot:2.5,phase:1.4,dir:-1
    }),
    createHexAssembly(layerMid,{
      x:445,y:110,r:118,sw:2.2,op:0.74,stroke:"url(#goldBevelA)",
      innerScale:0.89,bevel:true,fill:false,vertices:true,vertexR:2.0,
      dx:-28,dy:20,rot:-3.2,phase:2.6,dir:-1
    }),
    createHexAssembly(layerMid,{
      x:1695,y:710,r:225,sw:3.6,op:0.94,stroke:"url(#goldBevelB)",
      innerScale:0.915,outerHairline:1.055,bevel:true,fill:true,vertices:true,vertexR:2.7,ticks:true,
      dx:-40,dy:28,rot:2.6,phase:0.8,dir:-1
    }),
    createHexAssembly(layerMid,{
      x:1795,y:265,r:162,sw:2.7,op:0.82,stroke:"url(#goldBevelA)",
      innerScale:0.905,bevel:true,fill:true,ticks:true,
      dx:-34,dy:22,rot:-2.4,phase:3.6,dir:-1
    }),
    createHexAssembly(layerMid,{
      x:1485,y:965,r:122,sw:2.3,op:0.76,stroke:"url(#goldBevelB)",
      innerScale:0.89,bevel:true,fill:false,vertices:true,vertexR:2.0,
      dx:-26,dy:18,rot:3.0,phase:5.1,dir:-1
    }),

    createHexAssembly(layerFront,{
      x:435,y:625,r:82,sw:1.8,op:0.86,stroke:"url(#goldFine)",
      innerScale:0.86,bevel:true,fill:false,vertices:true,vertexR:1.9,
      dx:48,dy:-34,rot:4.2,phase:0.5,dir:1
    }),
    createHexAssembly(layerFront,{
      x:82,y:115,r:96,sw:2.1,op:0.78,stroke:"url(#goldBevelA)",
      innerScale:0.88,bevel:true,fill:false,
      dx:42,dy:-30,rot:-3.6,phase:2.1,dir:1
    }),
    createHexAssembly(layerFront,{
      x:1495,y:445,r:78,sw:1.75,op:0.84,stroke:"url(#goldFine)",
      innerScale:0.86,bevel:true,fill:false,vertices:true,vertexR:1.9,
      dx:46,dy:-32,rot:-4.0,phase:3.9,dir:1
    }),
    createHexAssembly(layerFront,{
      x:1845,y:985,r:104,sw:2.2,op:0.8,stroke:"url(#goldBevelB)",
      innerScale:0.88,bevel:true,fill:false,
      dx:44,dy:-28,rot:3.5,phase:5.4,dir:1
    }),
    createHexAssembly(layerFront,{
      x:320,y:960,r:56,sw:1.45,op:0.72,stroke:"url(#goldFine)",
      innerScale:0.82,bevel:false,fill:false,vertices:true,vertexR:1.6,
      dx:36,dy:-26,rot:5.0,phase:1.1,dir:1
    }),
    createHexAssembly(layerFront,{
      x:1615,y:105,r:58,sw:1.45,op:0.72,stroke:"url(#goldFine)",
      innerScale:0.82,bevel:false,fill:false,vertices:true,vertexR:1.6,
      dx:38,dy:-24,rot:-4.8,phase:4.7,dir:1
    })
  ];

  const gradA=document.getElementById("goldBevelA");
  const gradB=document.getElementById("goldBevelB");
  const gradInner=document.getElementById("goldBevelInner");
  const gradFine=document.getElementById("goldFine");
  const stripeSheen=document.getElementById("stripeSheen");
  const pinstripeBase=document.getElementById("pinstripeBase");

  const PERIOD=10000;
  const TWO_PI=Math.PI*2;

  const render=(ts)=>{
    const t=((ts%PERIOD)+PERIOD)%PERIOD/PERIOD;
    const a=t*TWO_PI;
    const sinA=Math.sin(a);
    const cosA=Math.cos(a);

    pinstripeBase.setAttribute("transform","translate("+(t*32).toFixed(3)+",0)");

    const sx=sinA*680;
    const sy=cosA*260;
    stripeSheen.setAttribute("x1",(-400+sx).toFixed(2));
    stripeSheen.setAttribute("y1",(0+sy).toFixed(2));
    stripeSheen.setAttribute("x2",(2320+sx).toFixed(2));
    stripeSheen.setAttribute("y2",(1080+sy).toFixed(2));

    const gx1=960-1150*cosA;
    const gy1=540-780*sinA;
    const gx2=960+1150*cosA;
    const gy2=540+780*sinA;
    gradA.setAttribute("x1",gx1.toFixed(2));
    gradA.setAttribute("y1",gy1.toFixed(2));
    gradA.setAttribute("x2",gx2.toFixed(2));
    gradA.setAttribute("y2",gy2.toFixed(2));

    const bx1=960+1150*Math.cos(a+1.05);
    const by1=540-780*Math.sin(a+1.05);
    const bx2=960-1150*Math.cos(a+1.05);
    const by2=540+780*Math.sin(a+1.05);
    gradB.setAttribute("x1",bx1.toFixed(2));
    gradB.setAttribute("y1",by1.toFixed(2));
    gradB.setAttribute("x2",bx2.toFixed(2));
    gradB.setAttribute("y2",by2.toFixed(2));

    const ix1=960-1000*Math.sin(a);
    const iy1=540+700*Math.cos(a);
    const ix2=960+1000*Math.sin(a);
    const iy2=540-700*Math.cos(a);
    gradInner.setAttribute("x1",ix1.toFixed(2));
    gradInner.setAttribute("y1",iy1.toFixed(2));
    gradInner.setAttribute("x2",ix2.toFixed(2));
    gradInner.setAttribute("y2",iy2.toFixed(2));

    const fx1=960-1080*Math.cos(a-0.7);
    const fy1=540-720*Math.sin(a-0.7);
    const fx2=960+1080*Math.cos(a-0.7);
    const fy2=540+720*Math.sin(a-0.7);
    gradFine.setAttribute("x1",fx1.toFixed(2));
    gradFine.setAttribute("y1",fy1.toFixed(2));
    gradFine.setAttribute("x2",fx2.toFixed(2));
    gradFine.setAttribute("y2",fy2.toFixed(2));

    for(let i=0;i<items.length;i++){
      const c=items[i].cfg;
      const ang=a+c.phase;
      const ox=Math.sin(ang)*c.dx;
      const oy=Math.cos(ang)*c.dy;
      const rDeg=Math.sin(ang)*c.rot;
      const sc=1+Math.sin(ang*2)*0.012;
      items[i].el.setAttribute(
        "transform",
        "translate("+(c.x+ox).toFixed(2)+","+(c.y+oy).toFixed(2)+") rotate("+rDeg.toFixed(3)+") scale("+sc.toFixed(4)+")"
      );
    }

    requestAnimationFrame(render);
  };

  render(0);
})();
</script>
</body>
</html>
