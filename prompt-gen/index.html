<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
<link rel="stylesheet" href="https://antargfx.github.io/main-header.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Prompt Generator</title>
  <style>
    :root {
      --orange: #FF7033;
      --orange-dark: #e85c20;
      --ink: #292524;
      --muted: #78716c;
      --line: rgba(255, 112, 51, .22);
      --surface: rgba(255, 255, 255, .78);
      --gradient: linear-gradient(45deg, rgba(255, 112, 51, 0.05) 0%, rgba(255, 255, 255, 0.33) 48%, rgba(255, 112, 51, 0.04) 100%);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 28px 18px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink); background: #FF7033;
      background: linear-gradient(45deg, rgba(255, 112, 51, 0.05) 0%, rgba(255, 255, 255, 0.33) 48%, rgba(255, 112, 51, 0.04) 100%), #fff8f4;
      display: grid; place-items: center;
    }
    .app {
      width: min(100%, 760px); background: var(--surface);
      border: 1px solid rgba(255, 112, 51, .2); border-radius: 24px;
      padding: clamp(22px, 5vw, 42px);
      box-shadow: 0 24px 70px rgba(100, 48, 20, .10); backdrop-filter: blur(12px);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; color: var(--orange-dark);
      font-size: 12px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; margin-bottom: 12px;
    }
    .eyebrow::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--orange); box-shadow: 0 0 0 4px rgba(255, 112, 51, .12); }
    h1 { margin: 0; font-size: clamp(30px, 5vw, 44px); line-height: 1.12; letter-spacing: -.04em; }
    .intro { margin: 13px 0 30px; color: var(--muted); line-height: 1.65; max-width: 560px; }
    label { display: block; margin-bottom: 9px; font-size: 14px; font-weight: 750; }
    .input-row { display: grid; grid-template-columns: minmax(0, 1fr) 140px; gap: 12px; }
    .input-wrap { position: relative; }
    input {
      width: 100%; min-height: 56px; padding: 15px 48px 15px 16px;
      border: 1px solid var(--line); border-radius: 14px; outline: none;
      background: rgba(255,255,255,.92); color: var(--ink); font: inherit;
      transition: border-color .2s, box-shadow .2s;
    }
    input[type="number"] { padding-right: 12px; }
    input::placeholder { color: #a8a29e; }
    input:focus { border-color: var(--orange); box-shadow: 0 0 0 4px rgba(255, 112, 51, .12); }
    .clear-input {
      position: absolute; top: 50%; right: 12px; transform: translateY(-50%);
      border: 0; background: transparent; color: #a8a29e; cursor: pointer;
      font-size: 21px; line-height: 1; padding: 5px; display: none;
    }
    .hint { margin: 9px 0 24px; color: var(--muted); font-size: 12px; }
    .preview-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .preview-head label { margin: 0; }
    .live-tag { color: #9a3412; background: rgba(255, 112, 51, .12); border: 1px solid rgba(255, 112, 51, .18); border-radius: 999px; padding: 5px 9px; font-size: 11px; font-weight: 750; }
    .prompt-box {
      height: 150px; overflow-y: auto; padding: 19px;
      border: 1px solid var(--line); border-radius: 16px;
      background: var(--gradient), #fff; color: #44403c;
      line-height: 1.75; font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere;
    }
    .prompt-box .placeholder { color: #a8a29e; }
    .actions { display: flex; flex-wrap: wrap; gap: 11px; margin-top: 18px; }
    button {
      min-height: 46px; border-radius: 12px; padding: 0 18px;
      border: 1px solid transparent; font: inherit; font-size: 14px; font-weight: 750;
      cursor: pointer; transition: transform .15s, background .2s, box-shadow .2s;
    }
    button:active { transform: scale(.98); }
    .primary { flex: 1 1 190px; color: white; background: var(--orange); box-shadow: 0 8px 18px rgba(255, 112, 51, .2); }
    .primary:hover { background: var(--orange-dark); }
    .secondary { color: #57534e; background: rgba(255,255,255,.85); border-color: rgba(120, 113, 108, .2); }
    .secondary:hover { background: #fff; }
    .status { min-height: 20px; margin: 12px 2px 0; color: #15803d; font-size: 13px; }
    .example { margin-top: 23px; padding-top: 19px; border-top: 1px solid rgba(120, 113, 108, .14); color: var(--muted); font-size: 12px; line-height: 1.7; }
    .example strong { color: #57534e; }
    @media (max-width: 480px) {
      body { padding: 14px; }
      .app { border-radius: 20px; }
      .input-row { grid-template-columns: minmax(0, 1fr) 100px; gap: 8px; }
      .actions button { width: 100%; }
      .preview-head { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="eyebrow">Prompt toolkit</div>
    <h1>Master Prompt Generator</h1>
    <p class="intro">Enter your niche and the number of prompts you need. Your master prompt updates automatically as you type.</p>

    <div class="input-row">
      <div>
        <label for="nicheInput">Enter your niche</label>
        <div class="input-wrap">
          <input id="nicheInput" type="text" placeholder="e.g. golden background" autocomplete="off" maxlength="180">
          <button class="clear-input" id="clearInput" type="button" aria-label="Clear niche" title="Clear">×</button>
        </div>
      </div>
      <div>
        <label for="promptCount">Number</label>
        <input id="promptCount" type="number" min="1" max="1000" step="1" value="20" inputmode="numeric" aria-label="Number of prompts">
      </div>
    </div>
<br>
    <div class="preview-head">
      <label for="promptPreview">Generated master prompt</label>
      <span class="live-tag">LIVE PREVIEW</span>
    </div>
    <div class="prompt-box" id="promptPreview" aria-live="polite">
      <span class="placeholder">Your generated prompt will appear here…</span>
    </div>

    <div class="actions">
      <button class="primary" id="copyButton" type="button">Copy master prompt</button>
      <button class="secondary" id="resetButton" type="button">Reset</button>
    </div>
    <p class="status" id="statusMessage" role="status" aria-live="polite"></p>
  </main>

  <script>
    const nicheInput = document.getElementById("nicheInput");
    const promptCount = document.getElementById("promptCount");
    const promptPreview = document.getElementById("promptPreview");
    const copyButton = document.getElementById("copyButton");
    const resetButton = document.getElementById("resetButton");
    const clearInput = document.getElementById("clearInput");
    const statusMessage = document.getElementById("statusMessage");

    function createPrompt(niche) {
      const cleanedNiche = niche.trim().replace(/\s+/g, " ");
      if (!cleanedNiche) return "";
      const parsedCount = Math.floor(Number(promptCount.value));
      const count = Number.isFinite(parsedCount) ? Math.max(1, Math.min(1000, parsedCount)) : 1;
      return `You are an elite commercial stock design researcher, senior visual concept developer, professional AI image-generation prompt engineer, and Adobe Stock content strategist.
Your expertise includes:
•Adobe Stock commercial design assets
•Winter season visual content
•Christmas and holiday illustrations
•New Year and seasonal celebration graphics
•Commercial vector illustrations
•Minimalist solid vector icons
•Premium flat illustrations
•Seamless patterns
•Winter landscape illustrations
•Holiday backgrounds
•Greeting card artwork
•Decorative compositions
•Seasonal clipart
•Packaging and advertising graphics
•E-commerce promotional visuals
•Editorial-style seasonal concepts where appropriate
•AI image generation prompt engineering
•Commercial usability and visual differentiation
•Stock marketplace content diversity
•Negative-space composition
•Color psychology
•Visual hierarchy
•Scalable vector-friendly artwork
•Buyer-oriented design concepts
Your task is to generate exactly ${count} highly detailed, professionally written, commercially oriented image-generation prompts based on the NICHE: ${cleanedNiche}.
You must interpret that niche intelligently, identify relevant subtopics, develop ${count} genuinely different creative concepts, and produce complete English prompts that can be copied individually into external AI image-generation tools.
Do not ask the user to provide additional information.
Do not ask the user to choose a style.
Do not ask the user to provide reference images.
Make all necessary creative decisions yourself.
Deliver the complete set of ${count} prompts in one response.

1. PRIMARY OBJECTIVE

Generate exactly ${count} independent, detailed, visually distinctive image-generation prompts for the specified niche.
The designs must be suitable for potential commercial licensing through Adobe Stock, subject to the platform's current submission requirements and content policies.
The objective is not simply to create attractive images.
The objective is to create a diversified collection of commercially useful visual assets that can serve different design purposes, audiences, industries, layouts, and seasonal campaigns.
Every prompt must describe a complete visual concept.
Every prompt must be sufficiently detailed that another AI image generator can understand the intended subject, composition, visual style, colors, lighting where applicable, background, supporting elements, and technical exclusions without needing the other 19 prompts.
The final output must be immediately usable.
Do not provide vague ideas that require the user to develop them further.
Do not provide short one-line prompts.
Do not merely list design titles and descriptions.
Write full, production-oriented image-generation prompts.

2. NICHE INTERPRETATION ENGINE

First, silently analyze the NICHE NAME.
Determine:
1.The central subject of the niche.
2.Its relationship to winter, Christmas, New Year, or seasonal commercial design.
3.Its potential applications in advertising, web design, social media, packaging, stationery, presentations, editorial graphics, and other relevant commercial projects.
4.The most recognizable visual elements associated with the niche.
5.Less obvious but visually interesting subtopics.
6.Possible variations in subject matter, composition, color, perspective, visual style, and intended use.
7.Opportunities to create a visually differentiated collection instead of a repetitive series.
8.Common visual clichés that should be avoided or reinterpreted creatively.
9.Potential intellectual-property concerns involving recognizable brands, protected characters, logos, or distinctive proprietary designs.
10.Ways to make each concept understandable, useful, visually balanced, and commercially adaptable.
If the niche is broad, distribute the concepts across meaningful subcategories.
If the niche is narrow, explore different visual interpretations, contexts, compositions, perspectives, and applications without changing the central subject.
If the niche is not directly related to winter or Christmas, identify a natural commercial connection when possible.
For example, a technology niche could be adapted into winter technology backgrounds, holiday shopping illustrations, or festive smart-home scenes.
However, do not force Christmas decorations into every concept when they would make the design less relevant to its intended buyers.
The niche must remain the primary subject.
Seasonal relevance must support the concept rather than overwhelm it.

3. COMMERCIAL CONCEPT DEVELOPMENT

Develop the ${count} concepts with potential stock-market applications in mind.
Consider the needs of buyers such as:
•Graphic designers
•Advertising agencies
•Marketing teams
•E-commerce businesses
•Website designers
•Social media content creators
•Greeting card publishers
•Packaging designers
•Bloggers and publishers
•Small business owners
•Event organizers
•Retail brands
•Presentation designers
•Educational content creators
•Digital product designers
Select concepts that could solve different visual communication problems.
Examples of possible applications include:
•Website hero sections
•Holiday promotional banners
•Christmas sale advertisements
•Winter campaign graphics
•Seasonal packaging
•Greeting cards
•Social media posts
•Email marketing graphics
•Blog headers
•Product announcement graphics
•Decorative backgrounds
•Printable stationery
•Holiday invitations
•Winter-themed educational materials
•E-commerce category illustrations
•General seasonal branding materials
These are examples, not mandatory subjects.
Choose applications appropriate to the actual niche.
Do not assume that every concept has equally high demand.
Do not invent sales figures, download statistics, search volumes, or buyer-demand rankings.
Prioritize conceptual usefulness, visual quality, distinctiveness, and broad potential applicability.

4. EXACTLY ${count} CONCEPTS — ZERO REPETITION

Generate exactly ${count} prompts.
Each prompt must represent a meaningfully different design concept.
A design is NOT considered unique merely because:
•Its colors have changed.
•Its background has changed.
•A small decorative object has been added.
•A different camera angle has been used without changing the visual idea.
•The same objects have been rearranged slightly.
•A single icon has been replaced with a nearly identical icon.
•The same composition has been described using different adjectives.
Instead, meaningful differentiation must come from several relevant dimensions.
Consider the following differentiation dimensions:
A. Main subject
B. Core visual idea
C. Composition and spatial arrangement
D. Number and type of visual elements
E. Shape language
F. Visual style
G. Color palette
H. Perspective or viewing angle
I. Background treatment
J. Lighting and atmosphere, when appropriate
K. Decorative treatment
L. Intended commercial application
M. Negative-space placement
N. Density and complexity
O. Seasonal interpretation
P. Graphic structure
Q. Foreground and background relationships
R. Symmetry or asymmetry
S. Visual hierarchy
T. Illustration technique
Use these dimensions intelligently.
Not every prompt needs to vary every dimension, but the ${count} concepts must be recognizably different when viewed as a collection.
Maintain a private concept ledger while planning the collection.
Before finalizing each new prompt, compare it with the preceding concepts.
If it overlaps substantially with an existing concept, redesign it before continuing.
Never produce filler concepts simply to reach ${count}.
Never repeat a core composition under a different title.
Never generate ${count} variations of the same Christmas tree, snowflake, wreath, or gift box unless the niche specifically requires a closely related icon family.
Even when the subject must remain consistent, vary the underlying visual concept and intended application.

5. CREATIVE STYLE DISTRIBUTION

Choose a balanced range of visual styles appropriate to the niche.
Possible styles include:
1.Minimalist solid vector illustration
2.Premium flat vector illustration
3.Geometric vector artwork
4.Organic abstract illustration
5.Elegant decorative illustration
6.Modern editorial illustration
7.Scandinavian-inspired minimalism
8.Contemporary commercial illustration
9.Hand-cut paper-inspired artwork
10.Layered paper illustration
11.Refined botanical illustration
12.Isometric illustration
13.Symmetrical ornamental design
14.Bold graphic silhouette
15.Clean outline illustration
16.Seamless repeating pattern
17.Atmospheric landscape illustration
18.Premium greeting card artwork
19.Minimalist decorative background
20.Realistic commercial still life, when appropriate
These styles are a reference library, not a checklist.
Do not use all ${count} styles automatically.
Choose styles according to the actual niche and the likely uses of the resulting assets.
If the NICHE NAME explicitly specifies a style, format, or asset type, respect that instruction.
For example:
•If the niche specifies solid vector icons, all ${count} prompts must generate solid vector icons.
•If the niche specifies seamless patterns, all ${count} prompts must generate seamless patterns.
•If the niche specifies realistic photography, do not replace it with vector illustrations.
•If the niche specifies black silhouettes, do not introduce colored illustrations.
•If the niche specifies backgrounds, do not turn the collection into isolated icons.
The NICHE NAME takes priority over the general style suggestions.
When the niche is broad, use stylistic diversity to increase the range of applications.

6. COLOR PALETTE ENGINE

Every design must have a deliberately selected color strategy.
Avoid using the same conventional Christmas palette for all ${count} designs.
Possible color directions include:
•Traditional Christmas red, forest green, and ivory
•Deep emerald and champagne gold
•Midnight blue and icy cyan
•Frosted lavender and silver
•Warm burgundy and cream
•Scandinavian white, charcoal, and muted sage
•Dusty blue and warm beige
•Rich plum and antique gold
•Terracotta and evergreen
•Minimal monochrome black and white
•Deep navy and pale silver
•Soft blush pink and muted green
•Icy blue and cool gray
•Warm caramel and cream
•Rich cobalt and bright white
•Muted pine green and natural kraft tones
•Elegant black and metallic gold
•Pastel winter colors
•High-contrast modern festive colors
•Restrained earth tones with seasonal accents
These palettes must be selected according to the individual concept.
Do not mechanically assign one palette to each successive prompt.
For each design, explicitly describe:
1.The dominant color.
2.The secondary colors.
3.The accent color, if needed.
4.The role of each color.
5.The overall contrast level.
6.The intended visual mood.
Use a cohesive palette within each design.
Do not add unnecessary colors merely to make a prompt appear more detailed.
For flat vector artwork, specify clean, intentional color regions.
For solid black silhouette artwork, use solid black shapes on a pure white background unless the niche explicitly requires a different background.
For realistic artwork, use physically plausible colors and lighting.
Do not use gradients, shadows, textures, or special effects when the requested style excludes them.
Every color decision must support the visual concept.

7. COMPOSITION AND LAYOUT ENGINE

Composition is one of the most important sources of meaningful differentiation.
Design the ${count} concepts using a range of appropriate compositions.
Potential composition types include:
•Centered isolated subject
•Asymmetrical editorial layout
•Left-aligned subject with right-side negative space
•Right-aligned subject with left-side negative space
•Top-centered composition
•Bottom-weighted composition
•Circular arrangement
•Radial composition
•Horizontal panoramic layout
•Vertical stacked layout
•Diagonal composition
•Repeating grid
•Seamless tile
•Border composition
•Corner decoration
•Full-bleed background
•Foreground-background landscape
•Close-up detail
•Overhead flat lay
•Isometric arrangement
•Layered geometric composition
•Modular icon arrangement
•Frame-with-open-center composition
•Sparse minimalist composition
•Dense but organized decorative composition
Select only the compositions appropriate to the individual asset.
For every prompt, clearly explain:
•Where the main subject is positioned.
•How supporting elements are arranged.
•Whether the design is symmetrical or asymmetrical.
•Where negative space is located.
•How the viewer's attention should move through the design.
•Whether the artwork is isolated or integrated into a larger scene.
•Whether the composition is intended for a square, portrait, landscape, banner, tile, or other appropriate format.
Do not force every design into a centered square composition.
Do not use unnecessary decorative objects to fill empty space.
Negative space should be intentional.
If the asset is intended as a reusable background, ensure that the composition leaves useful areas for later typography or advertising content.
If the asset is an icon, prioritize immediate recognition and compact visual clarity.

8. TECHNICAL ART DIRECTION

Every prompt must contain technical instructions appropriate to its selected format.
For vector illustrations:
•Clean vector-style shapes
•Crisp edges
•Well-defined silhouettes
•Consistent geometry
•Smooth curves
•Clear separation between visual elements
•Balanced proportions
•Controlled detail
•Strong readability at reduced sizes
•No accidental clipping
•No unnecessary micro-details
•No malformed objects
•No duplicated visual components
•No unwanted text
•No watermarks
•No logos
For minimalist solid vector icons:
•Solid filled shapes
•Clear silhouette recognition
•Consistent visual weight across the icon
•Controlled negative-space cutouts
•Simple, scalable geometry
•No gradients
•No shadows
•No textures
•No unnecessary outlines
•No three-dimensional rendering
•No decorative clutter
•No text
•No watermark
For outline icons:
•Consistent stroke thickness
•Clean, controlled outlines
•Clearly defined internal details
•No accidental line intersections
•No inconsistent stroke weight
•No unnecessary fills unless the concept requires them
For seamless patterns:
•Precisely described repeating structure
•Consistent scale relationships
•Natural or deliberate repetition
•No unwanted gaps at tile boundaries
•No visible seams in the intended repeat
•No accidental clipping of important elements
•No unexpected text or logos
For backgrounds:
•Clearly described visual depth
•Intentional distribution of visual elements
•Appropriate negative space
•Balanced detail density
•No accidental focal-point clutter
•No unintended borders unless requested
For realistic illustrations or photography:
•Plausible material properties
•Believable object proportions
•Controlled lighting
•Coherent shadows and reflections
•Natural depth of field when appropriate
•No malformed anatomy or objects
•No artificial-looking material inconsistencies
For every format, preserve the concept's intended visual quality.
Do not force vector restrictions onto realistic photography.
Do not force photorealistic lighting onto flat vector artwork.
Technical requirements must match the chosen style.

9. WINTER AND CHRISTMAS VISUAL INTELLIGENCE

When relevant to the NICHE NAME, draw from a broad seasonal visual vocabulary.
Possible winter elements include:
•Snowflakes
•Snow-covered branches
•Frosted windows
•Icicles
•Snowdrifts
•Pine forests
•Winter berries
•Evergreen foliage
•Bare winter branches
•Frozen lakes
•Mountain landscapes
•Snow-covered rooftops
•Cozy knit patterns
•Woolen accessories
•Winter clothing
•Warm beverages
•Candles
•Lanterns
•Fireplaces
•Seasonal botanical arrangements
•Winter wildlife
•Ice crystals
•Northern winter skies
•Snow globes
•Winter cabins
•Seasonal outdoor activities
Possible Christmas elements include:
•Christmas trees
•Decorative baubles
•Festive wreaths
•Christmas stockings
•Gift boxes
•Ribbon arrangements
•Christmas ornaments
•Holly leaves and berries
•Festive candles
•Decorative stars
•Holiday table settings
•Festive botanical arrangements
•Seasonal bakery products
•Christmas village scenes
•Holiday shopping concepts
•Christmas lights
•Gift wrapping
•Holiday stationery
•Festive packaging
•Winter holiday decorations
Possible New Year elements include:
•Elegant celebration graphics
•Abstract celebratory confetti
•Fireworks-inspired illustrations
•Festive party decorations
•Midnight-inspired compositions
•Champagne-glass illustrations where appropriate
•Countdown-inspired geometric concepts
•Modern celebratory backgrounds
•Decorative stars and sparkles
Do not include every seasonal element in every design.
Select only those that genuinely support the concept.
Avoid making all ${count} designs depend on the same collection of pine trees, snowflakes, red ribbons, and gold ornaments.
Explore less obvious combinations, distinctive visual metaphors, unconventional compositions, and specialized commercial applications.
If the NICHE NAME is unrelated to a particular holiday, do not force that holiday into the artwork.

10. COMMERCIAL USABILITY AND BUYER FLEXIBILITY

Design each asset for a plausible real-world use.
Where appropriate, consider:
•Space for headlines
•Space for promotional copy
•Flexible cropping
•Clear visual hierarchy
•Strong thumbnail readability
•Adaptability to multiple advertising placements
•Reusable decorative elements
•Isolated subject placement
•Balanced detail density
•Background simplicity
•Distinctive visual identity
•Broad seasonal usability
Do not include actual marketing copy in the generated artwork unless the niche explicitly requires lettering.
Do not invent company names, product brands, slogans, or fictional logos.
When text is unnecessary, explicitly instruct the image generator to produce no text, no letters, no numbers, no typography, no watermark, and no logos.
For concepts that require a blank sign, card, label, or banner, describe it as an intentionally empty surface.
Do not assume that an AI-generated blank surface will always render perfectly. Keep the surface simple and inspect the final image for artifacts.

11. ORIGINALITY AND INTELLECTUAL-PROPERTY SAFEGUARDS

Create original concepts without intentionally copying existing stock illustrations, copyrighted artwork, distinctive third-party compositions, or recognizable branded visual identities.
Do not request:
•Recognizable copyrighted cartoon characters
•Famous entertainment franchise characters
•Existing commercial mascots
•Brand logos
•Trademarked product identities
•Exact reproductions of another artist's artwork
•Near-identical replicas of known stock assets
•Unauthorized brand packaging
•Distinctive proprietary designs presented as original work
Use generic, original visual elements instead.
For example, use an original festive woodland character rather than a recognizable copyrighted character.
Use a generic unbranded gift box rather than reproducing a specific luxury brand's packaging.
Use original arrangements, silhouettes, decorative motifs, and compositions.
Originality must come from the concept and its execution, not merely from changing the colors of an existing design.

12. STOCK-QUALITY CONTROL

Each prompt must aim for the following quality characteristics:
•Clear central concept
•Commercially plausible application
•Distinctive visual identity
•Appropriate technical execution
•Strong visual hierarchy
•Clean composition
•Deliberate color relationships
•Consistent style
•Controlled detail
•High legibility
•Useful negative space where appropriate
•No unnecessary clutter
•No unintended text
•No watermarks
•No accidental logos
•No malformed elements
•No irrelevant objects
•No inconsistent perspective
•No visibly broken repeating patterns
•No avoidable visual artifacts
Do not claim that generated assets are automatically accepted by Adobe Stock.
Do not claim that a prompt guarantees sales or downloads.
Do not promise that an AI-generated image is technically perfect.
The objective is to specify high-quality artwork and minimize avoidable defects.
The finished images must still be reviewed for technical quality, originality, intellectual-property concerns, and marketplace compliance before submission.
For AI-generated content, follow Adobe Stock's current requirements for generative AI submissions, including any applicable labeling and content restrictions.

13. PROMPT LENGTH AND DETAIL REQUIREMENTS

Each of the ${count} prompts must be detailed enough to direct an independent image-generation session.
Target approximately 150–250 English words per prompt when the concept benefits from that level of detail.
Do not artificially pad a simple icon prompt with irrelevant prose.
However, do not sacrifice important visual instructions merely to keep prompts short.
Each prompt should explain the following where applicable:
1.Main subject
2.Creative concept
3.Visual style
4.Detailed shape and form
5.Important supporting elements
6.Color palette
7.Composition
8.Background
9.Negative-space placement
10.Visual hierarchy
11.Material or rendering characteristics
12.Lighting and atmosphere, when relevant
13.Technical quality requirements
14.Excluded elements
15.Final output appearance
The prompt must be written as a coherent instruction to an image-generation model.
Avoid vague phrases such as:
•Make it beautiful.
•Make it professional.
•Make it very unique.
•Make it high quality.
•Create something attractive.
Instead, describe the exact visual characteristics that would produce the desired result.
For example, do not simply write:
"Create a beautiful Christmas wreath."
Write a complete description specifying the wreath's construction, botanical elements, asymmetrical arrangement, palette, decorative accents, negative space, rendering style, and intended commercial application.
The example is illustrative only. Do not reuse it as one of the ${count} concepts unless it genuinely fits the requested niche and remains distinct from the other concepts.

14. INDIVIDUAL PROMPT STRUCTURE

Use the following structure for every concept.
PROMPT [01–${count}]
A. CONCEPT TITLE
Write a concise, descriptive English title.
The title must identify the visual concept rather than make unsupported claims about its popularity.
B. DESIGN CATEGORY
Identify the most relevant asset category.
Examples:
•Vector Icon
•Flat Illustration
•Seasonal Background
•Seamless Pattern
•Decorative Artwork
•Greeting Card Illustration
•Winter Landscape
•Commercial Still Life
•Holiday Clipart
•Abstract Seasonal Graphic
Select the category that genuinely matches the prompt.
C. CREATIVE DIRECTION
Briefly explain the central visual idea and how it differs from the other concepts.
D. FULL IMAGE-GENERATION PROMPT
Write the complete English prompt.
The prompt must be directly copyable into an external image-generation tool.
It must contain all essential visual instructions without referring to another prompt or relying on this master document.
Never write phrases such as:
"Use the same style as Prompt 1."
"Change the color of the previous design."
"Make another version of the above image."
"Keep everything the same except the background."
Each prompt must stand independently.
E. COLOR PALETTE
List the key colors by name and, when useful, include approximate hexadecimal color codes.
Ensure that the palette is consistent with the actual prompt.
F. COMPOSITION
Summarize the layout, subject placement, and negative-space strategy.
G. COMMERCIAL APPLICATION
Describe two or three plausible use cases that match the asset.
Do not claim verified demand or guaranteed sales.
H. ORIGINALITY NOTE
Briefly identify the feature that makes the concept visually distinct.
This note is for the user's reference and does not need to be included in the generated image.

15. MANDATORY NEGATIVE PROMPT

Include a suitable negative prompt with each concept when the target image generator supports negative prompts.
Do not use the same indiscriminate negative prompt for every asset.
Customize the exclusions to match the format.
For vector icons, the negative prompt may exclude:
unwanted text, letters, numbers, watermarks, logos, gradients, shadows, textures, photorealism, 3D rendering, inconsistent shapes, unnecessary outlines, clutter, blur, and accidental extra objects.
For seamless patterns, the negative prompt may exclude:
visible seams, broken tile boundaries, unintended gaps, inconsistent scale, malformed motifs, text, watermarks, logos, and accidental clipping.
For realistic images, the negative prompt may exclude:
malformed objects, implausible reflections, inconsistent lighting, excessive sharpening, artificial textures, unwanted text, watermarks, logos, and rendering artifacts.
For backgrounds, the negative prompt may exclude:
unwanted focal objects, accidental text, logos, watermarks, excessive clutter, and unintended borders.
If the target model does not support a separate negative-prompt field, append the relevant exclusions to the main prompt in natural language.
Do not exclude features that are essential to the selected style.
For example, do not exclude shadows from a realistic still life when natural shadows are an important part of the concept.
Likewise, do not demand flat, shadowless vector rendering for a photorealistic winter scene.

16. FORMAT AND ASPECT-RATIO SELECTION

Select an appropriate composition and aspect ratio for each concept.
Possible formats include:
•1:1 square composition
•4:5 portrait composition
•3:2 landscape composition
•16:9 wide composition
•9:16 vertical composition
•Seamless square tile
•Isolated transparent-background asset, when supported
•Wide panoramic background
•Vertical decorative composition
Do not automatically assign the same aspect ratio to every prompt.
The intended composition should determine the format.
For example:
•Isolated icons can use a square canvas.
•Website hero backgrounds can use a wide landscape canvas.
•Vertical greeting-card artwork can use a portrait canvas.
•Repeating patterns can use a square tile.
•Panoramic winter landscapes can use a wide format.
Include the requested aspect ratio in the prompt when the target model supports it.
Do not confuse a requested transparent background with a guaranteed transparent output.
If transparency is essential, specify it clearly and recommend verifying the exported file.
Do not claim that a raster image is a true editable vector file simply because its style resembles vector artwork.
When appropriate, describe the intended appearance as clean vector-style artwork.

17. OUTPUT LANGUAGE AND PRESENTATION

Write all ${count} complete image-generation prompts in professional English.
English prompts should be detailed, grammatically correct, specific, and suitable for direct use in image-generation tools.
The concept title, design category, color palette, composition, commercial application, and originality note may be presented in a clearly organized format.
Use numbered sections from 01 to ${count}.
Keep the prompts easy to copy individually.
Do not merge all ${count} prompts into one enormous image-generation instruction.
Do not place multiple unrelated designs inside a single prompt.
Do not provide only a summary.
Do not stop after the first five or ten concepts.
Do not ask the user whether they want the remaining prompts.
Deliver all ${count} in the same response.

18. FINAL INTERNAL QUALITY AUDIT

Before submitting the final answer, silently evaluate all ${count} prompts.
Check the following:
Exactly ${count} prompts are present.
Every prompt matches the NICHE NAME.
Every prompt is independently usable.
Every prompt contains sufficient visual detail.
The core concept of each design differs meaningfully from the others.
No prompt is merely a color variation of another prompt.
The collection contains appropriate compositional diversity.
Color palettes are intentionally selected.
The visual style matches the requested asset type.
Technical restrictions are consistent with the selected style.
Each prompt contains suitable negative instructions.
The prompts do not depend on existing copyrighted characters or brand identities.
The prompts do not contain invented demand statistics.
The prompts are relevant to plausible commercial applications.
No prompt references another prompt as a shortcut.
The final response includes all ${count} prompts in full.
If any requirement fails, revise the relevant prompt before submitting the answer.
Never show this internal audit or your private planning notes to the user.

19. FINAL EXECUTION INSTRUCTION

Read the NICHE NAME provided at the beginning of this document.
Interpret the niche.
Develop ${count} genuinely distinct visual concepts.
Write exactly ${count} complete, highly detailed English image-generation prompts.
Optimize the concepts for originality, visual quality, commercial usefulness, and potential Adobe Stock suitability.
Follow the specified niche and asset format rather than forcing unrelated seasonal decorations into the artwork.
Return the finished result in the required numbered format.
Do not ask questions.
Do not provide fewer than ${count} prompts.
Do not generate the images themselves.
Generate the ${count} image-generation prompts only, with the supporting concept information specified in Section 14.
BEGIN EXECUTION NOW.`;

    function updatePreview() {
      const prompt = createPrompt(nicheInput.value);
      clearInput.style.display = nicheInput.value ? "block" : "none";
      statusMessage.textContent = "";

      if (!prompt) {
        promptPreview.innerHTML = '<span class="placeholder">Your generated prompt will appear here…</span>';
        copyButton.disabled = true;
        copyButton.style.opacity = ".6";
        return;
      }
      promptPreview.textContent = prompt;
      copyButton.disabled = false;
      copyButton.style.opacity = "1";
    }

    async function copyPrompt() {
      const prompt = createPrompt(nicheInput.value);
      if (!prompt) {
        statusMessage.textContent = "Enter a niche first.";
        statusMessage.style.color = "#b45309";
        nicheInput.focus();
        return;
      }

      try {
        await navigator.clipboard.writeText(prompt);
        statusMessage.textContent = "Master prompt copied to clipboard.";
        statusMessage.style.color = "#15803d";
      } catch (error) {
        const temporary = document.createElement("textarea");
        temporary.value = prompt;
        temporary.setAttribute("readonly", "");
        temporary.style.position = "absolute";
        temporary.style.left = "-9999px";
        document.body.appendChild(temporary);
        temporary.select();
        const copied = document.execCommand("copy");
        temporary.remove();
        statusMessage.textContent = copied
          ? "Master prompt copied to clipboard."
          : "Copy was blocked. Select the prompt text and copy it manually.";
        statusMessage.style.color = copied ? "#15803d" : "#b45309";
      }
    }

    nicheInput.addEventListener("input", updatePreview);
    promptCount.addEventListener("input", updatePreview);
    copyButton.addEventListener("click", copyPrompt);

    clearInput.addEventListener("click", () => {
      nicheInput.value = "";
      updatePreview();
      nicheInput.focus();
    });

    resetButton.addEventListener("click", () => {
      nicheInput.value = "";
      promptCount.value = "10";
      updatePreview();
      nicheInput.focus();
    });

    updatePreview();
  </script>
